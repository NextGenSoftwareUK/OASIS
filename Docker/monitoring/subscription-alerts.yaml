# Prometheus rules for the collector's standard dot-to-underscore metric translation.
# Route severity=critical to the billing on-call; include service_name and the runbook URL in notifications.
groups:
  - name: oasis-subscription-accounting
    rules:
      - alert: SubscriptionProviderRecoveryRequired
        expr: increase(oasis_usage_recovery_required_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Provider execution lacks authoritative terminal evidence
          description: Inspect the operation outbox and provider receipts; never rerun a provider or release unknown exposure as zero.
      - alert: SubscriptionSettlementBacklog
        expr: increase(oasis_usage_settlement_retries_total[10m]) > 5
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: WEB4 settlement delivery is repeatedly failing
          description: Repair authority connectivity or service credentials; retain the immutable outbox payload.
      - alert: SubscriptionReconciliationDrift
        expr: increase(oasis_subscription_reconciliation_findings_total[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Ledger, provider or Stripe evidence does not reconcile
          description: Read the persisted report and resolve its specific code with independent evidence and explicit corrections.
      - alert: SubscriptionReservationOverrun
        expr: increase(subscription_ledger_reservation_overruns_total[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: Actual provider usage exceeded an approved reservation
          description: Fix the service pricing/quantity upper bound before allowing further affected provider work.
      - alert: SubscriptionQuotaExhaustion
        expr: increase(subscription_ledger_denied_total[10m]) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Subscriber quota denials increased
          description: Inspect the denial reason and authoritative policy; do not bypass quotas in consuming services.
      - alert: SubscriptionDuplicateSpike
        expr: increase(oasis_usage_duplicates_total[10m]) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Duplicate operation execution attempts increased
          description: Check caller retry behavior and request keys. Confirm there was no second provider execution.
      - alert: SubscriptionAuthorityLatency
        expr: histogram_quantile(0.99, sum by (le, service_name) (rate(subscription_ledger_operation_duration_milliseconds_bucket[5m]))) > 2000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: WEB4 accounting transaction p99 exceeds two seconds
          description: Inspect Mongo transaction contention, indexes and replication health.
      - alert: SubscriptionExpiryWorkerFailure
        expr: increase(subscription_expiry_failures_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Reservation expiry worker cannot complete
          description: Repair the store; preserve reservations until a definitive state transition is committed.
