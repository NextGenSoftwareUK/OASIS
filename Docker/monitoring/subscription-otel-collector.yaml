# Run on the operator-owned collector host. Bind protected interfaces; do not expose ingest publicly.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  batch: {}
exporters:
  prometheus:
    endpoint: 127.0.0.1:9464
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
