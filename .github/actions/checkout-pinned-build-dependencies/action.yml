name: Checkout pinned build dependencies
description: Check out the sibling libraries and Holochain client at the deployment manifest revisions.
runs:
  using: composite
  steps:
    - name: Read build dependency pins
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        manifest=OASIS/Docker/oasis-dependency-versions.env
        for name in LIBRARIES_COMMIT HOLOCHAIN_COMMIT; do
          line=$(grep -E "^${name}=[0-9a-f]{40}$" "$manifest")
          [[ "$line" == "$name="* && "${#line}" -eq $(("${#name}" + 41)) ]]
          printf '%s\n' "$line" >> "$GITHUB_OUTPUT"
        done
    - name: Checkout NextGenSoftware-Libraries
      uses: actions/checkout@v7
      with:
        repository: NextGenSoftwareUK/NextGenSoftware-Libraries
        ref: ${{ steps.pins.outputs.LIBRARIES_COMMIT }}
        path: NextGenSoftware-Libraries
    - name: Checkout holochain-client-csharp
      uses: actions/checkout@v7
      with:
        repository: holochain-open-dev/holochain-client-csharp
        ref: ${{ steps.pins.outputs.HOLOCHAIN_COMMIT }}
        path: holochain-client-csharp
