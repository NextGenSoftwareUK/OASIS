name: Holochain listener maintenance

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - 'Scripts/HoloListenerMaintenance/**'
      - '.github/workflows/holo-listener-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: Scripts/HoloListenerMaintenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - run: cargo +1.96.0 fmt -- --check
      - run: cargo +1.96.0 test --jobs 2
      - name: Fingerprint the binary exercised by the encrypted fixture
        working-directory: Scripts/HoloListenerMaintenance/target/debug
        run: sha256sum oasis-holo-listener-maintenance > oasis-holo-listener-maintenance.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: holo-listener-maintenance-linux-x64
          path: |
            Scripts/HoloListenerMaintenance/target/debug/oasis-holo-listener-maintenance
            Scripts/HoloListenerMaintenance/target/debug/oasis-holo-listener-maintenance.sha256
          if-no-files-found: error
          retention-days: 1
