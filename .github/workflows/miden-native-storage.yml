name: Miden native storage

on:
  push:
    branches: [work/miden-native-storage]
    paths:
      - '.github/workflows/miden-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.MidenOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests/MidenNativeStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

env:
  MIDEN_VERSION: v0.18.3 # the SDK worker pins @miden-sdk/miden-sdk 0.18.1, the client line for this node release
  TESTS: Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: 0xMiden/miden-node
          ref: ${{ env.MIDEN_VERSION }}
          path: miden-node
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the provider tests and provision the pinned SDK worker
        run: |
          set -euo pipefail
          dotnet build "$TESTS" -p:NativeStorageConformance=true -m:2 -nr:false -p:UseSharedCompilation=false
          bridge="$(find "$TESTS/bin" -type d -name MidenSdkBridge | head -1)"
          test -f "$bridge/worker.mjs" && test -f "$bridge/oasis_kv.masm"
          (cd "$bridge" && npm ci --no-audit --no-fund)
          echo "BRIDGE=$PWD/$bridge" >> "$GITHUB_ENV"
      - name: Run the shared core storage suite against a disposable Miden local network and Kubo
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          kubo=""
          compose() { (cd "$GITHUB_WORKSPACE/miden-node" && docker compose -p oasis-miden "$@"); }
          for service in node validator genesis ntx-builder remote-prover funding-service network-monitor note-transport; do
            name="$(tr 'a-z-' 'A-Z_' <<<"$service")"
            export "MIDEN_${name}_IMAGE=ghcr.io/0xmiden/miden-${service}:${MIDEN_VERSION}"
          done
          cleanup() {
            status=$?
            if (( status != 0 )); then compose ps -a 2>/dev/null || true; compose logs --no-color --tail 40 2>/dev/null || true; fi
            compose down -v --remove-orphans >/dev/null 2>&1 || status=1
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          compose up -d --quiet-pull sequencer funding-service
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          for attempt in $(seq 1 120); do
            if nc -z 127.0.0.1 57291 && nc -z 127.0.0.1 50401 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 120 ]]; sleep 5
          done

          # Create, fund and deploy the public storage account once; the provider imports it by id.
          account_seed="$(openssl rand -hex 32)"; key_seed="$(openssl rand -hex 32)"
          request="$(jq -cn --arg a "$account_seed" --arg k "$key_seed" '{id:1,operation:"deploy",rpcUrl:"http://127.0.0.1:57291",accountSeed:$a,keySeed:$k,faucetUrl:"http://127.0.0.1:50401"}')"
          reply="$(printf '%s\n' "$request" | (cd "$BRIDGE" && node worker.mjs) | sed -n 's/^@@OASIS-MIDEN@@//p')"
          jq -e '.ok' <<<"$reply" >/dev/null || { jq -c '{ok, error}' <<<"$reply" >&2; exit 1; }
          account="$(jq -r .result.accountId <<<"$reply")"
          echo "Storage account $account funded with $(jq -r .result.balance <<<"$reply")"

          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_MIDEN_RPC_URL="http://127.0.0.1:57291" \
            OASIS_MIDEN_STORAGE_ACCOUNT="$account" OASIS_MIDEN_STORAGE_KEY_SEED="$key_seed" \
            OASIS_MIDEN_KUBO="http://127.0.0.1:15001" OASIS_MIDEN_STORAGE_KEY="$(openssl rand -base64 32)"
          dotnet test "$TESTS" --no-build -p:NativeStorageConformance=true \
            --filter "FullyQualifiedName~MidenNativeStorageConformanceTests" --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Miden passed both storage modes against a local network."
