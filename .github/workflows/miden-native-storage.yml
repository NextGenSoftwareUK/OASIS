name: Miden native storage

on:
  push:
    branches: [work/miden-native-storage, work/gpt-miden-native-integration]
    paths:
      - '.github/workflows/miden-native-storage.yml'
      - 'Docker/install-miden-sdk.sh'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.MidenOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests/MidenNativeStorageConformanceTests.cs'
  workflow_dispatch:
    inputs:
      packaging_only:
        description: Verify real publish-graph SDK packaging without repeating native ledger checks
        type: boolean
        default: false

permissions:
  contents: read

env:
  MIDEN_VERSION: v0.18.3 # the SDK worker pins @miden-sdk/miden-sdk 0.18.1, the client line for this node release
  TESTS: Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests

jobs:
  sdk-packaging:
    if: ${{ inputs.packaging_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        graph: [miden-provider, web6-api]
    env:
      QUALIFICATION_GRAPH: ${{ matrix.graph }}
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read recorded dependencies and Docker Node version
        id: dependencies
        shell: bash
        run: |
          for key in LIBRARIES_COMMIT HOLOCHAIN_COMMIT; do
            revision="$(sed -n "s/^$key=//p" Docker/oasis-dependency-versions.env)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
            echo "$key=$revision" >> "$GITHUB_OUTPUT"
          done
          node_version="$(sed -n 's/^FROM node:\([0-9.]*\)-bookworm-slim@sha256:.* AS provider_node$/\1/p' Docker/Dockerfile.web4)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.dependencies.outputs.node }}
      - name: Reserve the Docker-owned publish path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /app/publish
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app/publish
          printf '%s' "$GITHUB_RUN_ID-$QUALIFICATION_GRAPH" > /app/publish/.oasis-sdk-qualification-owner
      - name: Publish the actual provider consumer or WEB6 API under the build lease
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner miden-sdk-publish-qualification -Operation {
            if ($env:QUALIFICATION_GRAPH -eq 'miden-provider') {
              dotnet publish 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests' --configuration Release -p:NativeStorageConformance=true -o /app/publish -m:2 -nr:false -p:UseSharedCompilation=false
            } else {
              dotnet publish 'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj' --configuration Release -p:UseAppHost=false -o /app/publish -m:2 -nr:false -p:UseSharedCompilation=false
            }
            if ($LASTEXITCODE) { throw 'Shipping publish graph qualification failed.' }
          }
      - name: Package only SDKs in the real shipping publish graph
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$QUALIFICATION_GRAPH" == miden-provider ]]; then
            test -f /app/publish/NextGenSoftware.OASIS.API.Providers.MidenOASIS.dll
          else
            test ! -f /app/publish/NextGenSoftware.OASIS.API.Providers.MidenOASIS.dll
            test ! -e /app/publish/MidenSdkBridge
          fi
          bash Docker/package-provider-sdk-bridges.sh /app/publish
          if [[ "$QUALIFICATION_GRAPH" == miden-provider ]]; then
            test -f /app/publish/MidenSdkBridge/node_modules/@miden-sdk/miden-sdk/package.json
            echo 'Real Miden publish graph packaged the locked SDK and verified its actual exports.'
          else
            test ! -e /app/publish/MidenSdkBridge
            echo 'Real WEB6 publish graph requires no Miden SDK; canonical packaging succeeded.'
          fi
      - name: Remove only the owned published SDK and output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker=/app/publish/.oasis-sdk-qualification-owner
          if [[ -f "$marker" ]]; then
            [[ "$(cat "$marker")" == "$GITHUB_RUN_ID-$QUALIFICATION_GRAPH" ]]
            [[ "$(realpath /app/publish)" == /app/publish ]]
            rm -rf -- /app/publish
            test ! -e /app/publish
            echo 'Removed the owned publish graph and SDK output.'
          fi

  storage:
    if: ${{ !inputs.packaging_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: 0xMiden/miden-node
          ref: ${{ env.MIDEN_VERSION }}
          path: miden-node
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the provider tests and provision the pinned SDK worker
        run: |
          set -euo pipefail
          publish="$(mktemp -d "$RUNNER_TEMP/oasis-miden-publish.XXXXXXXX")"
          echo "PUBLISHED_MIDEN_TESTS=$publish" >> "$GITHUB_ENV"
          dotnet publish "$TESTS" -p:NativeStorageConformance=true -o "$publish" -m:2 -nr:false -p:UseSharedCompilation=false
          bridge="$publish/MidenSdkBridge"
          sh Docker/install-miden-sdk.sh "$bridge"
          echo "BRIDGE=$bridge" >> "$GITHUB_ENV"
      - name: Run the shared core storage suite against a disposable Miden local network and Kubo
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          kubo=""
          compose() { (cd "$GITHUB_WORKSPACE/miden-node" && docker compose -p oasis-miden "$@"); }
          for service in node validator genesis ntx-builder remote-prover funding-service network-monitor note-transport; do
            name="$(tr 'a-z-' 'A-Z_' <<<"$service")"
            export "MIDEN_${name}_IMAGE=ghcr.io/0xmiden/miden-${service}:${MIDEN_VERSION}"
          done
          cleanup() {
            status=$?
            if (( status != 0 )); then compose ps -a 2>/dev/null || true; compose logs --no-color --tail 40 2>/dev/null || true; fi
            compose down -v --remove-orphans >/dev/null 2>&1 || status=1
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          compose up -d --quiet-pull sequencer funding-service
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          for attempt in $(seq 1 120); do
            if nc -z 127.0.0.1 57291 && nc -z 127.0.0.1 50401 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 120 ]]; sleep 5
          done

          mkdir "$fixture/sdk-deploy" "$fixture/sdk-store"
          export OASIS_MIDEN_SDK_STORE_FILE="$fixture/sdk-deploy/store.db"
          # Create, fund and deploy the public storage account once; the provider imports it by id.
          account_seed="$(openssl rand -hex 32)"; key_seed="$(openssl rand -hex 32)"
          echo "::add-mask::$account_seed"
          echo "::add-mask::$key_seed"
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$encryption_key"
          request="$(jq -cn --arg a "$account_seed" --arg k "$key_seed" '{id:1,operation:"deploy",rpcUrl:"http://127.0.0.1:57291",accountSeed:$a,keySeed:$k,faucetUrl:"http://127.0.0.1:50401"}')"
          reply="$(printf '%s\n' "$request" | (cd "$BRIDGE" && node worker.mjs) | sed -n 's/^@@OASIS-MIDEN@@//p')"
          jq -e '.ok' <<<"$reply" >/dev/null || { jq -c '{ok, error}' <<<"$reply" >&2; exit 1; }
          account="$(jq -r .result.accountId <<<"$reply")"
          export OASIS_MIDEN_SDK_STORE_FILE="$fixture/sdk-store/store.db"
          echo "Storage account $account funded with $(jq -r .result.balance <<<"$reply")"

          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_MIDEN_RPC_URL="http://127.0.0.1:57291" \
            OASIS_MIDEN_STORAGE_ACCOUNT="$account" OASIS_MIDEN_STORAGE_KEY_SEED="$key_seed" \
            OASIS_MIDEN_KUBO="http://127.0.0.1:15001" OASIS_MIDEN_STORAGE_KEY="$encryption_key"
          dotnet vstest "$PUBLISHED_MIDEN_TESTS/NextGenSoftware.OASIS.API.Providers.MidenOASIS.IntegrationTests.dll" \
            --TestCaseFilter:"FullyQualifiedName~MidenNativeStorageConformanceTests" --logger:"console;verbosity=normal" \
            --logger:"trx;LogFileName=miden.trx" --ResultsDirectory:"$fixture"
          python3 - "$fixture/miden.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          results = ET.parse(sys.argv[1]).findall(".//{*}UnitTestResult")
          assert len(results) == 3 and all(row.get("outcome") == "Passed" for row in results)
          print("Both26-check native modes and the real SDK lifecycle case passed with zero skips.")
          PY
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Miden passed both storage modes against a local network."

      - name: Remove the owned published SDK and test output
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${PUBLISHED_MIDEN_TESTS:-}" ]]; then
            [[ "$PUBLISHED_MIDEN_TESTS" == "$RUNNER_TEMP"/oasis-miden-publish.* ]]
            rm -rf -- "$PUBLISHED_MIDEN_TESTS"
            test ! -e "$PUBLISHED_MIDEN_TESTS"
            echo "Removed the owned published Miden SDK and test output."
          fi
