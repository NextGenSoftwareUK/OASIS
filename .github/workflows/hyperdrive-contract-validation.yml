name: HyperDrive contract validation

on:
  pull_request:
    paths:
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/Controllers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core/Managers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/HyperDrive/**'
      - 'Docs/Devs/HYPERDRIVE_*'
      - 'Scripts/verify_hyperdrive_provider_io_manifest.ps1'
      - 'Scripts/verify_hyperdrive_v2_operation_contracts.ps1'
      - 'Scripts/verify_web4_hyperdrive_route_manifest.ps1'
      - '.github/workflows/hyperdrive-contract-validation.yml'
  workflow_dispatch:
    inputs:
      native_seal:
        description: 'Run only the real MongoDB/SQLite seal-routing regression.'
        required: false
        default: false
        type: boolean
      contract_filter:
        description: 'VSTest filter; select changed contracts to avoid repeating accepted cases.'
        required: false
        default: 'FullyQualifiedName~HyperDrive'
        type: string

jobs:
  manifests-and-contracts:
    runs-on: ${{ inputs.native_seal && 'ubuntu-latest' || 'windows-latest' }}
    defaults:
      run:
        working-directory: OASIS
    steps:
      # Retired: checkout@v4 with its default repository token could not read private submodules.
      # Use the same explicit source-graph credential as the other recursive validation workflows.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive

      # Retired root-only checkout: referenced sibling projects were absent on clean runners.
      - name: Resolve recorded sibling dependency revisions
        id: dependencies
        shell: pwsh
        run: |
          $manifest = Get-Content Docker/oasis-dependency-versions.env
          foreach ($key in @('LIBRARIES_COMMIT', 'HOLOCHAIN_COMMIT')) {
            $entries = @($manifest | Where-Object { $_ -match "^${key}=" })
            if ($entries.Count -ne 1) { throw "Expected exactly one $key dependency pin." }
            $revision = $entries[0].Substring($key.Length + 1)
            if ($revision -notmatch '^[0-9a-f]{40}$') { throw "Invalid $key dependency revision." }
            "$key=$revision" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout recorded Libraries dependency
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout recorded Holochain dependency
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify public manager provider-I/O manifest
        shell: pwsh
        run: ./Scripts/verify_hyperdrive_provider_io_manifest.ps1

      - name: Verify WEB4 route-to-boundary manifest
        shell: pwsh
        run: ./Scripts/verify_web4_hyperdrive_route_manifest.ps1

      - name: Verify V2 storage-operation parity and coverage
        shell: pwsh
        run: ./Scripts/verify_hyperdrive_v2_operation_contracts.ps1

      - name: Build the WEB4 artifact the controller contracts load
        if: ${{ !inputs.native_seal }}
        shell: pwsh
        run: >-
          dotnet build
          'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj'
          --configuration Release
          /m:2 /nr:false /p:UseSharedCompilation=false

      - name: Run HyperDrive behavioral contracts
        if: ${{ !inputs.native_seal }}
        shell: pwsh
        env:
          OASIS_HYPERDRIVE_TEST_FILTER: ${{ inputs.contract_filter || 'FullyQualifiedName~HyperDrive' }}
        run: >-
          dotnet test
          'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/NextGenSoftware.OASIS.API.Core.UnitTests.csproj'
          --configuration Release
          --filter "$env:OASIS_HYPERDRIVE_TEST_FILTER"
          --logger 'trx;LogFileName=hyperdrive-contracts.trx'
          --results-directory artifacts/hyperdrive-contract-validation

      - name: Start owned native seal routing fixture
        if: ${{ inputs.native_seal }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name seal-routing-mongo -p 27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify real seal routing without repeating accepted contracts
        if: ${{ inputs.native_seal }}
        shell: pwsh
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner seal-routing-native-ci -Operation {
            dotnet test 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.HyperDrive.IntegrationTests' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~SealVerificationPreservesNativeRouting' --logger 'trx;LogFileName=seal-routing-native.trx' --results-directory artifacts/hyperdrive-contract-validation
            if ($LASTEXITCODE) { throw 'Native seal routing verification failed.' }
          }

      - name: Stop owned native seal routing fixture
        if: ${{ always() && inputs.native_seal }}
        shell: bash
        run: docker rm --force seal-routing-mongo

      - name: Preserve HyperDrive behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyperdrive-contract-results
          path: OASIS/artifacts/hyperdrive-contract-validation/*.trx
          if-no-files-found: error
