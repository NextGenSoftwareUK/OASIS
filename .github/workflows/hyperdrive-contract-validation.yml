name: HyperDrive contract validation

on:
  pull_request:
    paths:
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/Controllers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core/Managers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/HyperDrive/**'
      - 'Docs/Devs/HYPERDRIVE_*'
      - 'Scripts/verify_hyperdrive_provider_io_manifest.ps1'
      - 'Scripts/verify_hyperdrive_v2_operation_contracts.ps1'
      - 'Scripts/verify_web4_hyperdrive_route_manifest.ps1'
      - '.github/workflows/hyperdrive-contract-validation.yml'
  workflow_dispatch:

jobs:
  manifests-and-contracts:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: OASIS
    steps:
      # Retired: checkout@v4 with its default repository token could not read private submodules.
      # Use the same explicit source-graph credential as the other recursive validation workflows.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive

      # Retired root-only checkout: referenced sibling projects were absent on clean runners.
      - name: Resolve recorded sibling dependency revisions
        id: dependencies
        shell: pwsh
        run: |
          $manifest = Get-Content Docker/oasis-dependency-versions.env
          foreach ($key in @('LIBRARIES_COMMIT', 'HOLOCHAIN_COMMIT')) {
            $entries = @($manifest | Where-Object { $_ -match "^${key}=" })
            if ($entries.Count -ne 1) { throw "Expected exactly one $key dependency pin." }
            $revision = $entries[0].Substring($key.Length + 1)
            if ($revision -notmatch '^[0-9a-f]{40}$') { throw "Invalid $key dependency revision." }
            "$key=$revision" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout recorded Libraries dependency
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout recorded Holochain dependency
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify public manager provider-I/O manifest
        shell: pwsh
        run: ./Scripts/verify_hyperdrive_provider_io_manifest.ps1

      - name: Verify WEB4 route-to-boundary manifest
        shell: pwsh
        run: ./Scripts/verify_web4_hyperdrive_route_manifest.ps1

      - name: Verify V2 storage-operation parity and coverage
        shell: pwsh
        run: ./Scripts/verify_hyperdrive_v2_operation_contracts.ps1

      - name: Run HyperDrive behavioral contracts
        shell: pwsh
        run: >-
          dotnet test
          'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/NextGenSoftware.OASIS.API.Core.UnitTests.csproj'
          --configuration Release
          --filter 'FullyQualifiedName~HyperDrive'
          --logger 'trx;LogFileName=hyperdrive-contracts.trx'
          --results-directory artifacts/hyperdrive-contract-validation

      - name: Preserve HyperDrive behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hyperdrive-contract-results
          path: OASIS/artifacts/hyperdrive-contract-validation/*.trx
          if-no-files-found: error
