name: HyperDrive contract validation

on:
  pull_request:
    paths:
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/Controllers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core/Managers/**'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/HyperDrive/**'
      - 'Docs/Devs/HYPERDRIVE_*'
      - 'Scripts/verify_hyperdrive_provider_io_manifest.ps1'
      - 'Scripts/verify_hyperdrive_v2_operation_contracts.ps1'
      - 'Scripts/TestHosts/Test-HyperDriveOperationInventory.ps1'
      - 'Scripts/verify_web4_hyperdrive_route_manifest.ps1'
      - '.github/workflows/hyperdrive-contract-validation.yml'
  workflow_dispatch:
    inputs:
      build_api:
        description: Also build the shipping WEB4 API for a native integration check
        type: boolean
        default: false
      build_only:
        description: Build the API without repeating accepted behavior tests
        type: boolean
        default: false
      build_web5_after_web4:
        description: Also compile changed WEB5 source in the same leased build batch
        type: boolean
        default: false
      portal_syntax_ref:
        description: Optional exact OPORTAL commit for changed popup syntax checks only
        type: string
        required: false
        default: ''
      portal_syntax_file:
        description: Optional single changed popup filename; empty checks the three map scripts
        type: string
        required: false
        default: ''
      build_native_contract_project:
        description: Also compile the integrated three-provider contract project without executing tests
        type: boolean
        default: false
      request_timing_tests:
        description: Verify the changed private-data-free request timing middleware
        type: boolean
        default: false
      request_timing_filter:
        description: Select only changed timing contracts; empty runs the timing host
        type: string
        required: false
        default: ''
      native_seal:
        description: 'Use the owned MongoDB/SQLite fixture for a focused native regression.'
        required: false
        default: false
        type: boolean
      native_project:
        description: Native fixture project
        type: choice
        options: [integration, subscription_ledger, profile_browser, subscription_browser, subscription_usage_browser, subscription_notifications_browser, subscription_app_owner_browser, subscription_app_usage_browser, subscription_app_billing_read_browser, subscription_app_billing_control_browser, subscription_app_pay_now_browser, web5_build, web6_build]
        default: integration
      native_neo4j:
        description: Add the owned loopback Bolt fixture for the selected Neo4j profile cases
        required: false
        default: false
        type: boolean
      native_profile_sdk:
        description: Checkout the recorded WEB4 JS SDK for real profile HTTP tests
        required: false
        default: false
        type: boolean
      native_test_filter:
        description: 'Select the changed real-provider test.'
        required: false
        default: 'FullyQualifiedName~SealVerificationPreservesNativeRouting'
        type: string
      contract_filter:
        description: 'VSTest filter; select changed contracts to avoid repeating accepted cases.'
        required: false
        default: 'FullyQualifiedName~HyperDrive'
        type: string

jobs:
  manifests-and-contracts:
    runs-on: ${{ (inputs.native_seal || inputs.build_only) && 'ubuntu-latest' || 'windows-latest' }}
    defaults:
      run:
        working-directory: OASIS
    steps:
      # Retired: checkout@v4 with its default repository token could not read private submodules.
      # Use the same explicit source-graph credential as the other recursive validation workflows.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive

      - name: Validate exact map source revision
        if: ${{ inputs.portal_syntax_ref != '' }}
        shell: pwsh
        env:
          PORTAL_MAP_SOURCE_REF: ${{ inputs.portal_syntax_ref }}
        run: |
          if ($env:PORTAL_MAP_SOURCE_REF -notmatch '^[0-9a-f]{40}$') { throw 'An exact portal source commit is required.' }

      - name: Checkout selected map source only
        if: ${{ inputs.portal_syntax_ref != '' }}
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/OPORTAL-JS
          ref: ${{ inputs.portal_syntax_ref }}
          path: oportal-map-source
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/js/celestial-map-modal.js
            /assets/js/oapp-map-modal.js
            /assets/js/social-graph-modal.js
            /assets/js/eggs-modal.js
            /assets/js/competition-modal.js
            /assets/js/karma-ledger-modal.js
            /assets/js/activity-feed-modal.js
            /assets/js/clan-modal.js
            /assets/js/inventory-modal.js

      - name: Parse selected popup scripts without executing popup code
        if: ${{ inputs.portal_syntax_ref != '' }}
        shell: pwsh
        env:
          PORTAL_SYNTAX_FILE: ${{ inputs.portal_syntax_file }}
        run: |
          $selectedScripts = @('celestial-map-modal.js', 'oapp-map-modal.js', 'social-graph-modal.js')
          if ($env:PORTAL_SYNTAX_FILE) {
            if ($env:PORTAL_SYNTAX_FILE -notin @('celestial-map-modal.js', 'oapp-map-modal.js', 'social-graph-modal.js', 'eggs-modal.js', 'competition-modal.js', 'clan-modal.js', 'inventory-modal.js')) { throw 'Unsupported popup syntax target.' }
            $selectedScripts = @($env:PORTAL_SYNTAX_FILE)
          }
          foreach ($mapScript in $selectedScripts) {
            node --check "../oportal-map-source/assets/js/$mapScript"
            if ($LASTEXITCODE) { throw "Map source syntax failed: $mapScript" }
            Write-Host "Popup source syntax passed: $mapScript"
          }

      # Retired root-only checkout: referenced sibling projects were absent on clean runners.
      - name: Resolve recorded sibling dependency revisions
        id: dependencies
        shell: pwsh
        run: |
          $manifest = Get-Content Docker/oasis-dependency-versions.env
          foreach ($key in @('LIBRARIES_COMMIT', 'HOLOCHAIN_COMMIT')) {
            $entries = @($manifest | Where-Object { $_ -match "^${key}=" })
            if ($entries.Count -ne 1) { throw "Expected exactly one $key dependency pin." }
            $revision = $entries[0].Substring($key.Length + 1)
            if ($revision -notmatch '^[0-9a-f]{40}$') { throw "Invalid $key dependency revision." }
            "$key=$revision" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout recorded Libraries dependency
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout recorded Holochain dependency
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp

      - name: Resolve recorded profile SDK revision
        if: ${{ inputs.native_profile_sdk }}
        id: profile_sdk
        shell: pwsh
        run: |
          $revision = (Get-Content Scripts/TestHosts/Fixtures/profile-sdk-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Exact profile SDK revision required.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout recorded profile SDK
        if: ${{ inputs.native_profile_sdk }}
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/OASIS-API-Javascipt-Package-WEB4
          ref: ${{ steps.profile_sdk.outputs.revision }}
          path: web4-profile-sdk
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - name: Resolve exact Our World publication source
        if: ${{ contains(inputs.native_test_filter, 'OurWorldPublicationReopensInPortalThroughActualHttpAndMongo') }}
        id: our_world_route
        shell: pwsh
        run: |
          $revision = (Get-Content Scripts/TestHosts/Fixtures/our-world-route-source-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Exact Our World route source revision required.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout actual Our World route publication sources
        if: ${{ contains(inputs.native_test_filter, 'OurWorldPublicationReopensInPortalThroughActualHttpAndMongo') }}
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/Our-World
          ref: ${{ steps.our_world_route.outputs.revision }}
          path: ourworld-route-source
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
          sparse-checkout: |
            Assets/_Game/Scripts/OASISIntegration/WalkingProgress.cs
            Assets/_Game/Scripts/OASISIntegration/WalkingRoutePublication.cs
          sparse-checkout-cone-mode: false

      - name: Resolve recorded browser portal revision
        if: ${{ inputs.native_profile_sdk && (inputs.native_project == 'profile_browser' || inputs.native_project == 'subscription_browser' || inputs.native_project == 'subscription_usage_browser' || inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') }}
        id: profile_portal
        shell: pwsh
        run: |
          $file = if ('${{ inputs.native_test_filter }}'.Contains('OurWorldPublicationReopensInPortalThroughActualHttpAndMongo')) { 'Scripts/TestHosts/Fixtures/our-world-route-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('MapRendererDisplaysSegmentedGpxInActualBrowser')) { 'Scripts/TestHosts/Fixtures/map-renderer-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('RecordedRoutePopupUsesActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/recorded-route-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('MapPopupCatalogueAndVisitUseActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/map-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('KarmaPopupsUseActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/karma-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('ClanPopupUsesActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/clan-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('MessagingHistoryAndSessionResumeUseActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/messaging-history-resume-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('MessagingPopupUsesActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/messaging-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('FilesAndNotificationPopupsUseActualSdkHttpAndOwnedMongo')) { 'Scripts/TestHosts/Fixtures/popup-breadth-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('HyperDriveSettingsBrowserUsesActualSdkAndNativeProviders') -or '${{ inputs.native_test_filter }}'.Contains('HolonStoragePolicyBrowserUsesActualSdkAndNativeProviders')) { 'Scripts/TestHosts/Fixtures/hyperdrive-settings-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('ProfileModalClientReplacementUsesActualHttpAndThreeNativeProviders')) { 'Scripts/TestHosts/Fixtures/profile-modal-client-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('PortraitBrowserUploadUsesActualHttpAndThreeNativeProviders') -or '${{ inputs.native_test_filter }}'.Contains('PortraitBrowserAccountSwitchUsesActualHttpAndThreeNativeProviders') -or '${{ inputs.native_test_filter }}'.Contains('PortraitBrowserThenProfileEditUsesCommittedRevisionsAndThreeNativeProviders')) { 'Scripts/TestHosts/Fixtures/portrait-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('ProfileHydrationUsesCurrentSdkBearerClientAndActualNativeController')) { 'Scripts/TestHosts/Fixtures/profile-hydration-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('SubscriptionAdminUsageUsesActualControllersBrowserAndHistoricalTodayCounts')) { 'Scripts/TestHosts/Fixtures/subscription-admin-usage-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('SubscriptionAdminOwnersUseActualControllerBrowserAndOwnershipAudit')) { 'Scripts/TestHosts/Fixtures/subscription-admin-owners-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('DashboardBearerReplacementUsesActualSdkSubscriptionControllerAndMongo')) { 'Scripts/TestHosts/Fixtures/dashboard-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('SubscriptionAdminCatalogueUsesActualWeb6BrowserAndHolonStorage')) { 'Scripts/TestHosts/Fixtures/subscription-admin-catalogue-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}'.Contains('SubscriptionAdminOutboxUsesActualControllerBrowserAndServiceIsolation')) { 'Scripts/TestHosts/Fixtures/subscription-admin-outbox-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}' -eq 'FullyQualifiedName~SubscriptionAdminAppAccountsUseActualControllerBrowserAndCredentials') { 'Scripts/TestHosts/Fixtures/subscription-admin-accounts-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}' -eq 'FullyQualifiedName~SubscriptionAdminPlanGrantUsesActualControllerBrowserAndAudit') { 'Scripts/TestHosts/Fixtures/subscription-admin-grant-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}' -eq 'FullyQualifiedName~SubscriptionAdminReadsAndSessionPrivacyUseActualControllerBrowserAndMongo') { 'Scripts/TestHosts/Fixtures/subscription-admin-read-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}' -eq 'FullyQualifiedName~SubscriptionPersonalConsentReviewUsesActualControllerSdkAndBrowser') { 'Scripts/TestHosts/Fixtures/subscription-personal-consent-review-browser-portal-revision.txt' } elseif ('${{ inputs.native_test_filter }}' -eq 'FullyQualifiedName~SubscriptionPersonalBillingBrowserUsesActualControllerAndOwnedMongo') { 'Scripts/TestHosts/Fixtures/subscription-personal-billing-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_app_pay_now_browser') { 'Scripts/TestHosts/Fixtures/subscription-app-pay-now-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_app_billing_control_browser') { 'Scripts/TestHosts/Fixtures/subscription-app-billing-control-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_app_billing_read_browser') { 'Scripts/TestHosts/Fixtures/subscription-app-billing-read-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_app_usage_browser') { 'Scripts/TestHosts/Fixtures/subscription-app-usage-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_app_owner_browser') { 'Scripts/TestHosts/Fixtures/subscription-app-owner-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_notifications_browser') { 'Scripts/TestHosts/Fixtures/subscription-notifications-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_usage_browser') { 'Scripts/TestHosts/Fixtures/subscription-usage-browser-portal-revision.txt' } elseif ('${{ inputs.native_project }}' -eq 'subscription_browser') { 'Scripts/TestHosts/Fixtures/subscription-browser-portal-revision.txt' } else { 'Scripts/TestHosts/Fixtures/profile-browser-portal-revision.txt' }
          $revision = (Get-Content $file -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Exact browser portal revision required.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout recorded browser portal assets
        if: ${{ inputs.native_profile_sdk && (inputs.native_project == 'profile_browser' || inputs.native_project == 'subscription_browser' || inputs.native_project == 'subscription_usage_browser' || inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') }}
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/OPORTAL-JS
          ref: ${{ steps.profile_portal.outputs.revision }}
          path: portal-profile-browser
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/components/dashboard.html
            /assets/components/modals/map.html
            /assets/components/modals/karma-ledger.html
            /assets/components/modals/activity-feed.html
            /assets/components/modals/clan.html
            /assets/components/modals/messaging.html
            /assets/components/modals/files.html
            /assets/components/notifications-panel.html
            /assets/components/modals/avatar.html
            /assets/components/modals/hyperdrive.html
            /assets/components/modals/subscription.html
            /assets/components/modals/subscription-admin.html
            /assets/css/
            /assets/fonts/
            /assets/img/loggedin.png
            /assets/js/avatar-modal.js
            /assets/js/portal-components.js
            /assets/js/map-modal.js
            /assets/js/karma-ledger-modal.js
            /assets/js/activity-feed-modal.js
            /assets/js/clan-modal.js
            /assets/js/messaging-modal.js
            /assets/js/files-modal.js
            /assets/js/notifications.js
            /assets/js/hyperdrive-modal.js
            /assets/js/holon-storage-policy.js
            /assets/js/subscription-modal.js
            /assets/js/subscription-admin-modal.js
            /assets/js/usage-charts.js
            /assets/js/config.js
            /assets/js/dashboard.js
            /assets/js/oasis-web4-sdk.js
            /docs/WIP/PROFILE_BROWSER_BUNDLE_EVIDENCE.json
            /portal.html

      - name: Verify exact Map browser input assets
        if: ${{ contains(inputs.native_test_filter, 'MapPopupCatalogueAndVisitUseActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'RecordedRoutePopupUsesActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'MapRendererDisplaysSegmentedGpxInActualBrowser') || contains(inputs.native_test_filter, 'OurWorldPublicationReopensInPortalThroughActualHttpAndMongo') }}
        shell: pwsh
        run: |
          foreach ($path in @('assets/js/map-modal.js','assets/components/modals/map.html','assets/js/oasis-web4-sdk.js')) {
            if (!(Test-Path -LiteralPath (Join-Path '../portal-profile-browser' $path) -PathType Leaf)) { throw "Missing actual Map browser input: $path" }
          }

      - name: Verify exact Karma browser input assets
        if: ${{ contains(inputs.native_test_filter, 'KarmaPopupsUseActualSdkHttpAndOwnedMongo') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($asset in @('assets/js/karma-ledger-modal.js','assets/js/activity-feed-modal.js','assets/components/modals/karma-ledger.html','assets/components/modals/activity-feed.html','assets/js/oasis-web4-sdk.js')) {
            if (!(Test-Path (Join-Path '../portal-profile-browser' $asset) -PathType Leaf)) { throw "Missing pinned Karma browser asset: $asset" }
          }

      - name: Verify actual popup breadth browser inputs
        if: ${{ contains(inputs.native_test_filter, 'ClanPopupUsesActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'FilesAndNotificationPopupsUseActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'MessagingPopupUsesActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'MessagingHistoryAndSessionResumeUseActualSdkHttpAndOwnedMongo') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = if ('${{ inputs.native_test_filter }}'.Contains('KarmaPopupsUseActualSdkHttpAndOwnedMongo')) { 'Docs/WIP/HyperDrive-Providers/KARMA_BROWSER_EVIDENCE_2026-11-20.json' } elseif ('${{ inputs.native_test_filter }}'.Contains('ClanPopupUsesActualSdkHttpAndOwnedMongo')) { 'Docs/WIP/HyperDrive-Providers/OPORTAL_CLAN_BREADTH_EVIDENCE_2026-11-20.json' } elseif ('${{ inputs.native_test_filter }}'.Contains('MessagingHistoryAndSessionResumeUseActualSdkHttpAndOwnedMongo')) { 'Docs/WIP/HyperDrive-Providers/OPORTAL_MESSAGING_HISTORY_RESUME_EVIDENCE_2026-11-20.json' } elseif ('${{ inputs.native_test_filter }}'.Contains('MessagingPopupUsesActualSdkHttpAndOwnedMongo')) { 'Docs/WIP/HyperDrive-Providers/OPORTAL_MESSAGING_BREADTH_EVIDENCE_2026-11-20.json' } else { 'Docs/WIP/HyperDrive-Providers/OPORTAL_POPUP_FUNCTIONAL_SMOKE_2026-11-20.json' }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          $head = git -C ../portal-profile-browser rev-parse HEAD
          if ($LASTEXITCODE -or $head -ne $evidence.portal) { throw 'Exact popup source revision required.' }
          foreach ($entry in $evidence.exactPortalBlobs.PSObject.Properties) {
            $path = Join-Path ../portal-profile-browser $entry.Name
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing actual popup input: $($entry.Name)" }
            $blob = git hash-object -- $path
            if ($LASTEXITCODE -or $blob -ne $entry.Value) { throw "Popup input differs: $($entry.Name)" }
          }

      - name: Verify actual HyperDrive browser input blobs
        if: ${{ (contains(inputs.native_test_filter, 'HyperDriveSettingsBrowserUsesActualSdkAndNativeProviders') || contains(inputs.native_test_filter, 'HolonStoragePolicyBrowserUsesActualSdkAndNativeProviders')) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content Docs/WIP/HyperDrive-Providers/OPORTAL_HYPERDRIVE_SETTINGS_BROWSER_EVIDENCE_2026-11-19.json -Raw | ConvertFrom-Json
          $head = git -C ../portal-profile-browser rev-parse HEAD
          if ($LASTEXITCODE -or $head -ne $evidence.portal) { throw 'The recorded HyperDrive browser portal revision is required.' }
          foreach ($entry in $evidence.exactPortalBlobs.PSObject.Properties) {
            if (!(Test-Path -LiteralPath (Join-Path ../portal-profile-browser $entry.Name) -PathType Leaf)) {
              throw "Missing actual HyperDrive browser input: $($entry.Name)"
            }
            $blob = git -C ../portal-profile-browser hash-object -- $entry.Name
            if ($LASTEXITCODE -or $blob -ne $entry.Value) { throw "HyperDrive input differs from its recorded blob: $($entry.Name)" }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify public manager provider-I/O manifest
        shell: pwsh
        run: ./Scripts/verify_hyperdrive_provider_io_manifest.ps1

      - name: Verify WEB4 route-to-boundary manifest
        shell: pwsh
        run: ./Scripts/verify_web4_hyperdrive_route_manifest.ps1

      - name: Verify V2 storage-operation parity and coverage
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Test-HyperDriveOperationInventory.ps1
          ./Scripts/verify_hyperdrive_v2_operation_contracts.ps1

      - name: Verify candidate dependency pins
        shell: pwsh
        run: |
          python Scripts/sync_railway_dependency_manifest.py --check
          if ($LASTEXITCODE) { throw 'Candidate manifest does not match its gitlinks.' }
          python Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          if ($LASTEXITCODE) { throw 'Candidate dependency policy failed.' }

      - name: Build the selected API artifact
        if: ${{ !inputs.native_seal || inputs.native_project == 'subscription_ledger' || inputs.build_api }}
        shell: pwsh
        env:
          OASIS_QUALIFICATION_API: ${{ inputs.native_project == 'web6_build' && 'WEB6' || inputs.native_project == 'web5_build' && 'WEB5' || 'WEB4' }}
          OASIS_QUALIFICATION_BUILD_ONLY: ${{ inputs.build_only }}
          OASIS_QUALIFICATION_NATIVE_CONTRACT_BUILD: ${{ inputs.build_native_contract_project }}
          OASIS_QUALIFICATION_WEB5_AFTER_WEB4: ${{ inputs.build_web5_after_web4 }}
        run: |
          if ($env:OASIS_QUALIFICATION_API -in @('WEB5', 'WEB6') -and $env:OASIS_QUALIFICATION_BUILD_ONLY -ne 'true') {
            throw 'WEB5/WEB6 selection is a build-only qualification target.'
          }
          $project = if ($env:OASIS_QUALIFICATION_API -eq 'WEB5') {
            'STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI/NextGenSoftware.OASIS.STAR.WebAPI.csproj'
          } elseif ($env:OASIS_QUALIFICATION_API -eq 'WEB6') {
            'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj'
          } else {
            'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj'
          }
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner api-qualification-build-ci -Operation {
            dotnet build $project --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'API qualification build failed.' }
            if ($env:OASIS_QUALIFICATION_WEB5_AFTER_WEB4 -eq 'true') {
              if ($env:OASIS_QUALIFICATION_API -ne 'WEB4' -or $env:OASIS_QUALIFICATION_BUILD_ONLY -ne 'true') {
                throw 'Sequential WEB4/WEB5 compilation requires the WEB4 build-only target.'
              }
              dotnet build 'STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI/NextGenSoftware.OASIS.STAR.WebAPI.csproj' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE) { throw 'Changed WEB5 API qualification build failed.' }
            }
            if ($env:OASIS_QUALIFICATION_NATIVE_CONTRACT_BUILD -eq 'true') {
              dotnet build 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests.csproj' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE) { throw 'Integrated native contract source build failed.' }
            }
          }

      - name: Build actual WEB6 catalogue API without repeating accepted tests
        if: ${{ inputs.native_seal && contains(inputs.native_test_filter, 'SubscriptionAdminCatalogueUsesActualWeb6BrowserAndHolonStorage') }}
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner web6-catalogue-api-build-ci -Operation {
            dotnet build 'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB6 catalogue API build failed.' }
          }

      - name: Build updated linked ledger host without repeating accepted tests
        if: ${{ inputs.native_seal && (contains(inputs.native_test_filter, 'AppRequestChargesUseImmutableConsentExactCapsAndSeparatePayers') || contains(inputs.native_test_filter, 'AppStatementsFreezePayersAllocateOnceAndRoundAcrossSubscriptions') || contains(inputs.native_test_filter, 'SubscriptionAppPayNowUsesActualControllerAndOwnedMongo') || contains(inputs.native_test_filter, 'SubscriptionAppStatementRecoveryUsesActualControllerAndOwnedMongo') || contains(inputs.native_test_filter, 'SubscriptionAppPayNowBrowserUsesActualControllerAndOwnedMongo') || contains(inputs.native_test_filter, 'SubscriptionAppBillingPolicyErrorsUseActualControllerAndOwnedMongo') || contains(inputs.native_test_filter, 'SubscriptionFreshAppUsageBillsThroughSdkAndBrowser') || contains(inputs.native_test_filter, 'SubscriptionPersonalBillingBrowserUsesActualControllerAndOwnedMongo') || contains(inputs.native_test_filter, 'PersonalConsentBindsPositiveExposureAndPreservesOriginalEvidence') || contains(inputs.native_test_filter, 'PersonalStatementsAndCorrectionsPreserveOriginalAccountsAndConserveMoney') || contains(inputs.native_test_filter, 'PersonalCreditsRespectOriginalCapsWriteoffsAndCreditOnlyScheduling') || contains(inputs.native_test_filter, 'OverageCollectionRejectsForeignScopeAndEmptyPayersBeforeMutation') || contains(inputs.native_test_filter, 'SubscriptionPersonalConsentReviewUsesActualControllerSdkAndBrowser')) }}
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner app-request-charge-protocol-build-ci -Operation {
            dotnet build 'ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Updated linked ledger host build failed.' }
          }

      - name: Verify the changed request timing middleware
        if: ${{ inputs.request_timing_tests }}
        shell: pwsh
        env:
          OASIS_REQUEST_TIMING_FILTER: ${{ inputs.request_timing_filter }}
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner request-timing-ci -Operation {
            $selection = @()
            if ($env:OASIS_REQUEST_TIMING_FILTER) { $selection = @('--filter', $env:OASIS_REQUEST_TIMING_FILTER) }
            dotnet test 'ONODE/Tests/RequestTiming.Tests/RequestTiming.Tests.csproj' --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false @selection --logger 'trx;LogFileName=request-timing.trx' --results-directory artifacts/hyperdrive-contract-validation
            if ($LASTEXITCODE) { throw 'Request timing checks failed.' }
          }

      - name: Run HyperDrive behavioral contracts
        if: ${{ !inputs.native_seal && !inputs.build_only }}
        shell: pwsh
        env:
          OASIS_HYPERDRIVE_TEST_FILTER: ${{ inputs.contract_filter || 'FullyQualifiedName~HyperDrive' }}
        run: >-
          dotnet test
          'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/NextGenSoftware.OASIS.API.Core.UnitTests.csproj'
          --configuration Release
          --filter "$env:OASIS_HYPERDRIVE_TEST_FILTER"
          --logger 'trx;LogFileName=hyperdrive-contracts.trx'
          --results-directory artifacts/hyperdrive-contract-validation

      - name: Start owned native profile Bolt fixture
        if: ${{ inputs.native_seal && inputs.native_neo4j }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name profile-native-neo4j --memory 768m -p 127.0.0.1:27687:7687 \
            -e NEO4J_AUTH=neo4j/oasis-profile-fixture-only \
            -e NEO4J_server_memory_heap_initial__size=256m \
            -e NEO4J_server_memory_heap_max__size=256m \
            -e NEO4J_server_memory_pagecache_size=128m \
            neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
          for attempt in $(seq 1 90); do
            if docker exec profile-native-neo4j cypher-shell -u neo4j -p oasis-profile-fixture-only 'RETURN 1' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Start owned native seal routing fixture
        if: ${{ inputs.native_seal }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name seal-routing-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all --setParameter enableTestCommands=1
          for attempt in $(seq 1 60); do
            if docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec seal-routing-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify real seal routing without repeating accepted contracts
        if: ${{ inputs.native_seal && !inputs.native_profile_sdk }}
        shell: pwsh
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
          OASIS_NATIVE_PROJECT: ${{ inputs.native_project || 'integration' }}
          OASIS_NATIVE_PROVIDER_TEST_FILTER: ${{ inputs.native_test_filter || 'FullyQualifiedName~SealVerificationPreservesNativeRouting' }}
          OASIS_PROFILE_NEO4J_FIXTURE: ${{ inputs.native_neo4j && 'owned-local-27687' || '' }}
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner seal-routing-native-ci -Operation {
            $project = if ($env:OASIS_NATIVE_PROJECT -eq 'subscription_ledger') { 'ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj' } else { 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.HyperDrive.IntegrationTests' }
            dotnet test $project --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false --filter "$env:OASIS_NATIVE_PROVIDER_TEST_FILTER" --logger 'trx;LogFileName=seal-routing-native.trx' --results-directory artifacts/hyperdrive-contract-validation
            if ($LASTEXITCODE) { throw 'Native seal routing verification failed.' }
          }

      - name: Verify actual profile client through owned native HTTP
        if: ${{ inputs.native_seal && inputs.native_profile_sdk }}
        shell: bash
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
          OASIS_PROFILE_WEB4_SDK_ROOT: ${{ github.workspace }}/web4-profile-sdk
          OASIS_PORTAL_MAP_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'MapPopupCatalogueAndVisitUseActualSdkHttpAndOwnedMongo') && 'true' || 'false' }}
          OASIS_PORTAL_RECORDED_ROUTE_BROWSER_ENABLED: ${{ (contains(inputs.native_test_filter, 'RecordedRoutePopupUsesActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'OurWorldPublicationReopensInPortalThroughActualHttpAndMongo')) && 'true' || 'false' }}
          OASIS_PORTAL_MAP_RENDERER_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'MapRendererDisplaysSegmentedGpxInActualBrowser') && 'true' || 'false' }}
          OASIS_PORTAL_KARMA_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'KarmaPopupsUseActualSdkHttpAndOwnedMongo') && 'true' || 'false' }}
          OASIS_PORTAL_CLAN_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'ClanPopupUsesActualSdkHttpAndOwnedMongo') && 'true' || 'false' }}
          OASIS_PORTAL_MESSAGING_BROWSER_ENABLED: ${{ (contains(inputs.native_test_filter, 'MessagingPopupUsesActualSdkHttpAndOwnedMongo') || contains(inputs.native_test_filter, 'MessagingHistoryAndSessionResumeUseActualSdkHttpAndOwnedMongo')) && 'true' || 'false' }}
          OASIS_PORTAL_POPUP_BREADTH_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'FilesAndNotificationPopupsUseActualSdkHttpAndOwnedMongo') && 'true' || 'false' }}
          OASIS_PROFILE_BROWSER_ENABLED: ${{ (inputs.native_project == 'profile_browser' || inputs.native_project == 'subscription_browser' || inputs.native_project == 'subscription_usage_browser' || inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_BROWSER_ENABLED: ${{ (inputs.native_project == 'subscription_browser' || inputs.native_project == 'subscription_usage_browser' || inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_READ_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminReadsAndSessionPrivacyUseActualControllerBrowserAndMongo') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_GRANT_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminPlanGrantUsesActualControllerBrowserAndAudit') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_ACCOUNTS_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminAppAccountsUseActualControllerBrowserAndCredentials') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_OUTBOX_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminOutboxUsesActualControllerBrowserAndServiceIsolation') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_CATALOGUE_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminCatalogueUsesActualWeb6BrowserAndHolonStorage') && 'true' || 'false' }}
          OASIS_PORTRAIT_BROWSER_HANDOFF_COUNT: ${{ contains(inputs.native_test_filter, 'PortraitBrowserThenProfileEditUsesCommittedRevisionsAndThreeNativeProviders') && contains(inputs.native_test_filter, 'ProfileModalClientReplacementUsesActualHttpAndThreeNativeProviders') && '6' || '3' }}
          OASIS_PORTRAIT_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'PortraitBrowserUploadUsesActualHttpAndThreeNativeProviders') || contains(inputs.native_test_filter, 'PortraitBrowserAccountSwitchUsesActualHttpAndThreeNativeProviders') || contains(inputs.native_test_filter, 'PortraitBrowserThenProfileEditUsesCommittedRevisionsAndThreeNativeProviders') || contains(inputs.native_test_filter, 'ProfileModalClientReplacementUsesActualHttpAndThreeNativeProviders') }}
          OASIS_HYPERDRIVE_SETTINGS_BROWSER_ENABLED: ${{ (contains(inputs.native_test_filter, 'HyperDriveSettingsBrowserUsesActualSdkAndNativeProviders') || contains(inputs.native_test_filter, 'HolonStoragePolicyBrowserUsesActualSdkAndNativeProviders')) && 'true' || 'false' }}
          OASIS_HOLON_STORAGE_POLICY_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'HolonStoragePolicyBrowserUsesActualSdkAndNativeProviders') && 'true' || 'false' }}
          OASIS_PROFILE_HYDRATION_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'ProfileHydrationUsesCurrentSdkBearerClientAndActualNativeController') && 'true' || 'false' }}
          OASIS_DASHBOARD_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'DashboardBearerReplacementUsesActualSdkSubscriptionControllerAndMongo') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_OWNERS_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminOwnersUseActualControllerBrowserAndOwnershipAudit') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_ADMIN_USAGE_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionAdminUsageUsesActualControllersBrowserAndHistoricalTodayCounts') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_PERSONAL_CONSENT_REVIEW_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionPersonalConsentReviewUsesActualControllerSdkAndBrowser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_PERSONAL_BILLING_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionPersonalBillingBrowserUsesActualControllerAndOwnedMongo') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_FRESH_BILLING_BROWSER_ENABLED: ${{ contains(inputs.native_test_filter, 'SubscriptionFreshAppUsageBillsThroughSdkAndBrowser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_PAY_NOW_BROWSER_ENABLED: ${{ inputs.native_project == 'subscription_app_pay_now_browser' && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_BILLING_CONTROL_BROWSER_ENABLED: ${{ inputs.native_project == 'subscription_app_billing_control_browser' && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_BILLING_READ_BROWSER_ENABLED: ${{ (inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_USAGE_BROWSER_ENABLED: ${{ inputs.native_project == 'subscription_app_usage_browser' && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_APP_OWNER_BROWSER_ENABLED: ${{ (inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_NOTIFICATIONS_BROWSER_ENABLED: ${{ (inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_SUBSCRIPTION_USAGE_BROWSER_ENABLED: ${{ (inputs.native_project == 'subscription_usage_browser' || inputs.native_project == 'subscription_notifications_browser' || inputs.native_project == 'subscription_app_owner_browser' || inputs.native_project == 'subscription_app_usage_browser' || inputs.native_project == 'subscription_app_billing_read_browser' || inputs.native_project == 'subscription_app_billing_control_browser' || inputs.native_project == 'subscription_app_pay_now_browser') && 'true' || 'false' }}
          OASIS_PROFILE_PORTAL_ROOT: ${{ github.workspace }}/portal-profile-browser
          OASIS_NATIVE_PROVIDER_TEST_FILTER: ${{ inputs.native_test_filter }}
          OASIS_PROFILE_NEO4J_FIXTURE: ${{ inputs.native_neo4j && 'owned-local-27687' || '' }}
        run: bash Scripts/TestHosts/Invoke-ProfileSdkNativeVerification.sh

      - name: Stop owned native seal routing fixture
        if: ${{ always() && inputs.native_seal }}
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          if docker container inspect seal-routing-mongo >/dev/null 2>&1; then
            docker rm --force --volumes seal-routing-mongo
          fi
          if docker container inspect seal-routing-mongo >/dev/null 2>&1; then exit 1; fi
          echo 'Owned Mongo fixture absence verified.'

      - name: Stop owned native profile Bolt fixture
        if: ${{ always() && inputs.native_seal && inputs.native_neo4j }}
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect profile-native-neo4j >/dev/null 2>&1; then
            docker rm --force --volumes profile-native-neo4j
          fi
          if docker container inspect profile-native-neo4j >/dev/null 2>&1; then exit 1; fi

      - name: Preserve HyperDrive behavioral evidence
        if: ${{ always() && (!inputs.build_only || inputs.request_timing_tests || inputs.native_seal) }}
        uses: actions/upload-artifact@v7
        with:
          name: hyperdrive-contract-results
          path: OASIS/artifacts/hyperdrive-contract-validation/*.trx
          if-no-files-found: error
