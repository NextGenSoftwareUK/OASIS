name: Qualify immutable full WEB4 package
on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - .github/workflows/qualify-web4-full-package.yml
      - Scripts/TestHosts/qualify_web4_full_package.py
      - Scripts/TestHosts/qualify_web4_combined_startup.py
      - Scripts/TestHosts/test_web4_combined_startup.py
      - Scripts/TestHosts/owned_docker_resources.py
  workflow_dispatch:
    inputs:
      clan_actor_compile:
        description: Compile only changed shipping MCP actor bindings; skip native package journeys
        required: false
        type: boolean
        default: false
      source:
        description: Exact built source commit
        required: true
        type: string
      digest:
        description: Immutable image digest, required for native package checks
        required: false
        type: string
      package_profile:
        description: Exact image scope to verify
        required: false
        type: choice
        options: [full, tron-api, maplibre, cql-api]
        default: full
      teaching_image:
        description: Inspect the immutable teaching-runtime image without widening package scope
        required: false
        type: boolean
        default: false
      tron_reader:
        description: Require the packaged authenticated TRON header reader
        required: false
        type: boolean
        default: false
      urbit_reader:
        description: Require the packaged Urbit SDK, query source and WEB4 registration
        required: false
        type: boolean
        default: false
      infura_reader:
        description: Require the packaged Infura Ethereum CQL reader and WEB4 registration
        required: false
        type: boolean
        default: false
      combined_startup:
        description: Also verify isolated API and native startup with fresh cloud data
        required: false
        type: boolean
        default: false
      startup_authentication:
        description: Verify isolated shipping registration, verification, login and protected subscription/session reads
        required: false
        type: boolean
        default: false
      startup_portal:
        description: Optional exact OPORTAL SHA for actual page dashboard/subscription browser through owned Startup
        required: false
        type: string
        default: ""
      startup_popup_breadth:
        description: Only new Files, Wallet and Karma full-page reads; compatible authority-enabled image required
        required: false
        type: boolean
        default: false
      startup_popup_group:
        description: New popup journey only; reuses the exact shipping image without rebuilding
        required: false
        type: choice
        options: [none, clan-leave, clan-membership, map-purpose, map-visit, map-search, map-renderer, map-geo, map-places, onet, web5-diff, web5-errors, provider-migration, web5-depth, nft, data, data-crud, data-edit, files-write, map-route, messaging, messaging-read, chat, chat-directory, directory-message, clan, portal-breadth, chat-hyperdrive, data-messaging, nft-messaging-data, social-activity, account-recovery]
        default: none
      retained_waku:
        description: Verify the packaged native Waku runtime with the aged original archive
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  controls:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact image flavor selection
        run: python3 -B -m unittest discover -s Scripts/TestHosts -p test_web4_image_flavor.py
      - name: Verify startup probe error contract without native images
        run: python3 -B Scripts/TestHosts/test_web4_combined_startup.py
  package:
    if: github.event_name == 'workflow_dispatch' && !inputs.clan_actor_compile && inputs.startup_popup_group != 'map-geo' && inputs.startup_popup_group != 'web5-depth' && inputs.startup_popup_group != 'web5-errors' && inputs.startup_popup_group != 'web5-diff'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require an immutable digest for native package checks
        shell: bash
        env:
          NATIVE_DIGEST: ${{ inputs.digest }}
        run: '[[ "$NATIVE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate explicit CQL image scope before image operations
        if: inputs.package_profile == 'cql-api'
        env:
          COMBINED_STARTUP: ${{ inputs.combined_startup }}
          RETAINED_WAKU: ${{ inputs.retained_waku }}
          STARTUP_AUTH: ${{ inputs.startup_authentication }}
        run: |
          # Existing CQL package mode stays inspection-only. The new explicit mode
          # qualifies isolated auth Startup, never CQL query/runtime acceptance.
          test "$COMBINED_STARTUP" != true || test "$STARTUP_AUTH" = true
          test "$RETAINED_WAKU" != true
      - name: Validate startup authentication selection
        env:
          AUTH: ${{ inputs.startup_authentication }}
          STARTUP: ${{ inputs.combined_startup }}
        run: test "$AUTH" != true || test "$STARTUP" = true
      - name: Validate new popup breadth selection
        if: inputs.startup_popup_breadth || (inputs.startup_popup_group != '' && inputs.startup_popup_group != 'none')
        env:
          AUTH: ${{ inputs.startup_authentication }}
          STARTUP: ${{ inputs.combined_startup }}
          PORTAL: ${{ inputs.startup_portal }}
        run: test "$AUTH" = true && test "$STARTUP" = true && test -n "$PORTAL"
      - name: Verify startup readiness and error boundaries
        run: python3 -B Scripts/TestHosts/test_web4_combined_startup.py
      - name: Verify the owned catalogue network boundary
        if: inputs.startup_popup_group == 'map-places'
        run: python3 -B Scripts/TestHosts/test_owned_overpass_proxy.py
      - name: Retain verifier before checking exact image source
        env:
          POPUP_GROUP: ${{ inputs.startup_popup_group }}
        run: |
          cp Scripts/TestHosts/qualify_web4_full_package.py "$RUNNER_TEMP/qualify_web4_full_package.py"
          cp Scripts/TestHosts/qualify_web4_combined_startup.py "$RUNNER_TEMP/qualify_web4_combined_startup.py"
          cp Scripts/TestHosts/owned_docker_resources.py "$RUNNER_TEMP/owned_docker_resources.py"
          cp Scripts/TestHosts/owned_web5_startup.py "$RUNNER_TEMP/owned_web5_startup.py"
          cp Scripts/TestHosts/owned_overpass_proxy.py "$RUNNER_TEMP/owned_overpass_proxy.py"
          cp Scripts/TestHosts/Fixtures/startup-authentication.cjs "$RUNNER_TEMP/startup-authentication.cjs"
          cp Scripts/TestHosts/owned_migration_bootstrap.py "$RUNNER_TEMP/owned_migration_bootstrap.py"
          cp Scripts/TestHosts/Fixtures/migration-wizard-bootstrap.cs "$RUNNER_TEMP/migration-wizard-bootstrap.cs"
          cp Scripts/TestHosts/Fixtures/portal-startup-browser.cjs "$RUNNER_TEMP/portal-startup-browser.cjs"
          cp Scripts/TestHosts/Fixtures/profile-browser-runtime.json "$RUNNER_TEMP/profile-browser-runtime.json"
          if [[ "$POPUP_GROUP" == map-search ]]; then
            probe="$RUNNER_TEMP/oasis-map-search-owned"
            test "$probe" = "$RUNNER_TEMP/oasis-map-search-owned"
            test ! -e "$probe"
            mkdir -p "$probe/probe-source"
            cp Scripts/TestHosts/MapSearchTransportProbe/MapSearchTransportProbe.csproj "$probe/probe-source/"
            cp Scripts/TestHosts/MapSearchTransportProbe/Program.cs "$probe/probe-source/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
          clean: true
      - name: Restore verifier to its repository path
        run: |
          cp "$RUNNER_TEMP/qualify_web4_full_package.py" Scripts/TestHosts/qualify_web4_full_package.py
          cp "$RUNNER_TEMP/qualify_web4_combined_startup.py" Scripts/TestHosts/qualify_web4_combined_startup.py
          cp "$RUNNER_TEMP/owned_docker_resources.py" Scripts/TestHosts/owned_docker_resources.py
          cp "$RUNNER_TEMP/owned_web5_startup.py" Scripts/TestHosts/owned_web5_startup.py
          cp "$RUNNER_TEMP/owned_overpass_proxy.py" Scripts/TestHosts/owned_overpass_proxy.py
          mkdir -p Scripts/TestHosts/Fixtures
          cp "$RUNNER_TEMP/startup-authentication.cjs" Scripts/TestHosts/Fixtures/startup-authentication.cjs
          cp "$RUNNER_TEMP/owned_migration_bootstrap.py" Scripts/TestHosts/owned_migration_bootstrap.py
          cp "$RUNNER_TEMP/migration-wizard-bootstrap.cs" Scripts/TestHosts/Fixtures/migration-wizard-bootstrap.cs
          cp "$RUNNER_TEMP/startup-authentication.cjs" Scripts/TestHosts/Fixtures/startup-authentication.cjs
          cp "$RUNNER_TEMP/portal-startup-browser.cjs" Scripts/TestHosts/Fixtures/portal-startup-browser.cjs
      - name: Validate immutable portal browser selection
        if: inputs.startup_portal != ''
        env:
          PORTAL: ${{ inputs.startup_portal }}
          AUTH: ${{ inputs.startup_authentication }}
          STARTUP: ${{ inputs.combined_startup }}
        run: |
          [[ "$PORTAL" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTH" = true
          test "$STARTUP" = true
      - uses: actions/checkout@v7
        if: inputs.startup_portal != ''
        with:
          repository: NextGenSoftwareUK/OPORTAL-JS
          ref: ${{ inputs.startup_portal }}
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: oportal-startup-source
          persist-credentials: false
      - name: Prepare owned pinned portal browser
        if: inputs.startup_portal != ''
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          owned="$GITHUB_WORKSPACE/portal-startup-owned"
          test ! -e "$owned"
          mkdir "$owned"
          version="$(node -p "require('$RUNNER_TEMP/profile-browser-runtime.json').version")"
          expected="$(node -p "require('$RUNNER_TEMP/profile-browser-runtime.json').integrity")"
          actual="$(npm view "playwright-core@$version" dist.integrity --registry https://registry.npmjs.org --cache "$owned/npm-cache")"
          test "$actual" = "$expected"
          npm install --prefix "$owned/runtime" --cache "$owned/npm-cache" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund "playwright-core@$version"
      - uses: actions/setup-dotnet@v4
        if: inputs.startup_popup_group == 'provider-migration' || inputs.startup_popup_group == 'map-search'
        with:
          dotnet-version: '10.0.x'
      - name: Build the real standalone gRPC client from exact API proto
        if: inputs.startup_popup_group == 'map-search'
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/oasis-map-search-owned/dotnet-home
          NUGET_PACKAGES: ${{ runner.temp }}/oasis-map-search-owned/nuget
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/oasis-map-search-owned/nuget-http
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/oasis-map-search-owned"
          test "$probe" = "$RUNNER_TEMP/oasis-map-search-owned"
          test ! -L "$probe"
          api="$GITHUB_WORKSPACE/ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI"
          test -f "$api/Protos/map.proto"
          dotnet publish "$probe/probe-source/MapSearchTransportProbe.csproj" -c Release -o "$probe/probe" -m:2 -nr:false -p:UseSharedCompilation=false -p:UseAppHost=false -p:BaseIntermediateOutputPath="$probe/obj/" -p:OasisWebApiRoot="$api"
          test -f "$probe/probe/MapSearchTransportProbe.dll"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact source, tag, digest and packaged files
        env:
          SOURCE: ${{ inputs.source }}
          DIGEST: ${{ inputs.digest }}
          REQUIRE_TRON_READER: ${{ inputs.tron_reader }}
          REQUIRE_INFURA_READER: ${{ inputs.infura_reader }}
          REQUIRE_URBIT_READER: ${{ inputs.urbit_reader }}
          PACKAGE_PROFILE: ${{ inputs.package_profile }}
          TEACHING_IMAGE: ${{ inputs.teaching_image }}
        run: |
          args=()
          if [[ "$TEACHING_IMAGE" == true ]]; then args+=(--teaching-image); fi
          if [[ "$REQUIRE_TRON_READER" == true ]]; then args+=(--require-tron-reader); fi
          if [[ "$REQUIRE_URBIT_READER" == true ]]; then args+=(--require-urbit-reader); fi
          if [[ "$REQUIRE_INFURA_READER" == true ]]; then args+=(--require-infura-reader); fi
          python3 -B Scripts/TestHosts/qualify_web4_full_package.py --source "$SOURCE" --digest "$DIGEST" --profile "$PACKAGE_PROFILE" "${args[@]}"
      - name: Verify combined API and native startup on isolated fresh data
        if: inputs.combined_startup
        env:
          DIGEST: ${{ inputs.digest }}
          PACKAGE_PROFILE: ${{ inputs.package_profile }}
          OASIS_STARTUP_AUTHENTICATION: ${{ inputs.startup_authentication }}
          OASIS_STARTUP_POPUP_BREADTH: ${{ inputs.startup_popup_breadth }}
          OASIS_STARTUP_POPUP_GROUP: ${{ inputs.startup_popup_group }}
          OASIS_STARTUP_PORTAL_ROOT: ${{ inputs.startup_portal != '' && format('{0}/oportal-startup-source', github.workspace) || '' }}
          OASIS_PROFILE_BROWSER_RUNTIME: ${{ github.workspace }}/portal-startup-owned/runtime
          OASIS_STARTUP_MAP_GRPC_PROBE: ${{ inputs.startup_popup_group == 'map-search' && format('{0}/oasis-map-search-owned/probe/MapSearchTransportProbe.dll', runner.temp) || '' }}
        run: python3 -B Scripts/TestHosts/qualify_web4_combined_startup.py --digest "$DIGEST" --profile "$PACKAGE_PROFILE"
      - name: Retrieve the qualified Waku archive
        if: inputs.retained_waku
        uses: actions/download-artifact@v7
        with:
          name: waku-hosted-runtime-qualification
          run-id: 42554263377
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-waku
      - name: Start and restart the packaged Waku runtime with the original archive
        if: inputs.retained_waku
        env:
          DIGEST: ${{ inputs.digest }}
          PACKAGE_PROFILE: ${{ inputs.package_profile }}
        run: |
          test "$PACKAGE_PROFILE" = maplibre
          original="$RUNNER_TEMP/retained-waku/Original"
          printf '%s  %s\n' 0bd3c388c5662d3f73a6239555013d4526dd801e8746b58e38c4921f55ec9880 "$original/store-qualified.sqlite3" | sha256sum --check
          mkdir TestResults/WakuImageQualification
          docker run --rm --network none --no-healthcheck --entrypoint node \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/qualification,readonly" \
            --mount "type=bind,source=$original,target=/original,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/TestResults/WakuImageQualification,target=/result" \
            "ghcr.io/nextgensoftwareuk/oasis-web4@$DIGEST" \
            /qualification/Scripts/TestHosts/Verify-WakuHostedRuntime.cjs \
            /opt/waku/logosdeliverynode /original /result
      - name: Remove owned portal browser runtime and cache
        if: always() && (inputs.startup_portal != '' || inputs.startup_popup_group == 'map-search')
        run: |
          set -euo pipefail
          owned="$GITHUB_WORKSPACE/portal-startup-owned"
          test "$owned" = "$GITHUB_WORKSPACE/portal-startup-owned"
          test ! -L "$owned"
          if test -e "$owned"; then rm -rf -- "$owned"; fi
          test ! -e "$owned"
          echo 'Owned Startup portal runtime/cache/TLS absence verified.'
          probe="$RUNNER_TEMP/oasis-map-search-owned"
          test "$probe" = "$RUNNER_TEMP/oasis-map-search-owned"
          test ! -L "$probe"
          if test -e "$probe"; then rm -rf -- "$probe"; fi
          test ! -e "$probe"
          echo 'Owned map gRPC probe source/runtime/cache absent.'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web4-full-package
          path: |
            TestResults/WakuImageQualification/*.json
            TestResults/Web4FullPackage/
            TestResults/Web4CombinedStartup/
          if-no-files-found: warn
          retention-days: 30

  web5-depth:
    if: github.event_name == 'workflow_dispatch' && !inputs.clan_actor_compile && (inputs.startup_popup_group == 'map-geo' || inputs.startup_popup_group == 'web5-depth' || inputs.startup_popup_group == 'web5-errors' || inputs.startup_popup_group == 'web5-diff')
    uses: ./.github/workflows/oportal-web5-startup-qualification.yml
    with:
      portal: ${{ inputs.startup_portal }}
      popup_group: ${{ inputs.startup_popup_group }}
    secrets: inherit

  clan-actor-source:
    if: github.event_name == 'workflow_dispatch' && inputs.clan_actor_compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          path: OASIS
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Validate exact graph and read non-secret sibling pins
        id: pins
        working-directory: OASIS
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          python3 -B Scripts/sync_railway_dependency_manifest.py --check-ref "$EXPECTED_SOURCE"
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.pins.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.pins.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Own disposable compiler caches
        shell: bash
        run: |
          set -euo pipefail
          owned="$RUNNER_TEMP/oportal-clan-actor-$GITHUB_RUN_ID"
          test "$(realpath -m "$owned")" = "$owned"
          printf '%s\n' "DOTNET_CLI_HOME=$owned/dotnet-home" "NUGET_PACKAGES=$owned/nuget" "NUGET_HTTP_CACHE_PATH=$owned/nuget-http" "DOTNET_CLI_TELEMETRY_OPTOUT=1" "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" "DOTNET_GENERATE_ASPNET_CERTIFICATE=false" >> "$GITHUB_ENV"
      - name: Compile actual shipping MCP tools against paired Core
        id: compile
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner oportal-clan-actor-mcp-ci -Operation {
            dotnet build 'WEB6/NextGenSoftware.OASIS.MCP.Tools/NextGenSoftware.OASIS.MCP.Tools.csproj' -c Release -m:2 -nr:false -p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual MCP clan actor source compilation failed.' }
          }
      - name: Clean owned compiler outputs and retain compact receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          for name in OASIS NextGenSoftware-Libraries holochain-client-csharp; do
            repo="$workspace/$name"
            if [ -d "$repo/.git" ] || [ -f "$repo/.git" ]; then
              test "$(realpath "$repo")" = "$repo"
              git -C "$repo" submodule foreach --recursive 'git clean -qfdX'
              git -C "$repo" clean -qfdX
            fi
          done
          owned="$RUNNER_TEMP/oportal-clan-actor-$GITHUB_RUN_ID"
          test "$(realpath -m "$owned")" = "$owned"
          rm -rf -- "$owned"
          test ! -e "$owned"
          python3 - <<'PY'
          import json,os,pathlib
          receipt={'source':os.environ['EXPECTED_SOURCE'],'mcpCompilerPassed':os.environ['COMPILE_OUTCOME']=='success','ownedIgnoredOutputsCleaned':True,'ownedCacheAbsent':True,'backendCalls':0,'nativeTransportAcceptance':False,'hostedAcceptance':False}
          pathlib.Path(os.environ['GITHUB_WORKSPACE'],'oportal-clan-actor-source-receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oportal-clan-actor-source
          path: oportal-clan-actor-source-receipt.json
          retention-days: 14
      - name: Remove uploaded owned receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/oportal-clan-actor-source-receipt.json"
          test "$(realpath -m "$receipt")" = "$(realpath "$GITHUB_WORKSPACE")/oportal-clan-actor-source-receipt.json"
          rm -f -- "$receipt"
