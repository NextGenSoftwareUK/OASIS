name: Qualify immutable full WEB4 package
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact built source commit
        required: true
        type: string
      digest:
        description: Published full image sha256 digest
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain verifier before checking exact image source
        run: cp Scripts/TestHosts/qualify_web4_full_package.py "$RUNNER_TEMP/qualify_web4_full_package.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
          clean: true
      - name: Restore verifier to its repository path
        run: cp "$RUNNER_TEMP/qualify_web4_full_package.py" Scripts/TestHosts/qualify_web4_full_package.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact source, tag, digest and packaged files
        env:
          SOURCE: ${{ inputs.source }}
          DIGEST: ${{ inputs.digest }}
        run: python3 -B Scripts/TestHosts/qualify_web4_full_package.py --source "$SOURCE" --digest "$DIGEST"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web4-full-package
          path: TestResults/Web4FullPackage/
          if-no-files-found: warn
          retention-days: 30
