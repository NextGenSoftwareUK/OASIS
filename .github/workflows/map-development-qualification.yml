name: Scoped Map Development qualification
on:
  workflow_dispatch:
    inputs:
      candidate_scope:
        type: choice
        options: [map, hotspot, quest, competition, profile, billing, onode]
        default: map
      native_check:
        type: boolean
        default: false
      inventory_only:
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_scope:
        type: string
        default: map
      native_check:
        type: boolean
        default: false
      inventory_only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scoped-map-development-qualification-${{ inputs.inventory_only && 'inventory' || 'native' }}
  cancel-in-progress: false
jobs:
  compile-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          path: qualification-control
          sparse-checkout: |
            Scripts/TestHosts/Fixtures/map-development-candidate.json
            Scripts/TestHosts/Fixtures/hotspot-development-candidate.json
            Scripts/TestHosts/Fixtures/quest-authoritative-candidate.json
            Scripts/TestHosts/Fixtures/competition-development-candidate.json
            Scripts/TestHosts/Fixtures/profile-development-candidate.json
            Scripts/TestHosts/Fixtures/billing-development-candidate.json
            Scripts/TestHosts/Fixtures/onode-development-candidate.json
            Scripts/TestHosts/MapDevelopmentNative
            Scripts/TestHosts/HotspotDevelopmentNative
            Scripts/TestHosts/HotspotHttpNative
            Scripts/TestHosts/AwsSdkAbiProbe
            Scripts/TestHosts/OnodeCommandNative
            Scripts/TestHosts/Fixtures/geo-assets-browser-host.html
            Scripts/TestHosts/Fixtures/geo-assets-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/storefront-browser-host.html
            Scripts/TestHosts/Fixtures/storefront-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/gifts-browser-host.html
            Scripts/TestHosts/Fixtures/gifts-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/catalogue-browser-host.html
            Scripts/TestHosts/Fixtures/catalogue-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/competition-browser-host.html
            Scripts/TestHosts/Fixtures/competition-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/mfa-settings-browser-host.html
            Scripts/TestHosts/Fixtures/mfa-settings-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/session-settings-browser-host.html
            Scripts/TestHosts/Fixtures/session-settings-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/subscription-usage-browser-host.html
            Scripts/TestHosts/Fixtures/warning-email-browser-native-http.cjs
            Scripts/TestHosts/Fixtures/profile-browser-runtime.json
            Scripts/verify_web4_hyperdrive_route_manifest.ps1
            Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1
            Scripts/TestHosts/Test-SessionMiddlewareOrdering.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read immutable qualification candidate
        id: candidate
        shell: pwsh
        working-directory: qualification-control
        env:
          CANDIDATE_SCOPE: ${{ inputs.candidate_scope }}
        run: |
          if ($env:CANDIDATE_SCOPE -notin @('map','hotspot','quest','competition','profile','billing','onode')) { throw 'Unsupported candidate scope.' }
          if ($env:CANDIDATE_SCOPE -notin @('map','competition','profile','billing','onode') -and '${{ inputs.inventory_only }}' -eq 'true') { throw 'Only map, competition, profile, billing and onode scopes generate source inventories.' }
          $files = @{ map='Scripts/TestHosts/Fixtures/map-development-candidate.json'; hotspot='Scripts/TestHosts/Fixtures/hotspot-development-candidate.json'; quest='Scripts/TestHosts/Fixtures/quest-authoritative-candidate.json'; competition='Scripts/TestHosts/Fixtures/competition-development-candidate.json'; profile='Scripts/TestHosts/Fixtures/profile-development-candidate.json'; billing='Scripts/TestHosts/Fixtures/billing-development-candidate.json'; onode='Scripts/TestHosts/Fixtures/onode-development-candidate.json' }
          $file = $files[$env:CANDIDATE_SCOPE]
          $candidate = Get-Content $file -Raw | ConvertFrom-Json
          if ($env:CANDIDATE_SCOPE -eq 'billing' -and '${{ inputs.native_check }}' -eq 'true' -and (($candidate.nativeHost -ne 'HotspotHttpNative' -and $candidate.nativeHost -ne 'Web4IntegrationTests') -or $candidate.nativeMode -notin @('billing-http','billing-admin-http','billing-warning-store','billing-warning-http','billing-warning-provider','session-list-http','mfa-native','mfa-http','mfa-middleware-http','session-global-http','mfa-browser','billing-warning-browser','billing-restoration-http','session-route-fixture','gifts-browser','storefront-browser'))) { throw 'Billing requires an explicitly reviewed HTTP host mode.' }
          if ($env:CANDIDATE_SCOPE -eq 'competition' -and '${{ inputs.native_check }}' -eq 'true' -and $candidate.nativeMode -notin @('competition-browser','competition-publisher')) { throw 'Competition requires an explicit browser or publisher host.' }
          if ($env:CANDIDATE_SCOPE -eq 'onode' -and '${{ inputs.native_check }}' -eq 'true') { throw 'ONODE native acceptance requires its complete real bridge host; this source batch supports inventory and compilation only.' }
          if ($env:CANDIDATE_SCOPE -eq 'profile' -and '${{ inputs.native_check }}' -eq 'true' -and $candidate.nativeMode -ne 'profile-http') { throw 'Profile restoration requires its explicit HTTP host.' }
          if ($candidate.nativeHost -eq 'Web4IntegrationTests' -and $candidate.nativeMode -ne 'session-route-fixture') { throw 'Only the reviewed session HTTP fixture is supported.' }
          "native_host=$($candidate.nativeHost)" >> $env:GITHUB_OUTPUT
          "file=$file" >> $env:GITHUB_OUTPUT
          $browser = '${{ inputs.native_check }}' -eq 'true' -and (($candidate.nativeMode -in @('browser','catalogue-browser','competition-browser','mfa-browser','billing-warning-browser','gifts-browser','storefront-browser')) -or ($candidate.nativeMode -eq 'session-global-http' -and $candidate.sessionBrowser -eq $true))
          "browser=$($browser.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $warningProvider = '${{ inputs.native_check }}' -eq 'true' -and $candidate.nativeMode -in @('billing-warning-provider','billing-warning-browser')
          "warning_provider=$($warningProvider.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($browser) {
            if ($candidate.portal -notmatch '^[0-9a-f]{40}$') { throw 'Exact Portal revision required.' }
            "portal=$($candidate.portal)" >> $env:GITHUB_OUTPUT
          }
          if ('${{ inputs.inventory_only }}' -eq 'true' -and '${{ inputs.native_check }}' -eq 'true') { throw 'Inventory-only mode must not run native fixtures.' }
          foreach ($key in @('candidate','base')) {
            if ($candidate.$key -notmatch '^[0-9a-f]{40}$') { throw 'An exact candidate/base commit is required.' }
            "$key=$($candidate.$key)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.candidate }}
          path: OASIS
          fetch-depth: 2
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Verify scoped source and resolve unchanged sibling dependencies
        id: dependencies
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
          CANDIDATE_FILE: ${{ steps.candidate.outputs.file }}
        run: |
          $candidate = Get-Content (Join-Path ../qualification-control $env:CANDIDATE_FILE) -Raw | ConvertFrom-Json
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'Candidate source mismatch.' }
          if ((git rev-parse HEAD^) -ne $env:BASE_SHA) { throw 'Candidate parent mismatch.' }
          $actual = @(git diff --name-only $env:BASE_SHA HEAD)
          if ($actual.Count -ne $candidate.allowedPaths.Count -or [string]::Join("`n", @($actual | Sort-Object)) -cne [string]::Join("`n", @($candidate.allowedPaths | Sort-Object))) { throw 'Candidate includes unexpected source changes.' }
          $manifest = Get-Content Docker/oasis-dependency-versions.env
          foreach ($key in @('LIBRARIES_COMMIT','HOLOCHAIN_COMMIT')) {
            $lines = @($manifest | Where-Object { $_ -match "^${key}=" })
            if ($lines.Count -ne 1) { throw 'Sibling dependency pin missing.' }
            $revision = $lines[0].Substring($key.Length + 1)
            if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid sibling dependency pin.' }
            "$key=$revision" >> $env:GITHUB_OUTPUT
          }
          python Scripts/sync_railway_dependency_manifest.py --check
          if ($LASTEXITCODE) { throw 'Candidate manifest differs from gitlinks.' }
          python Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          if ($LASTEXITCODE) { throw 'Candidate dependency policy failed.' }
      - uses: actions/checkout@v7
        if: ${{ !inputs.inventory_only }}
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Verify the committed candidate inventory and classifier records
        if: ${{ !inputs.inventory_only }}
        shell: pwsh
        run: |
          & Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1
          if ($LASTEXITCODE) { throw 'Committed manager inventory failed validation.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1
          if ($LASTEXITCODE) { throw 'Committed route inventory failed validation.' }
      - uses: actions/checkout@v7
        if: ${{ !inputs.inventory_only }}
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: ${{ !inputs.inventory_only }}
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v7
        if: ${{ steps.candidate.outputs.browser == 'true' }}
        with:
          repository: NextGenSoftwareUK/OPORTAL-JS
          ref: ${{ steps.candidate.outputs.portal }}
          path: geo-portal
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Prepare pinned owned browser runtime
        if: ${{ steps.candidate.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          owned="$GITHUB_WORKSPACE/geo-browser-owned"
          test ! -e "$owned"
          mkdir "$owned"
          metadata='../qualification-control/Scripts/TestHosts/Fixtures/profile-browser-runtime.json'
          version="$(node -p "require('$metadata').version")"
          expected="$(node -p "require('$metadata').integrity")"
          actual="$(npm view "playwright-core@$version" dist.integrity --registry https://registry.npmjs.org --cache "$owned/npm-cache")"
          test "$actual" = "$expected"
          npm install --prefix "$owned/runtime" --cache "$owned/npm-cache" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund "playwright-core@$version"
      - name: Compile selected combined Development APIs
        if: ${{ !inputs.inventory_only && !inputs.native_check }}
        shell: pwsh
        env:
          CANDIDATE_FILE: ${{ steps.candidate.outputs.file }}
        run: |
          $candidate = Get-Content (Join-Path ../qualification-control $env:CANDIDATE_FILE) -Raw | ConvertFrom-Json
          $projects = if ($candidate.buildProjects) { @($candidate.buildProjects) } else { @('WEB4') }
          if (@($projects | Where-Object { $_ -notin @('WEB4','WEB5','WEB6','WEB7','WEB8','WEB9','WEB10','OUTBOXADMINTESTS','ONODESUPERVISOR') }).Count) { throw 'Unsupported qualification build target.' }
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner map-development-candidate-ci -Operation {
            foreach ($target in $projects) {
              $project = switch ($target) {
                'WEB4' { 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj' }
                'WEB5' { 'STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI/NextGenSoftware.OASIS.STAR.WebAPI.csproj' }
                'WEB6' { 'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj' }
                'WEB7' { 'WEB7/NextGenSoftware.OASIS.Web7.WebAPI/NextGenSoftware.OASIS.Web7.WebAPI.csproj' }
                'WEB8' { 'WEB8/NextGenSoftware.OASIS.Web8.WebAPI/NextGenSoftware.OASIS.Web8.WebAPI.csproj' }
                'WEB9' { 'WEB9/NextGenSoftware.OASIS.Web9.WebAPI/NextGenSoftware.OASIS.Web9.WebAPI.csproj' }
                'WEB10' { 'WEB10/NextGenSoftware.OASIS.Web10.WebAPI/NextGenSoftware.OASIS.Web10.WebAPI.csproj' }
                'ONODESUPERVISOR' { 'ONODE/ONODEManager/NextGenSoftware.OASIS.ONODE.Service/NextGenSoftware.OASIS.ONODE.Service.csproj' }
                'OUTBOXADMINTESTS' { 'Scripts/SubscriptionLedger.OutboxAdmin.Tests/SubscriptionLedger.OutboxAdmin.Tests.csproj' }
              }
              dotnet build $project --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE) { throw "Combined Development $target API build failed." }
              if ($target -eq 'ONODESUPERVISOR' -and $candidate.onodeCommandCheck -eq $true) {
                $probeRoot = [IO.Path]::GetFullPath('../qualification-control/Scripts/TestHosts/OnodeCommandNative')
                $controlRoot = [IO.Path]::GetFullPath('../qualification-control') + [IO.Path]::DirectorySeparatorChar
                if (!$probeRoot.StartsWith($controlRoot, [StringComparison]::Ordinal)) { throw 'Probe cleanup escaped control checkout.' }
                $probe = Join-Path $probeRoot 'OnodeCommandNative.csproj'
                $serviceProject = [IO.Path]::GetFullPath($project)
                $dnaProject = [IO.Path]::GetFullPath("OASIS Architecture/NextGenSoftware.OASIS.API.DNA/NextGenSoftware.OASIS.API.DNA.csproj")
                try {
                  dotnet build $probe --configuration Release "/p:OnodeServiceProject=$serviceProject" "/p:OasisDnaProject=$dnaProject" /m:2 /nr:false /p:UseSharedCompilation=false
                  if ($LASTEXITCODE) { throw 'ONODE real command host build failed.' }
                  dotnet (Join-Path $probeRoot 'bin/Release/net10.0/OnodeCommandNative.dll')
                  if ($LASTEXITCODE) { throw 'ONODE real command qualification failed.' }
                } finally {
                  foreach ($output in @('bin','obj')) {
                    $ownedOutput = Join-Path $probeRoot $output
                    if (Test-Path -LiteralPath $ownedOutput) { Remove-Item -LiteralPath $ownedOutput -Recurse -Force }
                  }
                }
              }
              if ($target -eq 'WEB6' -and $candidate.awsSdkAbiCheck -eq $true) {
                $probe = '../qualification-control/Scripts/TestHosts/AwsSdkAbiProbe/AwsSdkAbiProbe.csproj'
                dotnet build $probe --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
                if ($LASTEXITCODE) { throw 'AWS SDK ABI probe build failed.' }
                $output = Join-Path (Split-Path $project) 'bin/Release/net10.0'
                dotnet run --project $probe --configuration Release --no-build -- $output
                if ($LASTEXITCODE) { throw 'Compiled WEB6 AWS SDK ABI qualification failed.' }
              }
            }
          }
          Write-Host 'SCOPED_DEVELOPMENT_COMPILE: selected actual candidate APIs compiled; no behavior, Unity, deployed or complete-OPORTAL acceptance inferred.'
      - name: Generate source inventories for review without runtime changes
        if: ${{ inputs.inventory_only }}
        shell: pwsh
        run: |
          $managerPath = 'Docs/WIP/HyperDrive-Providers/HYPERDRIVE_V2_PUBLIC_MANAGER_METHOD_MANIFEST.csv'
          $routePath = 'Docs/WIP/HyperDrive-Providers/HYPERDRIVE_WEB4_ROUTE_MANIFEST.csv'
          $beforeManagers = @(Import-Csv $managerPath)
          $beforeRoutes = @(Import-Csv $routePath)
          Copy-Item -LiteralPath ../qualification-control/Scripts/verify_web4_hyperdrive_route_manifest.ps1 -Destination Scripts/verify_web4_hyperdrive_route_manifest.ps1
          & ../qualification-control/Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1 -ClassifierPath Scripts/verify_web4_hyperdrive_route_manifest.ps1
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1 -UpdateManifest
          if ($LASTEXITCODE) { throw 'Manager inventory generation failed.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1 -UpdateManifest
          if ($LASTEXITCODE) { throw 'Route inventory generation failed.' }
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1
          if ($LASTEXITCODE) { throw 'Generated manager inventory failed validation.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1
          if ($LASTEXITCODE) { throw 'Generated route inventory failed validation.' }
          $afterManagers = @(Import-Csv $managerPath)
          $afterRoutes = @(Import-Csv $routePath)
          $managerKey = { param($row) "$($row.SourceFile)|$($row.Line)|$($row.Signature)" }
          $routeKey = { param($row) "$($row.SourceFile)|$($row.Line)|$($row.Controller)|$($row.Action)|$($row.Verb)|$($row.Template)" }
          $oldManagerKeys = @($beforeManagers | ForEach-Object { & $managerKey $_ })
          $newManagerKeys = @($afterManagers | ForEach-Object { & $managerKey $_ })
          $oldRouteKeys = @($beforeRoutes | ForEach-Object { & $routeKey $_ })
          $newRouteKeys = @($afterRoutes | ForEach-Object { & $routeKey $_ })
          $approved = @($managerPath,$routePath,'Scripts/verify_web4_hyperdrive_route_manifest.ps1')
          $changed = @(git diff --name-only HEAD)
          if (@($changed | Where-Object { $_ -notin $approved }).Count) { throw 'Inventory generation mutated unrelated candidate source.' }
          $summary = [ordered]@{
            candidate = (git rev-parse HEAD); status = 'generated-pending-human-agent-review-not-deployed'
            managers = $afterManagers.Count; routes = $afterRoutes.Count
            managerAdded = @($newManagerKeys | Where-Object { $_ -notin $oldManagerKeys })
            managerRemoved = @($oldManagerKeys | Where-Object { $_ -notin $newManagerKeys })
            routeAdded = @($newRouteKeys | Where-Object { $_ -notin $oldRouteKeys })
            routeRemoved = @($oldRouteKeys | Where-Object { $_ -notin $newRouteKeys })
            generatedFiles = @($approved | ForEach-Object { @{path=$_;sha256=(Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant();bytes=(Get-Item $_).Length} })
            runtimeChanges = 0; behaviorCases = 0; fixtures = 0
          }
          New-Item -ItemType Directory -Path ../map-inventory-review -Force | Out-Null
          $summary | ConvertTo-Json -Depth 8 | Set-Content ../map-inventory-review/summary.json -Encoding utf8
          foreach ($file in $approved) { Copy-Item -LiteralPath $file -Destination ../map-inventory-review/ }
          Write-Host ($summary | ConvertTo-Json -Depth 8 -Compress)
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.inventory_only }}
        with:
          name: scoped-map-inventory-review
          path: map-inventory-review/
          retention-days: 3
          if-no-files-found: error
      - name: Start owned Mongo for the new combined-source check
        if: ${{ inputs.native_check && steps.candidate.outputs.native_host != 'Web4IntegrationTests' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name map-development-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify only the new combined candidate native invariant
        if: ${{ inputs.native_check }}
        shell: pwsh
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
          CANDIDATE_SCOPE: ${{ inputs.candidate_scope }}
          CANDIDATE_FILE: ${{ steps.candidate.outputs.file }}
          OASIS_GEO_PORTAL_ROOT: ${{ github.workspace }}/geo-portal
          OASIS_GEO_BROWSER_HOST: ${{ github.workspace }}/qualification-control/Scripts/TestHosts/Fixtures/geo-assets-browser-host.html
          OASIS_GEO_BROWSER_SCRIPT: ${{ github.workspace }}/qualification-control/Scripts/TestHosts/Fixtures/geo-assets-browser-native-http.cjs
          OASIS_PROFILE_BROWSER_RUNTIME: ${{ github.workspace }}/geo-browser-owned/runtime
          OASIS_WARNING_TEST_RESEND_ENABLED: ${{ steps.candidate.outputs.warning_provider == 'true' && 'true' || 'false' }}
          OASIS_WARNING_TEST_RESEND_KEY: ${{ steps.candidate.outputs.warning_provider == 'true' && secrets.OASIS_WARNING_TEST_RESEND_KEY || '' }}
          OASIS_WARNING_TEST_EMAIL_FROM: ${{ steps.candidate.outputs.warning_provider == 'true' && secrets.OASIS_WARNING_TEST_EMAIL_FROM || '' }}
        run: |
          $candidate = Get-Content (Join-Path ../qualification-control $env:CANDIDATE_FILE) -Raw | ConvertFrom-Json
          $hostName = if ($env:CANDIDATE_SCOPE -eq 'map') { 'MapDevelopmentNative' } else { if ($candidate.nativeHost) { $candidate.nativeHost } else { 'HotspotDevelopmentNative' } }
          if ($hostName -notin @('MapDevelopmentNative','HotspotDevelopmentNative','HotspotHttpNative','Web4IntegrationTests')) { throw 'Unsupported native qualification host.' }
          if ($hostName -eq 'HotspotHttpNative') {
            $env:OASIS_HOTSPOT_HTTP_MODE = if ($candidate.nativeMode) { $candidate.nativeMode } else { 'binding' }
            if ($env:OASIS_HOTSPOT_HTTP_MODE -notin @('binding','populated','browser','quest-empty','catalogue','catalogue-browser','competition-browser','competition-publisher','profile-http','billing-http','billing-admin-http','billing-warning-store','billing-warning-http','billing-warning-provider','session-list-http','mfa-native','mfa-http','mfa-middleware-http','session-global-http','mfa-browser','billing-warning-browser','billing-restoration-http','gifts-browser','storefront-browser')) { throw 'Unsupported hotspot HTTP check mode.' }
            if ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'catalogue-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/catalogue-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/catalogue-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'storefront-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/storefront-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/storefront-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'gifts-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/gifts-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/gifts-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'billing-warning-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/subscription-usage-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/warning-email-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'session-global-http' -and $candidate.sessionBrowser -eq $true) {
              $env:OASIS_SESSION_SETTINGS_BROWSER = 'true'
              if ($candidate.settingsReviewBrowser -eq $true) { $env:OASIS_ACCOUNT_REVIEW_BROWSER = 'true' }
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/session-settings-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/session-settings-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'mfa-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/mfa-settings-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/mfa-settings-browser-native-http.cjs).Path
            } elseif ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'competition-browser') {
              $env:OASIS_GEO_BROWSER_HOST = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/competition-browser-host.html).Path
              $env:OASIS_GEO_BROWSER_SCRIPT = (Resolve-Path ../qualification-control/Scripts/TestHosts/Fixtures/competition-browser-native-http.cjs).Path
            }
          }
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner map-development-native-ci -Operation {
            if ($hostName -eq 'Web4IntegrationTests') {
              dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.IntegrationTests/NextGenSoftware.OASIS.API.ONODE.WebAPI.IntegrationTests.csproj --configuration Release --filter 'FullyQualifiedName=NextGenSoftware.OASIS.API.ONODE.WebAPI.IntegrationTests.Subscription.SubscriptionEndpointsTests.HyperDriveReadRoutesAcceptRealJwtAfterV2PersistedAvatarLookup' --logger 'console;verbosity=normal' /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE) { throw 'Focused real LocalFile session HTTP fixture failed.' }
              return
            }
            if ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'mfa-middleware-http') {
              & ../qualification-control/Scripts/TestHosts/Test-SessionMiddlewareOrdering.ps1 -CandidateRoot (Get-Location).Path
            }
            [string[]]$qualificationArguments = if ($env:OASIS_HOTSPOT_HTTP_MODE -eq 'mfa-middleware-http' -or $candidate.compileSessionMiddleware -eq $true) { @('/p:OASISSessionMiddlewareCheck=true') } else { @() }
            dotnet build "../qualification-control/Scripts/TestHosts/$hostName/$hostName.csproj" --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false "/p:OASISCandidateRoot=$((Get-Location).Path)" @qualificationArguments
            if ($LASTEXITCODE) { throw "Combined Development native $hostName host build failed." }
            dotnet "../qualification-control/Scripts/TestHosts/$hostName/bin/Release/net10.0/$hostName.dll"
            if ($LASTEXITCODE) { throw "Combined Development native $hostName check failed." }
            if ($hostName -eq 'HotspotHttpNative' -and $env:OASIS_HOTSPOT_HTTP_MODE -eq 'billing-restoration-http') {
              dotnet test Scripts/SubscriptionLedger.OutboxAdmin.Tests/SubscriptionLedger.OutboxAdmin.Tests.csproj --configuration Release --filter 'FullyQualifiedName~UnsupportedServiceIsRejectedBeforeAuthenticationOrStorage|FullyQualifiedName~RealMongoRequeueUsesAuthenticatedActorAndPreservesSettlement' --logger 'console;verbosity=normal' /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE) { throw 'Changed operator service-binding checks failed.' }
            }
          }
      - name: Remove only the owned native fixture
        if: ${{ always() && inputs.native_check && steps.candidate.outputs.native_host != 'Web4IntegrationTests' }}
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect map-development-mongo >/dev/null 2>&1; then docker rm -f map-development-mongo; fi
          if docker container inspect map-development-mongo >/dev/null 2>&1; then exit 1; fi
          echo 'Owned Map Development container absence verified.'
      - name: Remove only the owned geo browser runtime and cache
        if: ${{ always() && steps.candidate.outputs.browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/geo-browser-owned"
          actual="$(realpath -m "$expected")"
          test "$actual" = "$expected"
          if [ -e "$actual" ]; then rm -rf -- "$actual"; fi
          test ! -e "$actual"
          echo 'Owned geo browser runtime/cache absence verified.'
