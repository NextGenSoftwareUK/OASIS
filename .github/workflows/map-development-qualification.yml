name: Scoped Map Development qualification
on:
  workflow_dispatch:
    inputs:
      native_check:
        type: boolean
        default: false
      inventory_only:
        type: boolean
        default: false
  workflow_call:
    inputs:
      native_check:
        type: boolean
        default: false
      inventory_only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scoped-map-development-qualification-${{ inputs.inventory_only && 'inventory' || 'native' }}
  cancel-in-progress: false
jobs:
  compile-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          path: qualification-control
          sparse-checkout: |
            Scripts/TestHosts/Fixtures/map-development-candidate.json
            Scripts/TestHosts/MapDevelopmentNative
            Scripts/verify_web4_hyperdrive_route_manifest.ps1
            Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read immutable qualification candidate
        id: candidate
        shell: pwsh
        working-directory: qualification-control
        run: |
          $candidate = Get-Content Scripts/TestHosts/Fixtures/map-development-candidate.json -Raw | ConvertFrom-Json
          if ('${{ inputs.inventory_only }}' -eq 'true' -and '${{ inputs.native_check }}' -eq 'true') { throw 'Inventory-only mode must not run native fixtures.' }
          foreach ($key in @('candidate','base')) {
            if ($candidate.$key -notmatch '^[0-9a-f]{40}$') { throw 'An exact candidate/base commit is required.' }
            "$key=$($candidate.$key)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.candidate }}
          path: OASIS
          fetch-depth: 2
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Verify scoped source and resolve unchanged sibling dependencies
        id: dependencies
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
        run: |
          $candidate = Get-Content ../qualification-control/Scripts/TestHosts/Fixtures/map-development-candidate.json -Raw | ConvertFrom-Json
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'Candidate source mismatch.' }
          if ((git rev-parse HEAD^) -ne $env:BASE_SHA) { throw 'Candidate parent mismatch.' }
          $actual = @(git diff --name-only $env:BASE_SHA HEAD)
          if ($actual.Count -ne $candidate.allowedPaths.Count -or @(Compare-Object ($actual | Sort-Object) ($candidate.allowedPaths | Sort-Object)).Count) { throw 'Candidate includes unexpected source changes.' }
          $manifest = Get-Content Docker/oasis-dependency-versions.env
          foreach ($key in @('LIBRARIES_COMMIT','HOLOCHAIN_COMMIT')) {
            $lines = @($manifest | Where-Object { $_ -match "^${key}=" })
            if ($lines.Count -ne 1) { throw 'Sibling dependency pin missing.' }
            $revision = $lines[0].Substring($key.Length + 1)
            if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid sibling dependency pin.' }
            "$key=$revision" >> $env:GITHUB_OUTPUT
          }
          python Scripts/sync_railway_dependency_manifest.py --check
          if ($LASTEXITCODE) { throw 'Candidate manifest differs from gitlinks.' }
          python Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          if ($LASTEXITCODE) { throw 'Candidate dependency policy failed.' }
      - uses: actions/checkout@v7
        if: ${{ !inputs.inventory_only }}
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Verify the committed candidate inventory and classifier records
        if: ${{ !inputs.inventory_only }}
        shell: pwsh
        run: |
          & Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1
          if ($LASTEXITCODE) { throw 'Committed manager inventory failed validation.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1
          if ($LASTEXITCODE) { throw 'Committed route inventory failed validation.' }
      - uses: actions/checkout@v7
        if: ${{ !inputs.inventory_only }}
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: ${{ !inputs.inventory_only }}
        with:
          dotnet-version: '10.0.x'
      - name: Compile actual combined Development WEB4 API only
        if: ${{ !inputs.inventory_only }}
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner map-development-candidate-ci -Operation {
            dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Combined Development Map API build failed.' }
          }
          Write-Host 'MAP_DEVELOPMENT_COMPILE: actual scoped candidate compiled; no behavior, Unity, deployed or complete-OPORTAL acceptance inferred.'
      - name: Generate source inventories for review without runtime changes
        if: ${{ inputs.inventory_only }}
        shell: pwsh
        run: |
          $managerPath = 'Docs/WIP/HyperDrive-Providers/HYPERDRIVE_V2_PUBLIC_MANAGER_METHOD_MANIFEST.csv'
          $routePath = 'Docs/WIP/HyperDrive-Providers/HYPERDRIVE_WEB4_ROUTE_MANIFEST.csv'
          $beforeManagers = @(Import-Csv $managerPath)
          $beforeRoutes = @(Import-Csv $routePath)
          Copy-Item -LiteralPath ../qualification-control/Scripts/verify_web4_hyperdrive_route_manifest.ps1 -Destination Scripts/verify_web4_hyperdrive_route_manifest.ps1
          & ../qualification-control/Scripts/TestHosts/Test-Web4RouteStorageClassification.ps1 -ClassifierPath Scripts/verify_web4_hyperdrive_route_manifest.ps1
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1 -UpdateManifest
          if ($LASTEXITCODE) { throw 'Manager inventory generation failed.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1 -UpdateManifest
          if ($LASTEXITCODE) { throw 'Route inventory generation failed.' }
          & Scripts/verify_hyperdrive_provider_io_manifest.ps1
          if ($LASTEXITCODE) { throw 'Generated manager inventory failed validation.' }
          & Scripts/verify_web4_hyperdrive_route_manifest.ps1
          if ($LASTEXITCODE) { throw 'Generated route inventory failed validation.' }
          $afterManagers = @(Import-Csv $managerPath)
          $afterRoutes = @(Import-Csv $routePath)
          $managerKey = { param($row) "$($row.SourceFile)|$($row.Signature)" }
          $routeKey = { param($row) "$($row.SourceFile)|$($row.Controller)|$($row.Action)|$($row.Verb)|$($row.Template)" }
          $oldManagerKeys = @($beforeManagers | ForEach-Object { & $managerKey $_ })
          $newManagerKeys = @($afterManagers | ForEach-Object { & $managerKey $_ })
          $oldRouteKeys = @($beforeRoutes | ForEach-Object { & $routeKey $_ })
          $newRouteKeys = @($afterRoutes | ForEach-Object { & $routeKey $_ })
          $approved = @($managerPath,$routePath,'Scripts/verify_web4_hyperdrive_route_manifest.ps1')
          $changed = @(git diff --name-only HEAD)
          if (@($changed | Where-Object { $_ -notin $approved }).Count) { throw 'Inventory generation mutated unrelated candidate source.' }
          $summary = [ordered]@{
            candidate = (git rev-parse HEAD); status = 'generated-pending-human-agent-review-not-deployed'
            managers = $afterManagers.Count; routes = $afterRoutes.Count
            managerAdded = @($newManagerKeys | Where-Object { $_ -notin $oldManagerKeys })
            managerRemoved = @($oldManagerKeys | Where-Object { $_ -notin $newManagerKeys })
            routeAdded = @($newRouteKeys | Where-Object { $_ -notin $oldRouteKeys })
            routeRemoved = @($oldRouteKeys | Where-Object { $_ -notin $newRouteKeys })
            generatedFiles = @($approved | ForEach-Object { @{path=$_;sha256=(Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant();bytes=(Get-Item $_).Length} })
            runtimeChanges = 0; behaviorCases = 0; fixtures = 0
          }
          New-Item -ItemType Directory -Path ../map-inventory-review -Force | Out-Null
          $summary | ConvertTo-Json -Depth 8 | Set-Content ../map-inventory-review/summary.json -Encoding utf8
          foreach ($file in $approved) { Copy-Item -LiteralPath $file -Destination ../map-inventory-review/ }
          Write-Host ($summary | ConvertTo-Json -Depth 8 -Compress)
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.inventory_only }}
        with:
          name: scoped-map-inventory-review
          path: map-inventory-review/
          retention-days: 3
          if-no-files-found: error
      - name: Start owned Mongo for the new combined-source check
        if: ${{ inputs.native_check }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name map-development-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec map-development-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify only the new combined candidate native invariant
        if: ${{ inputs.native_check }}
        shell: pwsh
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner map-development-native-ci -Operation {
            dotnet build ../qualification-control/Scripts/TestHosts/MapDevelopmentNative/MapDevelopmentNative.csproj --configuration Release /m:2 /nr:false /p:UseSharedCompilation=false "/p:OASISCandidateRoot=$((Get-Location).Path)"
            if ($LASTEXITCODE) { throw 'Combined Development native Map host build failed.' }
            dotnet ../qualification-control/Scripts/TestHosts/MapDevelopmentNative/bin/Release/net10.0/MapDevelopmentNative.dll
            if ($LASTEXITCODE) { throw 'Combined Development native Map check failed.' }
          }
      - name: Remove only the owned native fixture
        if: ${{ always() && inputs.native_check }}
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect map-development-mongo >/dev/null 2>&1; then docker rm -f map-development-mongo; fi
          if docker container inspect map-development-mongo >/dev/null 2>&1; then exit 1; fi
          echo 'Owned Map Development container absence verified.'
