name: OASIS routing integration

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/oasis-routing-integration.yml'
      - 'Providers/Maps/**'
      - '**/IOASISRoutingProvider.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build routing providers and verify GOMap against OSRM
        shell: pwsh
        env:
          GOMAP_RUN_INTEGRATION_TESTS: '1'
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-OASISRouting -Operation {
            foreach ($provider in 'GoogleMapsOASIS', 'MapboxOASIS', 'HEREMapsOASIS') {
              $project = "Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.$provider.IntegrationTests"
              dotnet build $project /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE -ne 0) { throw "Routing build failed for $provider." }
            }
            $mapbox = 'Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.MapboxOASIS'
            dotnet test "${mapbox}.UnitTests" /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "Mapbox adapter unit tests failed." }
            dotnet build "${mapbox}.TestHarness" /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "Mapbox routing harness build failed." }
            dotnet test "Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.GOMapOASIS.IntegrationTests" --filter "FullyQualifiedName~SharedRoutingInterfaceReturnsLiveDrivingRoute|FullyQualifiedName~PublicOsrmRejectsUnsupportedTravelProfiles" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { throw "GOMap shared routing verification failed." }
          }
