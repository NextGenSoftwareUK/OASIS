name: OpenSearch native document acknowledgement

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/opensearch-native-document.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.OpenSearchOASIS/OpenSearchOASIS.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.OpenSearchOASIS.IntegrationTests/OpenSearchNativeDocumentLifecycleTests.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.OpenSearchOASIS.IntegrationTests/OpenSearchNativeStorageConformanceTests.cs'
  workflow_dispatch:
    inputs:
      scope:
        description: Native verification scope
        type: choice
        default: storage
        options: [storage, document]

permissions:
  contents: read

jobs:
  activation:
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.scope == 'document' && '["async"]' || '["async","sync"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
          revision="$(sed -n 's/^HOLOCHAIN_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "holochain=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify the shipping REST adapter against OpenSearch
        shell: bash
        env:
          OASIS_OPENSEARCH_MODE: ${{ matrix.mode }}
          OASIS_OPENSEARCH_TEST_SCOPE: ${{ inputs.scope || 'storage' }}
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-opensearch.XXXXXXXX")"
          container=""
          cleanup() {
            local status=$?
            if [[ -n "$container" ]]; then
              if [[ "$status" -ne 0 ]]; then docker logs --tail 40 "$container" || true; fi
              docker rm --force --volumes "$container"
            fi
            for checkpoint in "$fixture"/storage-*.json; do
              if [[ -f "$checkpoint" ]]; then
                jq -c '{case:.CurrentCase,checks:(.Passed | length),cleanup:.FixtureCleanupComplete,contract:.FailureContract}' "$checkpoint"
              fi
            done
            rm -rf -- "$fixture"
            test ! -e "$fixture"
            echo "Removed the owned OpenSearch node, volumes and fixture."
          }
          trap cleanup EXIT
          if [[ "$(sysctl -n vm.max_map_count)" -lt 262144 ]]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          image=opensearchproject/opensearch@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
          container="$(docker run --detach --publish 127.0.0.1:19210:9200 \
            --env discovery.type=single-node --env DISABLE_INSTALL_DEMO_CONFIG=true \
            --env DISABLE_SECURITY_PLUGIN=true --env 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' "$image")"
          curl --fail --silent --show-error --retry 35 --retry-delay 2 --retry-all-errors --max-time 8 \
            'http://127.0.0.1:19210/_cluster/health?wait_for_status=yellow&timeout=5s' | jq -e '.timed_out == false'
          export OASIS_OPENSEARCH_DOCUMENT_FIXTURE=owned-ci-19210
          export OASIS_OPENSEARCH_REPORT_DIRECTORY="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-OpenSearchNativeDocument -Operation {
              $project = "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.OpenSearchOASIS.IntegrationTests"
              $test = if ($env:OASIS_OPENSEARCH_TEST_SCOPE -eq "document") {
                "OpenSearchNativeDocumentLifecycleTests"
              } else {
                "OpenSearchNativeStorageConformanceTests"
              }
              dotnet test $project --filter "FullyQualifiedName~$test" --logger "trx;LogFileName=opensearch.trx" --results-directory $env:OASIS_OPENSEARCH_REPORT_DIRECTORY /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE -ne 0) { throw "OpenSearch native document check failed." }
              [xml]$report = Get-Content -LiteralPath (Join-Path $env:OASIS_OPENSEARCH_REPORT_DIRECTORY "opensearch.trx") -Raw
              $counters = $report.SelectSingleNode("//*[local-name()=`"Counters`"]")
              if (-not $counters -or $counters.total -ne "1" -or $counters.passed -ne "1") {
                throw "Expected one executed and passing OpenSearch native test."
              }
            }'
