name: Hedera native storage deployment

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    tags: ['ci-cosmic-hedera-native-*']
    paths:
      - 'Scripts/TestHosts/Deploy-HederaLocalStorage.mjs'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS/HederaStorageConfiguration.cs'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests/HederaLocalStorageConformanceTests.cs'
  workflow_dispatch:
  workflow_call:
    inputs:
      routing:
        type: boolean
        default: false
    secrets:
      PRIVATE_SUBMODULE_PAT:
        required: true

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [async, sync]
    defaults:
      run:
        working-directory: OASIS
    steps:
      - name: Resolve the Development baseline
        if: inputs.routing
        id: baseline
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/Development" --jq .object.sha)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Qualifying Hedera routing on Development $revision"

      - uses: actions/checkout@v7
        if: inputs.routing
        with:
          path: provider-source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          ref: ${{ steps.baseline.outputs.revision || github.sha }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Apply the reviewed Hedera routing scope
        if: inputs.routing
        shell: bash
        run: |
          base=18f227af493af1ca26c90429343f37a0f1a2147a
          git -C ../provider-source fetch --no-tags --depth=1 origin "$base"
          tests='Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests'
          for path in "$tests/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests.csproj" \
            "$tests/HederaSqliteHyperDriveTests.cs" \
            'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS/HashgraphOASIS.cs' \
            'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS/HederaSdkClient.cs' \
            'Providers/Shared/TestSupport/NativePriorityRouting.cs'; do
            current="$(git ls-tree HEAD -- "$path")"
            reviewed="$(git -C ../provider-source ls-tree "$base" -- "$path")"
            incoming="$(git -C ../provider-source ls-tree HEAD -- "$path")"
            [[ -n "$incoming" && ( "$current" == "$reviewed" || "$current" == "$incoming" ) ]]
            install -m 644 "../provider-source/$path" "$path"
            git add -- "$path"
          done
          echo "Qualified input tree: $(git write-tree)"

      - name: Read recorded dependency revisions
        id: dependencies
        run: |
          for dependency in LIBRARIES HOLOCHAIN; do
            revision="$(sed -n "s/^${dependency}_COMMIT=//p" Docker/oasis-dependency-versions.env)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
            echo "${dependency,,}=$revision" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Deploy the contract and run storage conformance through local Hiero consensus
        shell: bash
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-hedera.XXXXXXXX")"
          sdk="$PWD/Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS/SdkBridge"
          [[ ! -e "$sdk/node_modules" ]]
          export npm_config_cache="$fixture/npm-cache"
          local_started=false
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$local_started" == true ]]; then
              if (( status != 0 )); then
                docker ps -a --format '{{.Names}} {{.Status}}'
                for service in network-node mirror-node-grpc; do
                  docker logs --tail 25 "$service" >&2 || true
                done
              fi
              (cd "$fixture" && npm exec --yes --package=@hashgraph/hedera-local@2.40.2 -- hedera stop) || status=1
              [[ -z "$(docker ps -aq)" ]] || status=1
            fi
            rm -rf -- "$sdk/node_modules"
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-hedera.* ]]; then
              sudo rm -rf -- "$fixture"
              test ! -e "$fixture" || status=1
            fi
            if (( status == 0 )); then echo "Removed the owned Hiero fixture and SDK dependencies."; fi
            exit "$status"
          }
          trap cleanup EXIT
          npm ci --prefix "$sdk" --ignore-scripts --no-audit --no-fund
          npm install --prefix "$fixture" --ignore-scripts --no-audit --no-fund --no-save solc@0.8.26
          [[ -z "$(docker ps -aq)" ]]
          local_started=true
          # Upstream generates bind-mounted configuration read by non-root services.
          # The enclosing mktemp directory and OASIS-owned inputs remain private.
          (umask 022; cd "$fixture" && FIRING_UP_RETRY_ATTEMPTS=1200 npm exec --yes --package=@hashgraph/hedera-local@2.40.2 -- hedera start --host=127.0.0.1 --accounts=1)
          export OASIS_HEDERA_LOCAL_FIXTURE="$fixture" OASIS_HEDERA_SDK_BRIDGE="$sdk/bridge.mjs"
          export OASIS_HEDERA_LOCAL_MODE="${{ matrix.mode }}"
          export OASIS_HEDERA_ROUTING="${{ inputs.routing && '1' || '0' }}"
          export OASIS_HEDERA_LOCAL_SIGNING_KEY=302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137
          export OASIS_HEDERA_LOCAL_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          node Scripts/TestHosts/Deploy-HederaLocalStorage.mjs "$fixture"
          export OASIS_HEDERA_LOCAL_CONTRACT_ID="$(jq -er '.contractId' "$fixture/deployment.json")"
          [[ "$OASIS_HEDERA_LOCAL_CONTRACT_ID" =~ ^0\.0\.[1-9][0-9]*$ ]]
          if [[ "$OASIS_HEDERA_ROUTING" == 1 ]]; then
            pwsh -NoProfile -Command '
              ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-HederaRouting -Operation {
                $project = "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests"
                dotnet test $project --filter "FullyQualifiedName~RoutesAcrossNativeHederaAndSqlite" /p:HederaRoutingTests=true /m:2 /nr:false /p:UseSharedCompilation=false --results-directory $env:OASIS_HEDERA_LOCAL_FIXTURE --logger "trx;LogFileName=routing.trx"
                if ($LASTEXITCODE -ne 0) { throw "Native Hedera routing verification failed." }
                [xml]$report = Get-Content -LiteralPath (Join-Path $env:OASIS_HEDERA_LOCAL_FIXTURE "routing.trx")
                if ($report.TestRun.ResultSummary.Counters.passed -ne "1" -or $report.TestRun.ResultSummary.Counters.total -ne "1") {
                  throw "The native Hedera routing case must execute and pass."
                }
              }'
            echo "Verified native Hedera routing and empty contract in $OASIS_HEDERA_LOCAL_MODE mode."
            exit 0
          fi
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-HederaStorage -Operation {
              dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.HashgraphOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstHieroConsensus" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native Hedera storage verification failed." }
            }'
          jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' \
            "$fixture/core-storage-$OASIS_HEDERA_LOCAL_MODE.json" >/dev/null
          echo "Verified native Hedera $OASIS_HEDERA_LOCAL_MODE storage and independently empty contract keys."
