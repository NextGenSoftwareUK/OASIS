name: Qualify exact current CQL and portal composition

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - "OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/CqlBooleanTextCaseWireTests.cs"
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed parent source SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ inputs.source || github.sha }}
    steps:
      - name: Validate exact source input
        shell: bash
        run: '[[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source || github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify bounded conditional-text capture and compilation
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-current-composition-ci -Operation {
            dotnet test "OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests" /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CqlBooleanTextCaseWireTests|FullyQualifiedName~CqlInt32CoalesceWireTests' --results-directory TestResults/SetContract --logger 'trx;LogFileName=entry.trx'
            if ($LASTEXITCODE) { throw 'Selected-set contract failed' }
            [xml]$report = Get-Content TestResults/SetContract/entry.trx
            if ($report.TestRun.ResultSummary.Counters.passed -ne '6' -or $report.TestRun.ResultSummary.Counters.total -ne '6') { throw 'All six computed-scalar transport controls must pass' }
            dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB4 composition failed to compile' }
            dotnet build "STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI" /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB5 composition failed to compile' }
            $source=(git rev-parse HEAD).Trim()
            if ($source -ne $env:EXPECTED_SOURCE) { throw 'Exact checked-out source differs' }
            $core=(git -C "OASIS Architecture/NextGenSoftware.OASIS.API.Core" rev-parse HEAD).Trim()
            @{source=$source;core=$core;testsPassed=6;web4Compiled=$true;web5Compiled=$true;dataWrites=0} | ConvertTo-Json | Set-Content TestResults/SetContract/source.json -Encoding utf8

          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-current-composition
          path: OASIS/TestResults/SetContract/
          if-no-files-found: ignore
          retention-days: 2
