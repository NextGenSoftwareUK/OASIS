name: Assemble pinned Urbit contacts desk

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-urbit-desk.yml'
      - 'Scripts/TestHosts/qualify_urbit_desk.py'
      - 'Scripts/TestHosts/urbit-contacts-inputs.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbit-contacts-desk-assembly
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify and assemble exact upstream source files
        id: assembly
        run: python3 -B Scripts/TestHosts/qualify_urbit_desk.py
      - uses: actions/cache/save@v4
        if: steps.assembly.outputs.assembled == 'true'
        with:
          path: LocalState/COSMIC/CloudUrbitContactsDesk
          key: urbit-contacts-desk-${{ hashFiles('Scripts/TestHosts/urbit-contacts-inputs.json', 'Scripts/TestHosts/qualify_urbit_desk.py') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: urbit-contacts-desk
          path: TestResults/UrbitDeskCurrent/*.json
          retention-days: 7
