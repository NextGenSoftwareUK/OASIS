name: PlanetScale adapter on native MySQL

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/planetscale-mysql-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.PlanetScaleOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.PlanetScaleOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run native storage conformance against MySQL
        shell: bash
        run: |
          image=docker.io/library/mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-planetscale-mysql.XXXXXXXX")"
          container=""
          image_owned=false
          cleanup() {
            status=$?
            if [[ -n "$container" ]]; then
              if (( status != 0 )); then docker logs --tail 35 "$container" || true; fi
              docker rm -fv "$container" || status=1
            fi
            if [[ "$image_owned" == true ]] && docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || status=1
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-planetscale-mysql.* ]]; then rm -rf -- "$fixture"; fi
            [[ ! -e "$fixture" ]] || status=1
            if (( status == 0 )); then echo "Removed the owned MySQL container, volumes and fixture."; fi
            exit "$status"
          }
          trap cleanup EXIT
          if ! docker image inspect "$image" >/dev/null 2>&1; then image_owned=true; fi
          export OASIS_PLANETSCALE_MYSQL_CI_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$OASIS_PLANETSCALE_MYSQL_CI_PASSWORD"
          root_password="$(openssl rand -hex 24)"
          echo "::add-mask::$root_password"
          container="$(docker run -d -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD="$root_password" -e MYSQL_DATABASE=oasis_storage_async \
            -e MYSQL_USER=oasis -e MYSQL_PASSWORD="$OASIS_PLANETSCALE_MYSQL_CI_PASSWORD" "$image")"
          sql=(docker exec -e MYSQL_PWD="$root_password" "$container" mysql --user=root --batch --skip-column-names)
          ready=(docker exec -e MYSQL_PWD="$OASIS_PLANETSCALE_MYSQL_CI_PASSWORD" "$container" mysql --host=127.0.0.1 --user=oasis --database=oasis_storage_async --batch --skip-column-names)
          for attempt in {1..60}; do
            if timeout 3 "${ready[@]}" --execute="SELECT 1" 2>/dev/null | grep -qx 1; then break; fi
            [[ "$attempt" != 60 ]]
            sleep 2
          done
          "${sql[@]}" --execute="SELECT VERSION(); CREATE DATABASE oasis_storage_sync; GRANT ALL ON oasis_storage_sync.* TO 'oasis'@'%';"
          export OASIS_PLANETSCALE_MYSQL_CI_FIXTURE="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-PlanetScaleMySql -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.PlanetScaleOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.PlanetScaleOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstMySql" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native MySQL storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/oasis_storage_$mode.json" >/dev/null
          done
          echo "Verified both MySQL storage modes and exact native cleanup."
