name: Qualify current Development with native CQL set composition

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - ".github/workflows/qualify-cql-snapshot-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compile preserved Development WEB4 and WEB5 with native set source
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-snapshot-hotspot-composition-ci -Operation {
            dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB4 composition failed to compile' }
            dotnet build "STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI" /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Combined WEB5 source failed compilation' }
            $report=@{
              source=(git rev-parse HEAD).Trim()
              core=(git rev-parse "HEAD:OASIS Architecture/NextGenSoftware.OASIS.API.Core").Trim()
              onode=(git rev-parse "HEAD:ONODE/NextGenSoftware.OASIS.API.ONODE.Core").Trim()
              star=(git rev-parse "HEAD:STAR ODK").Trim()
              web4Compiled=$true
              web5Compiled=$true
              behaviorCasesRun=0
              databaseWrites=0
            }
            New-Item -ItemType Directory -Force TestResults/SnapshotComposition | Out-Null
            $report | ConvertTo-Json | Set-Content -Encoding utf8 TestResults/SnapshotComposition/compiled.json
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-snapshot-hotspot-composition
          path: OASIS/TestResults/SnapshotComposition/compiled.json
          if-no-files-found: ignore
          retention-days: 2
