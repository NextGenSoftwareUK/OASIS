name: Algorand native storage

on:
  push:
    branches: [work/algorand-native-storage, work/hyperdrive-triad]
    paths:
      - '.github/workflows/algorand-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS.IntegrationTests/AlgorandNativeStorageConformanceTests.cs'
      - 'Scripts/TestHosts/Test-AlgorandRecordBoxes.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the shared core storage suite against the record-box application on a disposable LocalNet
        run: |
          set -euo pipefail
          owned="$(mktemp -d "$RUNNER_TEMP/oasis-algorand.XXXXXXXX")"
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          cleanup() {
            status=$?
            cleanup_status=0
            trap - EXIT
            compose="$owned/localnet/sandbox/docker-compose.yml"
            project_label="com.docker.compose.project=algokit_sandbox"
            if [[ -f "$compose" ]]; then
              docker compose -f "$compose" down --volumes --remove-orphans || cleanup_status=1
            fi
            remaining="$(docker ps -aq --filter "label=$project_label")$(docker network ls -q --filter "label=$project_label")$(docker volume ls -q --filter "label=$project_label")" || cleanup_status=1
            if [[ -n "$remaining" ]]; then
              echo "Owned Algorand LocalNet resources remain after teardown." >&2
              cleanup_status=1
            fi
            [[ "$owned" == "$RUNNER_TEMP"/oasis-algorand.* ]] && rm -rf -- "$owned"
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            (( cleanup_status == 0 )) || status=1
            exit "$status"
          }
          trap cleanup EXIT
          python -m venv "$owned/venv"
          "$owned/venv/bin/pip" install --no-cache-dir algokit==2.10.2 py-algorand-sdk==2.12.0
          mkdir "$owned/localnet"
          "$owned/venv/bin/algokit" localnet start --config-dir "$owned/localnet"
          umask 077
          # Deploys the record-box application and enrols an ephemeral, funded writer whose seed the suite signs with.
          OASIS_ALGORAND_ENROLLED_FIXTURE_ENV="$owned/record-fixture.env" OASIS_ALGORAND_RECORD_WRITE_TEST=true \
            "$owned/venv/bin/python" -B Scripts/TestHosts/Test-AlgorandRecordBoxes.py
          set -a
          source "$owned/record-fixture.env"
          set +a
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS.IntegrationTests" \
            -p:NativeStorageConformance=true --filter "FullyQualifiedName~AlgorandNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Algorand passed both storage modes against the record-box application on LocalNet."
