name: Qualify admitted private Urbit WEB4 queries

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-urbit-web4-admission.yml'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/CqlUrbitAdmittedTests.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbit-admitted-web4-qualification
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|OASIS_API_CORE_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/OASIS-API-Core
          ref: ${{ steps.dependency.outputs.OASIS_API_CORE_COMMIT }}
          path: OASIS/OASIS Architecture/NextGenSoftware.OASIS.API.Core
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify controlled admitted endpoint privacy and projection
        working-directory: OASIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner urbit-admitted-web4-ci -Operation {
            $project = 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/NextGenSoftware.OASIS.API.Core.UnitTests.csproj'
            dotnet test $project /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~UrbitAdmitted' --results-directory TestResults/UrbitAdmittedWeb4Current --logger 'trx;LogFileName=query.trx'
            if ($LASTEXITCODE) { throw 'Urbit admitted endpoint qualification failed' }
            [xml]$report = Get-Content TestResults/UrbitAdmittedWeb4Current/query.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.total -ne '4' -or $counts.executed -ne '4' -or $counts.passed -ne '4') { throw 'All 4 admitted endpoint controls must execute and pass' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: urbit-admitted-web4-controls
          path: OASIS/TestResults/UrbitAdmittedWeb4Current/
          retention-days: 7
