name: Qualify bounded GOMap OSRM route client

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-gomap-route-client.yml'
      - 'Docker/oasis-dependency-versions.env'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core'
      - 'Providers/Maps/NextGenSoftware.OASIS.API.Providers.GOMapOASIS/**'
      - 'Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.GOMapOASIS.UnitTests/**'
  workflow_dispatch:
    inputs:
      native_route:
        description: Make three fixed public Berlin route reads (developer qualification only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Validate exact dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify capability HTTP and parser boundary without native service access
        working-directory: OASIS
        shell: pwsh
        env:
          RUN_NATIVE_ROUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.native_route }}
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner gomap-route-client-ci -Operation {
            dotnet test Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.GOMapOASIS.UnitTests --filter FullyQualifiedName~OSRMBoundedClientTests /m:2 /nr:false /p:UseSharedCompilation=false --results-directory TestResults/GOMapRouteClientCurrent --logger 'trx;LogFileName=controlled.trx'
            if ($LASTEXITCODE) { throw 'GOMap route controlled client qualification failed' }
            [xml]$report = Get-Content TestResults/GOMapRouteClientCurrent/controlled.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '28' -or $counts.total -ne '28' -or $counts.executed -ne '28') {
              throw 'All twenty-eight controlled client cases must execute and pass without skips'
            }
            if ($env:RUN_NATIVE_ROUTE -eq 'true') {
              $env:COSMIC_GOMAP_NATIVE_ROUTE='fixed-public-berlin'
              $env:COSMIC_GOMAP_NATIVE_EVIDENCE_DIRECTORY=[IO.Path]::GetFullPath('TestResults/GOMapRouteClientCurrent/native')
              dotnet test Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.GOMapOASIS.UnitTests --no-build --no-restore --filter FullyQualifiedName~OSRMNativeRouteTests --results-directory TestResults/GOMapRouteClientCurrent --logger 'trx;LogFileName=native.trx'
              if ($LASTEXITCODE) { throw 'GOMap fixed native route qualification failed; no retry' }
              [xml]$native = Get-Content TestResults/GOMapRouteClientCurrent/native.trx
              $n = $native.TestRun.ResultSummary.Counters
              if ($n.passed -ne '1' -or $n.total -ne '1' -or $n.executed -ne '1') { throw 'Native route case must execute and pass' }
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gomap-route-client-qualification
          path: |
            OASIS/TestResults/GOMapRouteClientCurrent/*.trx
            OASIS/TestResults/GOMapRouteClientCurrent/native/
          if-no-files-found: error
          retention-days: 30
