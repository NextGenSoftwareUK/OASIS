name: TON native storage

on:
  push:
    branches: [work/ton-native-storage]
    paths:
      - '.github/workflows/ton-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.TONOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.TONOASIS.IntegrationTests/TonNativeStorageConformanceTests.cs'
      - 'Scripts/TestHosts/compile-cosmic-ton.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Run the shared core storage suite against a disposable local TVM sandbox
        run: |
          set -euo pipefail
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          tools="$(mktemp -d "$RUNNER_TEMP/oasis-ton-tools.XXXXXXXX")"
          cleanup() {
            status=$?
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            [[ "$tools" == "$RUNNER_TEMP"/oasis-ton-tools.* ]] && rm -rf -- "$tools"
            exit "$status"
          }
          trap cleanup EXIT
          # Same SDK bridge, contract compilation and code-hash pin as the TON/SQLite routing workflow.
          source="$PWD/Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.TONOASIS/SdkBridge"
          sdk="$tools/sdk"
          mkdir "$sdk"
          cp "$source"/{package.json,package-lock.json,native-worker.cjs,sandbox-store.cjs} "$sdk/"
          npm ci --prefix "$sdk" --no-audit --no-fund
          export NODE_PATH="$sdk/node_modules"
          node Scripts/TestHosts/compile-cosmic-ton.cjs "$tools/compiled"
          export OASIS_TON_CODE_HASH="$(node -e 'const{Cell}=require("@ton/core");const fs=require("node:fs");console.log(Cell.fromBoc(fs.readFileSync(process.argv[1]))[0].hash().toString("hex"))' "$tools/compiled/TonHolonStore_TonHolonStore.code.boc")"
          [[ "$OASIS_TON_CODE_HASH" == 16bb222acfe6e01c5fc05f5eef6c2fe114c53b2b4bda50b28db6009e644cd741 ]]
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_TON_COMPILED_DIRECTORY="$tools/compiled" \
            OASIS_TON_NODE="$(command -v node)" OASIS_TON_WORKER="$sdk/native-worker.cjs"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.TONOASIS.IntegrationTests" \
            -p:NativeStorageConformance=true --filter "FullyQualifiedName~TonNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "TON passed both storage modes against the local TVM sandbox."
