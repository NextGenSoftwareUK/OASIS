name: Starknet native storage

on:
  push:
    branches: [work/hyperdrive-triad]
    paths:
      - '.github/workflows/starknet-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.StarknetOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.StarknetOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: '2.21.0'
      - name: Build the OasisKv contract and install the pinned SDK bridge
        run: |
          (cd Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.StarknetOASIS/contracts && scarb build)
          (cd Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.StarknetOASIS/SdkBridge && npm ci --ignore-scripts && node --test)
      - name: Run the shared core storage suite against a disposable starknet-devnet and Kubo
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          devnet="" kubo=""
          cleanup() {
            status=$?
            if [[ -n "$devnet" ]]; then (( status != 0 )) && docker logs --tail 40 "$devnet"; docker rm -fv "$devnet" >/dev/null || status=1; fi
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          devnet="$(docker run -d -p 127.0.0.1:15050:5050 docker.io/shardlabs/starknet-devnet-rs@sha256:45c9a0e56ea39aa76c1860bfc6011046694295311a35d7d1efce6bad0d6c88ed)"
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:15050/is_alive >/dev/null 2>&1 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 90 ]]; sleep 2
          done
          provider=Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.StarknetOASIS
          node "$provider/SdkBridge/devnet-setup.mjs" http://127.0.0.1:15050/rpc http://127.0.0.1:15050             "$provider/contracts/target/dev/oasis_kv_OasisKv.contract_class.json"             "$provider/contracts/target/dev/oasis_kv_OasisKv.compiled_contract_class.json" > "$fixture/devnet.env"
          set -a; source "$fixture/devnet.env"; set +a
          rm -f -- "$fixture/devnet.env"
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_STARKNET_RPC="http://127.0.0.1:15050/rpc" OASIS_STARKNET_KUBO="http://127.0.0.1:15001"             OASIS_STARKNET_SDK_BRIDGE="$PWD/$provider/SdkBridge/bridge.mjs"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.StarknetOASIS.IntegrationTests"             -p:NativeStorageConformance=true --filter "FullyQualifiedName~StarknetNativeStorageConformanceTests"             -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Starknet passed both storage modes against a local devnet."
