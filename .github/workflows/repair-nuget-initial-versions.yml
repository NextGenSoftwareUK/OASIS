name: Repair NuGet Initial Versions

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish corrected packages before unlisting, or resume only the idempotent unlisting phase
        required: true
        type: choice
        default: PublishAndUnlist
        options:
          - PublishAndUnlist
          - Unlist

permissions:
  contents: read

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Repair NuGet initial versions
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./Scripts/Repair-OASISNuGetInitialVersions.ps1 -Operation '${{ inputs.operation }}'
