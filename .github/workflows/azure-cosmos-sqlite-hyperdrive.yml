name: Azure Cosmos DB and SQLite HyperDrive routing

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/azure-cosmos-sqlite-hyperdrive.yml'
      - 'Providers/Cloud/TestProjects/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests/AzureCosmosSqliteHyperDriveTests.cs'
      - 'Providers/Shared/TestSupport/NativePriorityRouting.cs'
      - 'Providers/Cloud/TestProjects/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
    steps:
      - name: Resolve the Development baseline
        id: baseline
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/Development" --jq .object.sha)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Qualifying priority Oracle and Azure routing on Development $revision"

      - uses: actions/checkout@v7
        with:
          path: provider-source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          ref: ${{ steps.baseline.outputs.revision }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Apply the reviewed priority Oracle and Azure routing scope
        shell: bash
        run: |
          base=df02d6f43bfe282017cb236366c15940391a864c
          git -C ../provider-source fetch --no-tags --depth=1 origin "$base"
          oracle='Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.OracleDBOASIS.IntegrationTests'
          azure='Providers/Cloud/TestProjects/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests'
          for path in "$oracle/NextGenSoftware.OASIS.API.Providers.OracleDBOASIS.IntegrationTests.csproj" \
            "$oracle/OracleSqliteHyperDriveTests.cs" \
            "$azure/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests.csproj" \
            "$azure/AzureCosmosSqliteHyperDriveTests.cs" \
            'Providers/Shared/TestSupport/NativePriorityRouting.cs'; do
            current="$(git ls-tree HEAD -- "$path")"
            reviewed="$(git -C ../provider-source ls-tree "$base" -- "$path")"
            incoming="$(git -C ../provider-source ls-tree HEAD -- "$path")"
            [[ -n "$incoming" && ( "$current" == "$reviewed" || "$current" == "$incoming" ) ]]
            install -m 644 "../provider-source/$path" "$path"
            git add -- "$path"
          done
          echo "Qualified input tree: $(git write-tree)"

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
          revision="$(sed -n 's/^HOLOCHAIN_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "holochain=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify routing against the Microsoft emulator and SQLite
        shell: bash
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-azure-routing.XXXXXXXX")"
          container=""
          cleanup() {
            local status=$? cleanup_status=0
            if [[ -n "$container" ]]; then
              docker rm --force --volumes "$container" >/dev/null || cleanup_status=1
              if docker inspect "$container" >/dev/null 2>&1; then cleanup_status=1; fi
            fi
            rm -rf -- "$fixture" || cleanup_status=1
            if [[ "$cleanup_status" -ne 0 || -e "$fixture" ]]; then exit 1; fi
            echo "Removed the owned Cosmos DB emulator, volumes, SQLite files and test output."
            exit "$status"
          }
          trap cleanup EXIT
          image=mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
          container="$(docker run --detach --publish 127.0.0.1:8080:8080 --publish 127.0.0.1:8081:8081 \
            "$image" --protocol https --enable-explorer false)"
          curl --fail --silent --show-error --retry 45 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:8080/ready
          export OASIS_AZURE_COSMOS_ROUTING_DIRECTORY="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-PriorityAzureRouting -Operation {
              $project = "Providers/Cloud/TestProjects/NextGenSoftware.OASIS.API.Providers.AzureCosmosDBOASIS.IntegrationTests"
              dotnet test $project --filter "FullyQualifiedName~AzureCosmosSqliteHyperDriveTests" --logger "trx;LogFileName=routing.trx" --results-directory $env:OASIS_AZURE_COSMOS_ROUTING_DIRECTORY /p:AzureCosmosRoutingTests=true /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE -ne 0) { throw "Native Azure Cosmos DB and SQLite routing checks failed." }
              [xml]$report = Get-Content -LiteralPath (Join-Path $env:OASIS_AZURE_COSMOS_ROUTING_DIRECTORY "routing.trx") -Raw
              $counters = $report.SelectSingleNode("//*[local-name()=`"Counters`"]")
              if (-not $counters -or $counters.total -ne "2" -or $counters.passed -ne "2") {
                throw "Expected two executed and passing Cosmos DB and SQLite routing cases."
              }
            }'
