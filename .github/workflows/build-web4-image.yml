name: Build WEB4 image

# Builds Docker/Dockerfile.web4 on a GitHub runner and publishes it to GHCR.
# Railway's builder runs out of resources during `dotnet publish` of the ONODE
# WebAPI with no error text, so the sandbox deploys this finished image instead.
# Private dependencies are cloned inside the Dockerfile at the revisions pinned
# in Docker/oasis-dependency-versions.env using PRIVATE_SUBMODULE_PAT; the token
# is a build-stage ARG and never reaches the published final stage.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of the parent repository to build
        required: true
        type: string
        default: Development
      tag:
        description: Extra image tag besides the commit SHA (leave empty for a commit-only build)
        required: false
        type: string
        default: ''
      restore_tron_alias:
        description: Restore only the verified prior sandbox alias after TRON build 42485543286
        required: false
        type: boolean
        default: false
      teaching_sidecars:
        description: Include pinned GUN and OrbitDB teaching runtimes
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web4-image
  cancel-in-progress: false

jobs:
  image:
    if: ${{ !inputs.restore_tron_alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the parent repository (no submodules; the Dockerfile clones pinned ones)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false

      - name: Verify provider SDK source publication contracts
        run: python3 -B Scripts/validate_all_provider_sdk_publish_manifests.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EXTRA_IMAGE_TAG: ${{ inputs.tag }}
          TEACHING_SIDECARS: ${{ inputs.teaching_sidecars }}
        run: |
          repo="ghcr.io/${REPOSITORY_OWNER,,}/oasis-web4"
          sha="$(git rev-parse HEAD)"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$TEACHING_SIDECARS" in
            true) image_sha="$sha-teaching" ;;
            false|'') image_sha="$sha" ;;
            *) echo "Invalid teaching runtime selection" >&2; exit 1 ;;
          esac
          if [[ -n "$EXTRA_IMAGE_TAG" && ! "$EXTRA_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid extra image tag" >&2
            exit 1
          fi
          {
            echo 'tags<<TAGS'
            echo "$repo:$image_sha"
            if [[ -n "$EXTRA_IMAGE_TAG" && "$EXTRA_IMAGE_TAG" != "$image_sha" ]]; then
              echo "$repo:$EXTRA_IMAGE_TAG"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile.web4
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.tags }}
          build-args: |
            GITHUB_PAT=${{ secrets.PRIVATE_SUBMODULE_PAT }}
            OASIS_INCLUDE_TEACHING_SIDECARS=${{ inputs.teaching_sidecars && 'true' || 'false' }}
          cache-from: |
            type=gha
            type=gha,scope=pouch-native
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_REPOSITORY: ${{ steps.names.outputs.repo }}
          SOURCE_SHA: ${{ steps.names.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Source commit: `%s`\n\nPublished image: `%s@%s`\n' \
            "$SOURCE_SHA" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  restore_tron_alias:
    if: ${{ inputs.restore_tron_alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact previously published alias without downloading images
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B Scripts/TestHosts/restore_tron_image_alias.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tron-image-alias-reconciliation
          path: TestResults/TronImageAlias/*.json
          if-no-files-found: warn
          retention-days: 30
