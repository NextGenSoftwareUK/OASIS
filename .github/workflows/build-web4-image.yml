name: Build WEB4 image
run-name: WEB4 image ${{ inputs.serving_pause_environment || 'current' }} ${{ inputs.ref || github.sha }}

# Builds Docker/Dockerfile.web4 on a GitHub runner and publishes it to GHCR.
# Railway's builder runs out of resources during `dotnet publish` of the ONODE
# WebAPI with no error text, so the sandbox deploys this finished image instead.
# Private dependencies are cloned inside the Dockerfile at the revisions pinned
# in Docker/oasis-dependency-versions.env using PRIVATE_SUBMODULE_PAT; the token
# is a build-stage ARG and never reaches the published final stage.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Override the dispatch revision with a branch, tag or SHA
        required: false
        type: string
      tag:
        description: Extra image tag besides the commit SHA (leave empty for a commit-only build)
        required: false
        type: string
        default: ''
      teaching_sidecars:
        description: Include pinned GUN and OrbitDB teaching runtimes
        required: false
        type: boolean
        default: false
      serving_pause_environment:
        description: Exact older serving-source pause package (current retains normal SDK checks)
        type: choice
        required: false
        default: current
        options: [current, staging, production, staging-maintenance, production-maintenance]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web4-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the workflow's older-source scope verifier
        if: ${{ inputs.serving_pause_environment != '' && inputs.serving_pause_environment != 'current' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Retain the workflow revision's scope verifier
        if: ${{ inputs.serving_pause_environment != '' && inputs.serving_pause_environment != 'current' }}
        run: cp Scripts/TestHosts/validate_worker_pause_backport.py "$RUNNER_TEMP/validate_worker_pause_backport.py"

      - name: Check out the parent repository (no submodules; the Dockerfile clones pinned ones)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Verify provider SDK source publication contracts
        if: ${{ inputs.serving_pause_environment == '' || inputs.serving_pause_environment == 'current' }}
        run: python3 -B Scripts/validate_all_provider_sdk_publish_manifests.py

      # The inspected old serving snapshots predate that SDK checker. This mode
      # accepts only the exact pause plus pinned-fetch transport on one serving parent;
      # it cannot package arbitrary old/new source or suppress a failing check.
      - name: Verify exact older serving-source patch and dependency contract
        if: ${{ inputs.serving_pause_environment != '' && inputs.serving_pause_environment != 'current' }}
        env:
          TARGET_ENVIRONMENT: ${{ inputs.serving_pause_environment }}
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          python3 -B "$RUNNER_TEMP/validate_worker_pause_backport.py" --environment "$TARGET_ENVIRONMENT" --source "$SOURCE_SHA"
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EXTRA_IMAGE_TAG: ${{ inputs.tag }}
          TEACHING_SIDECARS: ${{ inputs.teaching_sidecars }}
        run: |
          repo="ghcr.io/${REPOSITORY_OWNER,,}/oasis-web4"
          sha="$(git rev-parse HEAD)"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$TEACHING_SIDECARS" in
            true) image_sha="$sha-teaching" ;;
            false|'') image_sha="$sha" ;;
            *) echo "Invalid teaching runtime selection" >&2; exit 1 ;;
          esac
          if [[ -n "$EXTRA_IMAGE_TAG" && ! "$EXTRA_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid extra image tag" >&2
            exit 1
          fi
          {
            echo 'tags<<TAGS'
            echo "$repo:$image_sha"
            if [[ -n "$EXTRA_IMAGE_TAG" && "$EXTRA_IMAGE_TAG" != "$image_sha" ]]; then
              echo "$repo:$EXTRA_IMAGE_TAG"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile.web4
          push: true
          provenance: false
          tags: ${{ steps.names.outputs.tags }}
          build-args: |
            GITHUB_PAT=${{ secrets.PRIVATE_SUBMODULE_PAT }}
            OASIS_INCLUDE_TEACHING_SIDECARS=${{ inputs.teaching_sidecars && 'true' || 'false' }}
          cache-from: |
            type=gha
            type=gha,scope=pouch-native
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_REPOSITORY: ${{ steps.names.outputs.repo }}
          SOURCE_SHA: ${{ steps.names.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Source commit: `%s`\n\nPublished image: `%s@%s`\n' \
            "$SOURCE_SHA" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
