name: Publish HoloNET NuGet Packages

# Light, manual HoloNET-only publish (the global release, global-release.yml, also publishes HoloNET, from the commits
# pinned in Docker/oasis-dependency-versions.env, along with everything else). Runs from OASIS because this repo holds
# PRIVATE_SUBMODULE_PAT (for the private HoloNET submodules) and NUGET_API_KEY.
#
# Packs and pushes, in order:
#   1. the NextGenSoftware libraries HoloNET depends on (Logging, Logging.NLog, WebSocket, Utilities, ErrorHandling, CLI.Engine)
#   2. every HoloNET package listed in holochain-client-csharp/packages.json (7 libraries x 4 conductor variants, plus the dotnet new templates)
# Pushes use --skip-duplicate, so versions already on NuGet are left alone.

on:
  workflow_dispatch:
    inputs:
      holonet_ref:
        description: holochain-client-csharp branch, tag or commit to publish
        type: string
        default: main
      libraries_ref:
        description: NextGenSoftware-Libraries branch, tag or commit to build against (and publish)
        type: string
        default: main
      publish_libraries:
        description: Also pack and push the NextGenSoftware libraries
        type: boolean
        default: true
      publish:
        description: Push to NuGet.org (off = build and pack only)
        type: boolean
        default: false
      release_tag:
        description: Also create/update this holochain-client-csharp GitHub release (e.g. v4.4.1) with every package + a zip of each attached (blank = skip; needs publish)
        type: string
        default: ''
      runtime_tag:
        description: Also attach the phone runtime libraries (Android .aar files and dependencies, iOS bridge, checksums) from this android-service-runtime release to the GitHub release (blank = skip; needs release_tag)
        type: string
        default: 'oasis-holochain-0.7-v1.1.0'

jobs:
  publish:
    runs-on: windows-latest
    # id-token: NuGet Trusted Publishing (no long-lived API key). The nuget.org policy must name this workflow file (publish-holonet.yml).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout holochain-client-csharp
        uses: actions/checkout@v4
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ inputs.holonet_ref }}
          path: holochain-client-csharp
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v4
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ inputs.libraries_ref }}
          path: NextGenSoftware-Libraries

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Pack NextGenSoftware libraries
        if: inputs.publish_libraries
        shell: pwsh
        working-directory: NextGenSoftware-Libraries
        run: |
          New-Item -ItemType Directory -Force -Path ..\nupkgs-libraries | Out-Null
          $projects = @(
            "NextGenSoftware.ErrorHandling\NextGenSoftware.ErrorHandling.csproj",
            "NextGenSoftware.Utilities\NextGenSoftware.Utilities.csproj",
            "NextGenSoftware.CLI.Engine\NextGenSoftware.CLI.Engine.csproj",
            "NextGenSoftware.Logging\NextGenSoftware.Logging.csproj",
            "NextGenSoftware.Logging.NLog\NextGenSoftware.Logging.NLog.csproj",
            "NextGenSoftware.WebSocket\NextGenSoftware.WebSocket.csproj"
          )
          $failed = 0
          foreach ($proj in $projects) {
            dotnet pack $proj --configuration Release --output ..\nupkgs-libraries
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "PACK FAILED: $proj" }
          }
          Get-ChildItem ..\nupkgs-libraries\*.nupkg | ForEach-Object { Write-Host $_.Name }
          if ($failed -gt 0) { exit 1 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # HoloNET's packages are listed once, in packages.json (holochain-client-csharp), and built, packed and verified by
      # scripts/holonet_packages.py, so a library or variant can never be left out of a publish. Nothing below names a project.
      - name: Check the HoloNET package manifest
        working-directory: holochain-client-csharp
        run: python scripts/holonet_packages.py check

      - name: Build and pack HoloNET (every library x every variant, plus the dotnet new templates)
        working-directory: holochain-client-csharp
        run: python scripts/holonet_packages.py pack nupkgs

      - name: Verify the packed HoloNET packages
        working-directory: holochain-client-csharp
        run: python scripts/holonet_packages.py verify-packed nupkgs

      - name: Smoke test - install every HoloNET library package into a fresh app and build it
        working-directory: holochain-client-csharp
        run: python scripts/holonet_packages.py smoke nupkgs

      - name: Record immutable standalone publication source graph
        shell: pwsh
        run: |
          $repositories = @()
          foreach ($folder in @('holochain-client-csharp', 'NextGenSoftware-Libraries')) {
            $commit = (& git -C $folder rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve source $folder" }
            $url = (& git -C $folder remote get-url origin).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve repository $folder" }
            $repositories += @{ path=$folder; commit=$commit; url=$url }
          }
          $gitlinks = @(& git -C holochain-client-csharp submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or @($gitlinks | Where-Object { $_ -match '^[+\-U]' }).Count) { throw 'Publication submodule graph is not exact.' }
          $packages = @(Get-ChildItem holochain-client-csharp/nupkgs/*.nupkg | ForEach-Object {
            @{ file=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          })
          @{ schemaVersion=1; kind='standalone'; run=$env:GITHUB_RUN_ID; repositories=$repositories; gitlinks=$gitlinks; packages=$packages } |
            ConvertTo-Json -Depth 8 | Set-Content publication-source-graph.json
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: holonet-nupkgs
          path: |
            publication-source-graph.json
            nupkgs-libraries/*.nupkg
            holochain-client-csharp/nupkgs/*.nupkg

      - name: NuGet trusted publishing login (short-lived key, nothing stored)
        id: nuget_login
        if: inputs.publish
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: dellams

      - name: Push to NuGet.org (libraries first, then HoloNET)
        if: inputs.publish
        shell: pwsh
        env:
          # The trusted-publishing key when the login worked, else the NUGET_API_KEY secret.
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is required.' }
          $pushFailed = 0
          $packages = @()
          if (Test-Path .\nupkgs-libraries) { $packages += Get-ChildItem .\nupkgs-libraries\*.nupkg }
          $packages += Get-ChildItem .\holochain-client-csharp\nupkgs\*.nupkg
          foreach ($package in $packages) {
            Write-Host "Pushing $($package.Name)..."
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $pushFailed++ }
          }
          if ($pushFailed -gt 0) { exit 1 }

      - name: Verify every HoloNET package is on NuGet.org at this version
        if: inputs.publish
        working-directory: holochain-client-csharp
        run: python scripts/holonet_packages.py verify-nuget --wait 30

      - name: GitHub release with every package attached
        if: inputs.publish && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          TAG: ${{ inputs.release_tag }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          $repo = 'holochain-open-dev/holochain-client-csharp'
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $packages = @(Get-ChildItem holochain-client-csharp/nupkgs/*.nupkg)
          if (Test-Path nupkgs-libraries) { $packages += Get-ChildItem nupkgs-libraries/*.nupkg }
          # Every package this run built (the complete set as of this release), not only those versioned like the tag:
          # a release often bumps some packages and not others (e.g. v4.5.1 = API 4.5.1 + Client 4.5.0).
          foreach ($p in $packages) {
            Copy-Item $p.FullName release-assets/
            $dir = Join-Path $env:RUNNER_TEMP $p.BaseName
            Expand-Archive $p.FullName -DestinationPath $dir -Force
            Remove-Item -Recurse -Force (Join-Path $dir '_rels'), (Join-Path $dir 'package'), (Join-Path $dir '*.nuspec') -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $dir '[Content_Types].xml') -Force -ErrorAction SilentlyContinue
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath "release-assets/$($p.BaseName).zip" -Force
          }
          # The phone runtimes the Android and iOS templates use (published from NextGenSoftwareUK/android-service-runtime): attach the app
          # libraries to this release too, so one release has the packages and the runtimes together. The runtime APKs and the Swift conductor stay on
          # the runtime release (they are large and not needed to build a HoloNET app).
          if (-not [string]::IsNullOrWhiteSpace($env:RUNTIME_TAG)) {
            $rtDir = Join-Path $env:RUNNER_TEMP 'runtime-release'
            New-Item -ItemType Directory -Force -Path $rtDir | Out-Null
            gh release download $env:RUNTIME_TAG --repo NextGenSoftwareUK/android-service-runtime --dir $rtDir --clobber `
              -p '*.aar' -p 'holochain-android-dependencies.zip' -p 'HoloNETIosBridge.xcframework.zip' -p 'SHA256SUMS.txt'
            if ($LASTEXITCODE -ne 0) { throw "Cannot download the runtime release $($env:RUNTIME_TAG)" }
            foreach ($f in Get-ChildItem $rtDir -File) {
              $name = if ($f.Name -eq 'SHA256SUMS.txt') { 'runtime-SHA256SUMS.txt' } else { $f.Name }
              Copy-Item $f.FullName (Join-Path release-assets $name)
            }
          }
          # Notes: this version's CHANGELOG section.
          $log = Get-Content holochain-client-csharp/CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## v$([regex]::Escape($version))b.*?(?=^## v)")
          $notes = if ($m.Success) { $m.Value } else { "HoloNET $version" }
          $notes += "`n`nFull history: https://github.com/$repo/blob/main/CHANGELOG.md"
          Set-Content release-notes.md $notes
          gh release view $env:TAG --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C holochain-client-csharp tag $env:TAG 2>$null
            gh release create $env:TAG --repo $repo --target (git -C holochain-client-csharp rev-parse HEAD) --title "HoloNET $version" --notes-file release-notes.md
          }
          gh release upload $env:TAG (Get-ChildItem release-assets/*).FullName --repo $repo --clobber

  # After a real publish, record what was published so the next global release plans cleanly. The global release's
  # source-aware NuGet plan needs a standalone receipt in Scripts/nuget-publication-provenance.json and pins in
  # Docker/oasis-dependency-versions.env (+ the HoloNET-ORM gitlink) that match what was published; without them it
  # refuses ("Component publication requires a reviewed parent dependency-graph receipt"). The receipt is derived from
  # publication-source-graph.json, which this run recorded from the exact commits it built.
  record-receipt:
    needs: publish
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout OASIS master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Download the recorded source graph
        uses: actions/download-artifact@v4
        with:
          name: holonet-nupkgs
          path: published
      - name: Record receipt, dependency pins and the HoloNET-ORM gitlink
        run: |
          set -euo pipefail
          out=$(python3 Scripts/record_standalone_receipt.py published/publication-source-graph.json .)
          echo "$out"
          version=$(echo "$out" | sed -n 's/^version=//p')
          orm=$(echo "$out" | sed -n 's/^orm_commit=//p')
          git update-index --add --cacheinfo 160000,"$orm",HoloNET-ORM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/nuget-publication-provenance.json Docker/oasis-dependency-versions.env
          if git diff --cached --quiet; then echo "Receipt and pins already current."; exit 0; fi
          git commit -m "Record HoloNET $version standalone publication (receipt, dependency pins, HoloNET-ORM gitlink) from run $GITHUB_RUN_ID"
          git push origin HEAD:master
