name: Qualify private Urbit book CQL and current reader

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-urbit-cql.yml'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.UrbitOASIS/UrbitContactBookQuerySource.cs'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.UrbitOASIS/UrbitContactsV1Client.cs'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.UrbitOASIS/NextGenSoftware.OASIS.API.Providers.UrbitOASIS.csproj'
      - 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.UrbitOASIS.UnitTests/UrbitContactBookQueryTests.cs'
      - 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.UrbitOASIS.UnitTests/UrbitContactsV1ClientTests.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbit-private-cql-qualification
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|OASIS_API_CORE_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/OASIS-API-Core
          ref: ${{ steps.dependency.outputs.OASIS_API_CORE_COMMIT }}
          path: OASIS/OASIS Architecture/NextGenSoftware.OASIS.API.Core
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify owner-bound native identity selection and private field projection
        working-directory: OASIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner urbit-private-cql-ci -Operation {
            $project = 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.UrbitOASIS.UnitTests/NextGenSoftware.OASIS.API.Providers.UrbitOASIS.UnitTests.csproj'
            dotnet test $project /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~UrbitContactsV1ClientTests|FullyQualifiedName~UrbitContactBookQueryTests' --results-directory TestResults/UrbitPrivateBookCqlCurrent --logger 'trx;LogFileName=query.trx'
            if ($LASTEXITCODE) { throw 'Urbit private CQL qualification failed' }
            [xml]$report = Get-Content TestResults/UrbitPrivateBookCqlCurrent/query.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.total -ne '62' -or $counts.executed -ne '62' -or $counts.passed -ne '62') { throw 'All 62 reader and private CQL controls must execute and pass' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: urbit-private-book-cql-controls
          path: OASIS/TestResults/UrbitPrivateBookCqlCurrent/
          retention-days: 7
