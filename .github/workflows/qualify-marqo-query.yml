name: Qualify bounded Marqo CQL

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-marqo-query.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.MarqoOASIS/MarqoOASIS.Cql.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.MarqoOASIS.UnitTests/MarqoCqlTests.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.MarqoOASIS.UnitTests/MarqoOASISProviderTests.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marqo-query-qualification
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|OASIS_API_CORE_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/OASIS-API-Core
          ref: ${{ steps.dependency.outputs.OASIS_API_CORE_COMMIT }}
          path: OASIS/OASIS Architecture/NextGenSoftware.OASIS.API.Core
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify explicit Marqo wire and bounded query contract
        working-directory: OASIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner marqo-query-ci -Operation {
            $project = 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.MarqoOASIS.UnitTests/NextGenSoftware.OASIS.API.Providers.MarqoOASIS.UnitTests.csproj'
            dotnet test $project /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~NextGenSoftware.OASIS.API.Providers.MarqoOASIS.UnitTests' --results-directory TestResults/MarqoQueryCurrent --logger 'trx;LogFileName=query.trx'
            if ($LASTEXITCODE) { throw 'Typesense query qualification failed' }
            [xml]$report = Get-Content TestResults/MarqoQueryCurrent/query.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.total -ne '26' -or $counts.executed -ne '26' -or $counts.passed -ne '26') { throw 'All 26 Marqo controls must execute and pass' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: marqo-query-controls
          path: OASIS/TestResults/MarqoQueryCurrent/
          retention-days: 7
