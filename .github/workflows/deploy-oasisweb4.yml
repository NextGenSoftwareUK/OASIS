name: Deploy OASIS Web4 Site

on:
  push:
    branches: [ max-build ]
    paths: [ 'oasisweb4.com/**', '.github/workflows/deploy-oasisweb4.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: oasisweb4.com/package-lock.json

    - name: Build Web4 site
      working-directory: oasisweb4.com
      run: |
        npm ci
        npm run build
        
    - name: Remove large files
      run: |
        find oasisweb4.com/dist -name "*.mp4" -delete
        find oasisweb4.com/dist -name "*.webm" -delete
        find oasisweb4.com/dist -name "*.mov" -delete
        find oasisweb4.com/dist -name "*.avi" -delete
        find oasisweb4.com/dist -name "*.pdf" -size +5M -delete
        
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./oasisweb4.com/dist

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      id: deployment
