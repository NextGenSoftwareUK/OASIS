name: MultiversX native storage

on:
  push:
    branches: [work/hyperdrive-triad]
    paths:
      - '.github/workflows/stellar-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.ElrondOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.ElrondOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run the shared core storage suite against a disposable MultiversX chain simulator and Kubo
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          simulator="" kubo="" blocks=""
          cleanup() {
            status=$?
            if [[ -n "$blocks" ]]; then kill "$blocks" 2>/dev/null || true; fi
            if [[ -n "$simulator" ]]; then (( status != 0 )) && docker logs --tail 40 "$simulator"; docker rm -fv "$simulator" >/dev/null || status=1; fi
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          simulator="$(docker run -d -p 127.0.0.1:18085:8085 docker.io/multiversx/chainsimulator@sha256:5e574583c1d69060244b87ced1daa408c961abe804aa11929fa999e321876f4d)"
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18085/network/config >/dev/null 2>&1 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 120 ]]; sleep 2
          done
          chain="$(curl -fsS http://127.0.0.1:18085/network/config | jq -er '.data.config.erd_chain_id')"
          # The simulator only advances when asked; produce a block every 500 ms while the suite runs.
          ( while true; do curl -fsS -X POST http://127.0.0.1:18085/simulator/generate-blocks/1 >/dev/null 2>&1; sleep 0.5; done ) &
          blocks=$!
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_MULTIVERSX_PROXY="http://127.0.0.1:18085" OASIS_MULTIVERSX_CHAIN_ID="$chain" OASIS_MULTIVERSX_KUBO="http://127.0.0.1:15001"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.ElrondOASIS.IntegrationTests" \
            -p:NativeStorageConformance=true --filter "FullyQualifiedName~ElrondNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "MultiversX passed both storage modes against a chain simulator."
