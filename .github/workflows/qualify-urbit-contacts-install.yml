name: Qualify native current Urbit contacts installation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbit-contacts-native-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: LocalState/COSMIC/CloudUrbitRuntimeAssets/v4.6-408k-2
          key: urbit-linux-complete-${{ hashFiles('Scripts/TestHosts/urbit-runtime-inputs.json') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: LocalState/COSMIC/CloudUrbitContactsDesk
          key: urbit-contacts-desk-${{ hashFiles('Scripts/TestHosts/urbit-contacts-inputs.json', 'Scripts/TestHosts/qualify_urbit_desk.py') }}
          fail-on-cache-miss: true
      - name: Control connection framing checks
        run: python3 -B Scripts/TestHosts/test_urbit_conn.py
      - uses: actions/cache/restore@v4
        with:
          path: LocalState/COSMIC/CloudUrbitKernel408
          key: urbit-kernel408-${{ hashFiles('Scripts/TestHosts/urbit-runtime-inputs.json', 'Scripts/TestHosts/qualify_urbit_kernel.py', 'Scripts/TestHosts/qualify_urbit_desk.py') }}
          fail-on-cache-miss: true
      - name: Native control, source commit and current contacts initialization
        run: python3 -B Scripts/TestHosts/qualify_urbit_contacts_install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: urbit-contacts-install
          path: |
            TestResults/UrbitContactsInstallCurrent/*.json
            TestResults/UrbitContactsInstallCurrent/*.txt
            TestResults/UrbitContactsInstallCurrent/*.log
          retention-days: 7
