name: Neo4j and SQLite native failover

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/neo4j-sqlite-native-failover.yml'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests/Neo4jSqliteOutageTests.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.UnitTests/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.UnitTests.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bolt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
        env:
          NEO4J_AUTH: neo4j/oasis-fixture-only
        ports:
          - 7687/tcp
        options: >-
          --health-cmd "cypher-shell -u neo4j -p oasis-fixture-only 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: pwsh
        run: |
          $entries = @(Get-Content Docker/oasis-dependency-versions.env | Where-Object { $_ -match '^LIBRARIES_COMMIT=' })
          if ($entries.Count -ne 1 -or $entries[0] -notmatch '^LIBRARIES_COMMIT=([a-f0-9]{40})$') {
            throw 'Expected one valid Libraries dependency revision.'
          }
          "libraries=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify SQLite failover to Neo4j over Bolt
        shell: pwsh
        env:
          OASIS_NEO4J_OUTAGE_URI: bolt://127.0.0.1:${{ job.services.neo4j.ports[7687] }}
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('oasis-neo4j-outage-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          try {
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-Neo4jSqliteOutage -Operation {
              $project = 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.UnitTests'
              dotnet test $project --filter 'FullyQualifiedName~Neo4jSqliteOutageTests' --artifacts-path (Join-Path $fixture build) --results-directory $fixture --logger 'trx;LogFileName=outage.trx' /m:2 /nr:false /p:UseSharedCompilation=false /p:IncludeNeo4jNativeOutage=true
              if ($LASTEXITCODE) { throw 'Neo4j outage verification failed.' }
              [xml]$report = Get-Content -LiteralPath (Join-Path $fixture outage.trx)
              $counts = $report.TestRun.ResultSummary.Counters
              if ([int]$counts.total -ne 2 -or [int]$counts.passed -ne 2 -or [int]$counts.notExecuted -ne 0) {
                throw 'Expected both native outage cases to pass with zero skips.'
              }
            }
          } finally {
            $resolved = (Resolve-Path -LiteralPath $fixture).Path
            if ($resolved -ne $fixture -or (Split-Path -Parent $resolved) -ne $env:RUNNER_TEMP) { throw 'Unexpected fixture path.' }
            Remove-Item -LiteralPath $resolved -Recurse -Force
            if (Test-Path -LiteralPath $resolved) { throw 'Fixture cleanup failed.' }
          }
