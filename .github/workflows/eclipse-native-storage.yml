name: Eclipse native storage

on:
  push:
    branches: [work/cloud-hd-eclipse]
    paths:
      - '.github/workflows/eclipse-native-storage.yml'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.EclipseOASIS/**'
      - 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.EclipseOASIS.IntegrationTests/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.SOLANAOASIS/**'
      - 'Providers/Shared/TestSupport/CoreStorageConformance.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run both storage modes on a disposable local SVM ledger
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          ledger="$(mktemp -d "$RUNNER_TEMP/eclipse-ledger.XXXXXXXX")"
          validator_pid=""
          cleanup() {
            status=$?
            if [[ -n "$validator_pid" ]]; then
              kill -TERM "$validator_pid" 2>/dev/null || true
              for _ in {1..20}; do kill -0 "$validator_pid" 2>/dev/null || break; sleep 0.25; done
              if kill -0 "$validator_pid" 2>/dev/null; then kill -KILL "$validator_pid"; fi
              wait "$validator_pid" 2>/dev/null || true
            fi
            if (( status != 0 )) && [[ -f "$ledger/validator.log" ]]; then tail -n 40 "$ledger/validator.log" || true; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            [[ "$ledger" == "$RUNNER_TEMP"/eclipse-ledger.* ]] && rm -rf -- "$ledger"
            exit "$status"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$ledger/agave.tar.bz2"
          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  $ledger/agave.tar.bz2" | sha256sum --check
          tar -xjf "$ledger/agave.tar.bz2" -C "$ledger"
          rm -- "$ledger/agave.tar.bz2"
          bin="$ledger/solana-release/bin"
          "$bin/solana-test-validator" --version | grep -F 'solana-test-validator 4.3.0 (src:825efd18;'
          # One disposable funded signer per mode, so the two runs never share record history.
          "$bin/solana-keygen" new --silent --no-bip39-passphrase --outfile "$ledger/mint.json"
          for mode in async sync; do
            "$bin/solana-keygen" new --silent --no-bip39-passphrase --outfile "$fixture/$mode-signer.json"
          done
          export OASIS_ECLIPSE_RPC_URL=http://127.0.0.1:19899
          "$bin/solana-test-validator" --ledger "$ledger/ledger" --mint "$("$bin/solana-keygen" pubkey "$ledger/mint.json")" \
            --bind-address 127.0.0.1 --rpc-port 19899 --faucet-port 19900 --dynamic-port-range 19901-19927 \
            --rpc-pubsub-worker-threads 1 --rpc-pubsub-notification-threads 1 --quiet >"$ledger/validator.log" 2>&1 &
          validator_pid=$!
          for attempt in {1..90}; do
            kill -0 "$validator_pid" 2>/dev/null || exit 1
            slot="$(curl --silent --max-time 2 -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getSlot","params":[{"commitment":"finalized"}]}' \
              "$OASIS_ECLIPSE_RPC_URL" | jq -r '.result // 0')" || slot=0
            if [[ "$slot" =~ ^[0-9]+$ && "$slot" -gt 0 ]]; then break; fi
            [[ "$attempt" != 90 ]]; sleep 2
          done
          for mode in async sync; do
            "$bin/solana" transfer --url "$OASIS_ECLIPSE_RPC_URL" --keypair "$ledger/mint.json" --allow-unfunded-recipient \
              --commitment finalized "$("$bin/solana-keygen" pubkey "$fixture/$mode-signer.json")" 100 >/dev/null
          done
          genesis="$("$bin/solana" genesis-hash --url "$OASIS_ECLIPSE_RPC_URL")"
          [[ "$genesis" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]]
          export OASIS_ECLIPSE_GENESIS="$genesis" OASIS_NATIVE_STORAGE_FIXTURE="$fixture"
          export OASIS_SOLANA_STORAGE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$OASIS_SOLANA_STORAGE_ENCRYPTION_KEY"
          dotnet test "Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.EclipseOASIS.IntegrationTests" \
            --filter "FullyQualifiedName~EclipseNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -c '{Succeeded, FixtureCleanupComplete, Passed: (.Passed | length)}' "$fixture/$mode.json"
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "EclipseOASIS passed both storage modes against a local SVM ledger."
