name: KeyDB and Dragonfly native storage

on:
  push:
    branches: [work/blockstack-gaia]
    paths:
      - '.github/workflows/redis-compatible-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.KeyDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.DragonflyOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RedisOASIS.IntegrationTests/KeyDBCoreStorageConformanceTests.cs'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RedisOASIS.IntegrationTests/DragonflyCoreStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: KeyDB
            slug: keydb
            port: 19680
            # eqalpha/keydb x86_64_v6.3.4
            image: docker.io/eqalpha/keydb@sha256:eceb1806730c7850395b8262300182c2e15a6e5dacbf0b72cbab110518caf43f
            command: keydb-server --protected-mode no --save '' --appendonly no
            cli: keydb-cli
          - provider: Dragonfly
            slug: dragonfly
            port: 19681
            # dragonflydb/dragonfly v2.1.0
            image: ghcr.io/dragonflydb/dragonfly@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
            command: dragonfly --logtostderr --dbfilename=
            cli: ''
    name: storage (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run both storage modes through the shipping ${{ matrix.provider }} adapter
        env:
          PROVIDER: ${{ matrix.provider }}
          SLUG: ${{ matrix.slug }}
          PORT: ${{ matrix.port }}
          IMAGE: ${{ matrix.image }}
          SERVER: ${{ matrix.command }}
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-$SLUG.XXXXXXXX")"
          container=""
          cleanup() {
            status=$?
            if [[ -n "$container" ]]; then
              if (( status != 0 )); then docker logs --tail 40 "$container" || true; fi
              docker rm -fv "$container" >/dev/null || status=1
            fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-"$SLUG".* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          # shellcheck disable=SC2086
          container="$(docker run -d -p "127.0.0.1:$PORT:6379" "$IMAGE" $SERVER)"
          for attempt in $(seq 1 30); do
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            if (exec 3<>"/dev/tcp/127.0.0.1/$PORT" && printf 'PING\r\n' >&3 && timeout 2 head -n 1 <&3 | grep -q PONG); then break; fi
            [[ "$attempt" != 30 ]]
            sleep 1
          done
          size="$(exec 3<>"/dev/tcp/127.0.0.1/$PORT"; printf 'DBSIZE\r\n' >&3; timeout 2 head -n 1 <&3 | tr -d '\r\n:')"
          [[ "$size" == 0 ]] || { echo "The $PROVIDER fixture is not empty ($size keys)."; exit 1; }
          upper="$(echo "$SLUG" | tr '[:lower:]' '[:upper:]')"
          export "OASIS_${upper}_CI_FIXTURE=$fixture"
          export "OASIS_${upper}_STORAGE_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RedisOASIS.IntegrationTests" \
            -p:IncludeCoreStorageConformance=true --filter "FullyQualifiedName~${PROVIDER}CoreStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          size="$(exec 3<>"/dev/tcp/127.0.0.1/$PORT"; printf 'DBSIZE\r\n' >&3; timeout 2 head -n 1 <&3 | tr -d '\r\n:')"
          [[ "$size" == 0 ]] || { echo "$PROVIDER kept $size keys after cleanup."; exit 1; }
          echo "Both $PROVIDER storage modes passed 26/26 with exact cleanup."
