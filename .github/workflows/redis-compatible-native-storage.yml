name: Redis-compatible native storage

on:
  push:
    branches: [work/blockstack-gaia]
    paths:
      - '.github/workflows/redis-compatible-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.KeyDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.DragonflyOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.GarnetOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RedisOASIS.IntegrationTests/*CoreStorageConformanceTests.cs'
  workflow_dispatch:
    inputs:
      provider:
        description: Select only the provider whose native gate needs qualification
        type: choice
        options: [Both, KeyDB, Dragonfly, Garnet]
        default: Both

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.provider == 'Garnet' && '["Garnet"]' || inputs.provider == 'KeyDB' && '["KeyDB"]' || inputs.provider == 'Dragonfly' && '["Dragonfly"]' || '["KeyDB","Dragonfly"]') }}
    name: storage (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded sibling revisions
        id: dependencies
        run: |
          set -euo pipefail
          for key in LIBRARIES_COMMIT HOLOCHAIN_COMMIT; do
            revision="$(sed -n "s/^$key=//p" Docker/oasis-dependency-versions.env)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
            echo "$key=$revision" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run only the selected shipping provider against its real server
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            KeyDB)
              slug=keydb; port=19680
              image=docker.io/eqalpha/keydb@sha256:eceb1806730c7850395b8262300182c2e15a6e5dacbf0b72cbab110518caf43f
              server=(keydb-server --protected-mode no --save '' --appendonly no)
              ;;
            Dragonfly)
              slug=dragonfly; port=19681
              image=ghcr.io/dragonflydb/dragonfly@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
              server=(dragonfly --logtostderr --dbfilename=)
              ;;
            Garnet)
              slug=garnet; port=19682
              # Official Microsoft release v2.2.5, linux/amd64 manifest.
              image=ghcr.io/microsoft/garnet@sha256:87e22ffa38533c207c5210ed2c11c39ed34f5b84981837a752ac2b4ec813a674
              # Shared Redis conditional writes require atomic Lua comparisons.
              server=(--lua --lua-transaction-mode --memory 256m --index 16m)
              ;;
            *) echo 'Unrecognized native provider selection.' >&2; exit 1 ;;
          esac
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-$slug.XXXXXXXX")"
          owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$slug"
          printf '%s' "$owner" > "$fixture/.owned-native-run"
          container=""
          cleanup() {
            status=$?
            if [[ -n "$container" ]]; then
              actual="$(docker inspect --format '{{ index .Config.Labels "oasis.native.owner" }}' "$container")" || status=1
              if [[ "${actual:-}" == "$owner" ]]; then
                if (( status != 0 )); then docker logs --tail 40 "$container" || true; fi
                docker rm --force --volumes "$container" >/dev/null || status=1
                if docker inspect "$container" >/dev/null 2>&1; then status=1; fi
              else
                echo 'Owned native container label mismatch; refusing deletion.' >&2
                status=1
              fi
            fi
            if [[ "$(dirname "$(realpath "$fixture")")" == "$(realpath "$RUNNER_TEMP")" &&
                  "$(basename "$fixture")" == oasis-"$slug".* && ! -L "$fixture" &&
                  "$(cat "$fixture/.owned-native-run")" == "$owner" ]]; then
              rm -rf -- "$fixture" || status=1
              [[ ! -e "$fixture" ]] || status=1
            else
              echo 'Owned native fixture path/marker mismatch; refusing deletion.' >&2
              status=1
            fi
            echo "Owned $PROVIDER container, volumes and fixture cleanup exit=$status."
            exit "$status"
          }
          trap cleanup EXIT
          container="$(docker run --detach --memory 1g --ulimit memlock=-1 \
            --label "oasis.native.owner=$owner" --publish "127.0.0.1:$port:6379" "$image" "${server[@]}")"
          for attempt in $(seq 1 45); do
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            if (exec 3<>"/dev/tcp/127.0.0.1/$port" && printf '*1\r\n$4\r\nPING\r\n' >&3 &&
                timeout 2 head -n 1 <&3 | grep -q PONG); then break; fi
            [[ "$attempt" != 45 ]]
            sleep 1
          done
          size="$(exec 3<>"/dev/tcp/127.0.0.1/$port"; printf '*1\r\n$6\r\nDBSIZE\r\n' >&3; timeout 2 head -n 1 <&3 | tr -d '\r\n:')"
          [[ "$size" == 0 ]] || { echo "Owned $PROVIDER native store is not empty."; exit 1; }
          task_upper="$(printf '%s' "$slug" | tr '[:lower:]' '[:upper:]')"
          export "OASIS_${task_upper}_CI_FIXTURE=$fixture"
          task_storage_key="$(openssl rand -base64 32)"
          echo "::add-mask::$task_storage_key"
          export "OASIS_${task_upper}_STORAGE_ENCRYPTION_KEY=$task_storage_key"
          export OASIS_NATIVE_REPORT_DIRECTORY="$fixture"
          pwsh -NoProfile -Command '
            & ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-RedisCompatibleNative -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RedisOASIS.IntegrationTests" -p:IncludeCoreStorageConformance=true --filter "FullyQualifiedName~$($env:PROVIDER)CoreStorageConformanceTests" -m:2 -nr:false -p:UseSharedCompilation=false --logger "trx;LogFileName=native.trx" --results-directory $env:OASIS_NATIVE_REPORT_DIRECTORY
              if ($LASTEXITCODE) { throw "Selected native storage suite failed." }
              [xml]$report=Get-Content -LiteralPath (Join-Path $env:OASIS_NATIVE_REPORT_DIRECTORY "native.trx") -Raw
              $counts=$report.SelectSingleNode(("//*[local-name()=" + [char]34 + "Counters" + [char]34 + "]"))
              if (!$counts -or $counts.total -ne "2" -or $counts.passed -ne "2" -or $counts.notExecuted -ne "0") {
                throw "Expected two executed, passing native modes without skips."
              }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          size="$(exec 3<>"/dev/tcp/127.0.0.1/$port"; printf '*1\r\n$6\r\nDBSIZE\r\n' >&3; timeout 2 head -n 1 <&3 | tr -d '\r\n:')"
          [[ "$size" == 0 ]] || { echo "Owned $PROVIDER retained native keys after cleanup."; exit 1; }
          echo "Native proof: provider=$PROVIDER sync=26 async=26 skipped=0 DBSIZE=0."
