name: Qualify reviewed WEB4 source in a real hosted browser
on:
  workflow_dispatch:
    inputs:
      website_source:
        description: Exact reviewed Web4Site source SHA
        required: true
        type: string
      api_source:
        description: API source bound by the operator's pre/post Railway observations
        required: true
        type: string
      live_read:
        description: One paced public HoloOASIS SQL read with a temporary demo session
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cql-hosted-browser-qualification
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            Scripts/Sandbox
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NextGenSoftwareUK/Web4Site
          ref: ${{ inputs.website_source || '7c002846b2e95654b5c2261f6c13a703acc6c9d2' }}
          path: Web4Site
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Check existing CI runtime and reviewed source
        shell: bash
        working-directory: OASIS
        env:
          WEBSITE_SOURCE: ${{ inputs.website_source || '7c002846b2e95654b5c2261f6c13a703acc6c9d2' }}
          API_SOURCE: ${{ inputs.api_source || 'f29262d8b6df380e0d267228d92508e4da393561' }}
        run: |
          set -euo pipefail
          [[ "$WEBSITE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C ../Web4Site rev-parse HEAD)" == "$WEBSITE_SOURCE" ]]
          node -e 'if(Number(process.versions.node.split(".")[0])<22||typeof WebSocket!=="function")throw Error("Existing Node runtime lacks native WebSocket")'
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          echo "CQL_BROWSER_CHROME=$chrome" >> "$GITHUB_ENV"
          node --check Scripts/Sandbox/Verify-CqlProtectedPreviewBrowser.cjs
      - name: Exercise actual reviewed page and bounded public data flow
        working-directory: OASIS
        env:
          CQL_BROWSER_SITE_ROOT: ${{ github.workspace }}/Web4Site
          CQL_BROWSER_WEBSITE_SOURCE: ${{ inputs.website_source || '7c002846b2e95654b5c2261f6c13a703acc6c9d2' }}
          CQL_BROWSER_API_SOURCE: ${{ inputs.api_source || 'f29262d8b6df380e0d267228d92508e4da393561' }}
          CQL_BROWSER_LIVE_FLOW: ${{ inputs.live_read && '1' || '0' }}
          CQL_BROWSER_REPORT_DIRECTORY: ${{ github.workspace }}/OASIS/TestResults/CqlHostedBrowser
        run: node Scripts/Sandbox/Verify-CqlProtectedPreviewBrowser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-hosted-browser
          path: OASIS/TestResults/CqlHostedBrowser
          if-no-files-found: ignore
          retention-days: 2
