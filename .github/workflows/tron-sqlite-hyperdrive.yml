name: TRON and SQLite HyperDrive routing

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/tron-sqlite-hyperdrive.yml'
      - '.github/workflows/tron-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.TRONOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.TRONOASIS.IntegrationTests/TronNativeStorageLifecycleTests.Routing.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    uses: ./.github/workflows/tron-native-storage.yml
    with:
      routing: true
    secrets:
      PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}

