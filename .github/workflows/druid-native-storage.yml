name: Druid native storage

on:
  push:
    branches: [work/hyperdrive-triad]
    paths:
      - '.github/workflows/stellar-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.DruidOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.DruidOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run the shared core storage suite against a disposable single-machine Apache Druid 39.0.0
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          druid_root="$(mktemp -d "$RUNNER_TEMP/druid.XXXXXXXX")"
          druid_pid=""
          cleanup() {
            status=$?
            if [[ -n "$druid_pid" ]]; then kill "$druid_pid" 2>/dev/null || true; wait "$druid_pid" 2>/dev/null || true; fi
            if (( status != 0 )); then tail -n 60 "$druid_root/start.log" || true; for log in "$druid_root"/apache-druid-39.0.0/log/*.log; do echo "== $log"; tail -n 30 "$log"; done 2>/dev/null || true; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            [[ "$druid_root" == "$RUNNER_TEMP"/druid.* ]] && rm -rf -- "$druid_root"
            exit "$status"
          }
          trap cleanup EXIT
          curl -fsSL -o "$druid_root/druid.tar.gz" https://downloads.apache.org/druid/39.0.0/apache-druid-39.0.0-bin.tar.gz
          echo "5daf253da1fa1a5a1d6ccb43d352a02dce33d2bf1e014f9f738b65e3419a9c4b292c26c6983c107a51cd6e1c386d0f80e363b244ab2b3515d237fc9b25e64269  $druid_root/druid.tar.gz" | sha512sum -c -
          tar -xzf "$druid_root/druid.tar.gz" -C "$druid_root"
          rm -f -- "$druid_root/druid.tar.gz"
          home="$druid_root/apache-druid-39.0.0"
          # Publish-to-queryable latency is governed by the coordinator and segment-metadata polling periods.
          for setting in druid.coordinator.period=PT2S druid.manager.segments.pollDuration=PT2S druid.coordinator.startDelay=PT2S; do
            echo "$setting" >> "$home/conf/druid/auto/coordinator-overlord/runtime.properties"
          done
          (cd "$home" && exec bin/start-druid -m 8g) > "$druid_root/start.log" 2>&1 &
          druid_pid=$!
          for attempt in $(seq 1 300); do
            if curl -fsS -X POST -H 'Content-Type: application/json' -d '{"query":"SELECT 1"}' http://127.0.0.1:8888/druid/v2/sql >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8888/druid/indexer/v1/workers | jq -e 'length > 0' >/dev/null 2>&1; then break; fi
            kill -0 "$druid_pid" 2>/dev/null || { echo "start-druid exited"; exit 1; }
            [[ "$attempt" != 300 ]]; sleep 2
          done
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture"
          dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.DruidOASIS.IntegrationTests" -p:NativeStorageConformance=true \
            --filter "FullyQualifiedName~DruidNativeStorageConformanceTests" -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Druid passed both storage modes against a single-machine Druid."
