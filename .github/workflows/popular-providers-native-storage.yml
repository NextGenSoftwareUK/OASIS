name: Popular providers native storage

on:
  push:
    branches: [work/hyperdrive-triad, 'work/cloud-hd-**']
    paths:
      - '.github/workflows/popular-providers-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.CouchDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.CouchbaseOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.ArangoDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.SurrealDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.ClickHouseOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.InfluxDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.ChromaOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.PgVectorOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.ArcadeDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.QuestDBOASIS/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.PouchDBOASIS/**'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.NATSJetStreamOASIS/**'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.DaprOASIS/**'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.GUNOASIS/**'
      - 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.GUNOASIS.IntegrationTests/**'
      - 'Providers/Social/NextGenSoftware.OASIS.API.Providers.MatrixOASIS/**'
      - 'Providers/Social/TestProjects/NextGenSoftware.OASIS.API.Providers.MatrixOASIS.IntegrationTests/**'
      - 'Providers/Other/NextGenSoftware.OASIS.API.Providers.OrbitDBOASIS/**'
      - 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.OrbitDBOASIS.IntegrationTests/**'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.ArweaveOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.ArweaveOASIS.IntegrationTests/**'
      - 'Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.DaprOASIS.IntegrationTests/**'
      - 'Providers/Social/NextGenSoftware.OASIS.API.Providers.NostrOASIS/**'
      - 'Providers/*/TestProjects/*/*NativeStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [CouchDB, Couchbase, ArangoDB, SurrealDB, ClickHouse, InfluxDB, Chroma, PgVector, ArcadeDB, QuestDB, PouchDB, NATSJetStream, Nostr, Dapr, GUN, Matrix, OrbitDB, Arweave]
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run the shared core storage suite against the real backend
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          password="$(openssl rand -hex 16)"
          container=""
          relays=""
          cleanup() {
            status=$?
            for pid in $relays; do kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; done
            if [[ -n "$container" ]]; then
              for c in $container; do
                if (( status != 0 )); then docker logs --tail 40 "$c" || true; fi
                docker rm -fv "$c" >/dev/null || status=1
              done
            fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          wait_for() { for attempt in $(seq 1 90); do if eval "$1" >/dev/null 2>&1; then return 0; fi; sleep 2; done; echo "Backend never became ready"; return 1; }
          case "$PROVIDER" in
            CouchDB)
              container="$(docker run -d -p 127.0.0.1:15984:5984 -e COUCHDB_USER=admin -e COUCHDB_PASSWORD="$password" apache/couchdb:3.5.1)"
              wait_for "curl -fsS -u admin:$password http://127.0.0.1:15984/_up"
              for db in _users _replicator; do curl -fsS -u "admin:$password" -X PUT "http://127.0.0.1:15984/$db" || true; done ;;
            ArangoDB)
              container="$(docker run -d -p 127.0.0.1:18529:8529 -e ARANGO_ROOT_PASSWORD="$password" arangodb:3.12)"
              wait_for "curl -fsS -u root:$password http://127.0.0.1:18529/_api/version" ;;
            SurrealDB)
              container="$(docker run -d -p 127.0.0.1:18000:8000 surrealdb/surrealdb:v2 start --user root --pass "$password" memory)"
              wait_for "curl -fsS http://127.0.0.1:18000/health" ;;
            ClickHouse)
              container="$(docker run -d -p 127.0.0.1:18123:8123 -e CLICKHOUSE_PASSWORD="$password" --ulimit nofile=262144:262144 clickhouse/clickhouse-server:25.8)"
              wait_for "curl -fsS 'http://127.0.0.1:18123/?query=SELECT%201' -u default:$password" ;;
            InfluxDB)
              container="$(docker run -d -p 127.0.0.1:18086:8086 -e DOCKER_INFLUXDB_INIT_MODE=setup -e DOCKER_INFLUXDB_INIT_USERNAME=oasis \
                -e DOCKER_INFLUXDB_INIT_PASSWORD="$password" -e DOCKER_INFLUXDB_INIT_ORG=oasis -e DOCKER_INFLUXDB_INIT_BUCKET=oasis_async \
                -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN="$password" influxdb:2.7)"
              wait_for "curl -fsS -H 'Authorization: Token $password' 'http://127.0.0.1:18086/api/v2/buckets?name=oasis_async' | grep -q oasis_async"
              org_id="$(curl -fsS -H "Authorization: Token $password" 'http://127.0.0.1:18086/api/v2/orgs?org=oasis' | jq -r '.orgs[0].id')"
              curl -fsS -X POST -H "Authorization: Token $password" -H 'Content-Type: application/json' \
                -d "{\"orgID\":\"$org_id\",\"name\":\"oasis_sync\",\"retentionRules\":[]}" http://127.0.0.1:18086/api/v2/buckets >/dev/null ;;
            Chroma)
              container="$(docker run -d -p 127.0.0.1:18001:8000 docker.io/chromadb/chroma@sha256:abcce7c335e2dab9f11ef629296f7309b09cb19ae4b34da32ac7e34ff5773140)"
              wait_for "curl -fsS http://127.0.0.1:18001/api/v2/heartbeat"
              # The provider never creates collections; provision the COSMIC document schema explicitly.
              for name in oasis_avatars oasis_avatar_details oasis_holons; do
                curl -fsS -X POST -H 'Content-Type: application/json'                   -d "{\"name\":\"$name\",\"get_or_create\":false,\"metadata\":{\"cosmic_storage_schema\":\"chroma-doc-v1\",\"cosmic_embedding_dimension\":1}}"                   http://127.0.0.1:18001/api/v2/tenants/default_tenant/databases/default_database/collections >/dev/null
              done ;;
            PgVector)
              container="$(docker run -d -p 127.0.0.1:15433:5432 -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=oasis pgvector/pgvector:pg17)"
              wait_for "docker exec $container pg_isready -U postgres -d oasis"
              sleep 3
              docker exec "$container" psql -U postgres -d oasis -c 'CREATE EXTENSION IF NOT EXISTS vector;' ;;
            ArcadeDB)
              container="$(docker run -d -p 127.0.0.1:12480:2480 -e JAVA_OPTS="-Darcadedb.server.rootPassword=$password" arcadedata/arcadedb:25.10.1)"
              wait_for "curl -fsS -u root:$password http://127.0.0.1:12480/api/v1/server" ;;
            QuestDB)
              container="$(docker run -d -p 127.0.0.1:18812:8812 -p 127.0.0.1:19000:9000 docker.io/questdb/questdb@sha256:6f733a142ee7ca8623d65135b46ed6cf78aac1e9ab15d1493ad7df837721e2e4)"
              wait_for "curl -fsS 'http://127.0.0.1:19000/exec?query=SELECT%201'"
              # The provider only verifies its schema; provision the exact DAY/WAL/DEDUP tables explicitly.
              for table in oasis_avatars oasis_avatar_details oasis_holons; do
                curl -fsS -G 'http://127.0.0.1:19000/exec'                   --data-urlencode "query=CREATE TABLE $table (id SYMBOL,data VARCHAR,ts TIMESTAMP) TIMESTAMP(ts) PARTITION BY DAY WAL DEDUP UPSERT KEYS(ts,id);"                   | jq -e '.ddl == "OK"' >/dev/null
              done ;;
            PouchDB)
              container="$(docker run -d -p 127.0.0.1:15985:5984 -e COUCHDB_USER=admin -e COUCHDB_PASSWORD="$password" apache/couchdb:3.5.1)"
              wait_for "curl -fsS -u admin:$password http://127.0.0.1:15985/_up"
              for db in _users _replicator; do curl -fsS -u "admin:$password" -X PUT "http://127.0.0.1:15985/$db" || true; done ;;
            NATSJetStream)
              container="$(docker run -d -p 127.0.0.1:14222:4222 -p 127.0.0.1:18222:8222 nats:2.11.8 -js -m 8222)"
              wait_for "curl -fsS http://127.0.0.1:18222/healthz?js-enabled-only=true" ;;
            Nostr)
              container="$(docker run -d -p 127.0.0.1:17777:8080 scsibug/nostr-rs-relay:0.9.0)"
              wait_for "curl -fsS -H 'Accept: application/nostr+json' http://127.0.0.1:17777/"
              export OASIS_NOSTR_SECRET="$(openssl rand -hex 32)" ;;
            Dapr)
              # Redis state store behind a real daprd sidecar; one component per storage mode (redisDB 0/1).
              container="$(docker run -d --network host redis:7.4 redis-server --port 16379 --bind 127.0.0.1)"
              wait_for "docker exec $container redis-cli -p 16379 ping"
              components="$PWD/Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.DaprOASIS.IntegrationTests/components"
              sidecar="$(docker run -d --network host -e DAPR_API_TOKEN="$password" -v "$components:/components:ro" daprio/daprd:1.16.2 \
                ./daprd --app-id oasis-native --resources-path /components --dapr-grpc-port 15001 --dapr-http-port 13500 --metrics-port 19090)"
              container="$container $sidecar"
              wait_for "curl -fsS -H 'dapr-api-token: $password' http://127.0.0.1:13500/v1.0/healthz" ;;
            GUN)
              # Two disposable loopback relays (one per storage mode) with radisk persistence in the fixture directory.
              relay_dir="$PWD/Providers/Other/TestProjects/NextGenSoftware.OASIS.API.Providers.GUNOASIS.IntegrationTests/relay"
              npm ci --prefix "$relay_dir" --no-audit --no-fund
              node "$relay_dir/relay.cjs" 18766 "$fixture/radisk-async" & relays="$relays $!"
              node "$relay_dir/relay.cjs" 18767 "$fixture/radisk-sync" & relays="$relays $!"
              wait_for "curl -fsS -o /dev/null http://127.0.0.1:18766/gun.js && curl -fsS -o /dev/null http://127.0.0.1:18767/gun.js"
              export OASIS_GUN_ASYNC_RELAY=http://127.0.0.1:18766 OASIS_GUN_SYNC_RELAY=http://127.0.0.1:18767 ;;
            Matrix)
              # Disposable Synapse homeserver: loopback listener, no federation, message rate limits lifted for the fixture.
              synapse_image=matrixdotorg/synapse:v1.138.0
              mkdir "$fixture/synapse"
              docker run --rm -v "$fixture/synapse:/data" -e SYNAPSE_SERVER_NAME=oasis.test -e SYNAPSE_REPORT_STATS=no "$synapse_image" generate
              sudo python3 - "$fixture/synapse/homeserver.yaml" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          text = text.replace("  - port: 8008\n", "  - port: 8008\n    bind_addresses: ['127.0.0.1']\n", 1)
          text = text.replace('trusted_key_servers:\n  - server_name: "matrix.org"\n', "trusted_key_servers: []\n")
          text = text.rstrip("\n") + "\nrc_message:\n  per_second: 1000\n  burst_count: 1000\n"
          open(path, "w").write(text)
          PY
              container="$(docker run -d --network host -v "$fixture/synapse:/data" "$synapse_image")"
              wait_for "curl -fsS http://127.0.0.1:8008/health"
              docker exec "$container" register_new_matrix_user -c /data/homeserver.yaml -u oasis -p "$password" --no-admin http://127.0.0.1:8008
              token="$(curl -fsS -X POST http://127.0.0.1:8008/_matrix/client/v3/login \
                -d "{\"type\":\"m.login.password\",\"identifier\":{\"type\":\"m.id.user\",\"user\":\"oasis\"},\"password\":\"$password\"}" | jq -er .access_token)"
              room() { curl -fsS -X POST -H "Authorization: Bearer $token" http://127.0.0.1:8008/_matrix/client/v3/createRoom -d '{"preset":"private_chat"}' | jq -er .room_id; }
              export OASIS_MATRIX_HOMESERVER=http://127.0.0.1:8008 OASIS_MATRIX_USER=oasis \
                OASIS_MATRIX_ASYNC_ROOM="$(room)" OASIS_MATRIX_SYNC_ROOM="$(room)" ;;
            OrbitDB)
              # Two disposable OrbitDB storage services (one database per mode); state lives in the fixture directory.
              service_dir="$PWD/Providers/Other/NextGenSoftware.OASIS.API.Providers.OrbitDBOASIS/StorageService"
              npm ci --prefix "$service_dir" --no-audit --no-fund
              export OASIS_ORBITDB_STORAGE_TOKEN="$password"
              node "$service_dir/storage-service.mjs" "$fixture/orbitdb-async" 18901 >"$fixture/orbitdb-async.log" 2>&1 & relays="$relays $!"
              node "$service_dir/storage-service.mjs" "$fixture/orbitdb-sync" 18902 >"$fixture/orbitdb-sync.log" 2>&1 & relays="$relays $!"
              wait_for "grep -q ready '$fixture/orbitdb-async.log' && grep -q ready '$fixture/orbitdb-sync.log'"
              export OASIS_ORBITDB_ASYNC_SERVICE=http://127.0.0.1:18901 OASIS_ORBITDB_SYNC_SERVICE=http://127.0.0.1:18902 ;;
            Arweave)
              # Disposable arlocal gateway (pinned) and one freshly minted wallet per storage mode.
              tests_dir="$PWD/Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.ArweaveOASIS.IntegrationTests"
              bridge="$PWD/Providers/Storage/NextGenSoftware.OASIS.API.Providers.ArweaveOASIS/SdkBridge/bridge.mjs"
              npm ci --prefix "$(dirname "$bridge")" --no-audit --no-fund
              npm ci --prefix "$tests_dir/arlocal" --no-audit --no-fund
              (cd "$tests_dir/arlocal" && exec npx --no-install arlocal 1984) >"$fixture/arlocal.log" 2>&1 & relays="$relays $!"
              wait_for "curl -fsS http://127.0.0.1:1984/info"
              gateway=http://127.0.0.1:1984
              for mode in async sync; do
                echo "{\"operation\":\"generateWallet\",\"gateway\":\"$gateway\"}" | node "$bridge" >"$fixture/$mode-wallet.out"
                jq -ec .wallet "$fixture/$mode-wallet.out" >"$fixture/$mode-wallet.json"
                curl -fsS "$gateway/mint/$(jq -er .address "$fixture/$mode-wallet.out")/1000000000000000" >/dev/null
                rm -- "$fixture/$mode-wallet.out"
              done
              curl -fsS "$gateway/mine" >/dev/null
              export OASIS_ARWEAVE_GATEWAY="$gateway" OASIS_ARWEAVE_SDK_BRIDGE="$bridge" \
                OASIS_ARWEAVE_ASYNC_WALLET_FILE="$fixture/async-wallet.json" OASIS_ARWEAVE_SYNC_WALLET_FILE="$fixture/sync-wallet.json" ;;
            Couchbase)
              container="$(docker run -d -p 127.0.0.1:8091-8097:8091-8097 -p 127.0.0.1:11210:11210 -p 127.0.0.1:11280:11280 couchbase/server:community-7.6.2)"
              wait_for "curl -fsS http://127.0.0.1:8091/ui/index.html"
              docker exec "$container" couchbase-cli cluster-init -c 127.0.0.1 --cluster-username Administrator --cluster-password "$password" \
                --services data,index,query --cluster-ramsize 1024 --cluster-index-ramsize 256 --index-storage-setting default
              docker exec "$container" couchbase-cli bucket-create -c 127.0.0.1 -u Administrator -p "$password" --bucket oasis \
                --bucket-type couchbase --bucket-ramsize 512 --wait
              wait_for "curl -fsS -u Administrator:$password http://127.0.0.1:8093/query/service -d 'statement=SELECT 1'" ;;
          esac
          project="$(ls -d Providers/*/TestProjects/NextGenSoftware.OASIS.API.Providers.${PROVIDER}OASIS.IntegrationTests | head -1)"
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_NATIVE_PASSWORD="$password"
          dotnet test "$project" -p:NativeStorageConformance=true --filter "FullyQualifiedName~${PROVIDER}NativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          if [[ "$PROVIDER" == OrbitDB ]]; then
            auth="Authorization: Bearer $password"
            curl -fsS -X PUT -H "$auth" "http://127.0.0.1:18901/kv?key=durability/probe" --data-binary kept >/dev/null
            for pid in $relays; do kill -TERM "$pid"; wait "$pid" || true; done
            relays=""
            node "$service_dir/storage-service.mjs" "$fixture/orbitdb-async" 18901 >"$fixture/orbitdb-restart.log" 2>&1 & relays="$!"
            wait_for "grep -q ready '$fixture/orbitdb-restart.log'"
            [[ "$(curl -fsS -H "$auth" "http://127.0.0.1:18901/kv?key=durability/probe")" == kept ]]
            echo "OrbitDB data survived a storage service restart."
          fi
          echo "$PROVIDER passed both storage modes against its real backend."
