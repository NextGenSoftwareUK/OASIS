name: Garnet native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/garnet-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.GarnetOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.GarnetOASIS.IntegrationTests/GarnetOASISIntegrationTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries and Holochain revisions
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
          revision="$(sed -n 's/^HOLOCHAIN_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "holochain=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run both storage modes through the shipping Garnet adapter
        shell: bash
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-garnet.XXXXXXXX")"
          server=""
          cleanup() {
            status=$?
            if [[ -n "$server" ]]; then
              if kill -0 "$server" 2>/dev/null; then kill "$server"; fi
              wait "$server" || true
            fi
            if (( status != 0 )) && [[ -f "$fixture/server.log" ]]; then tail -n 25 "$fixture/server.log"; fi
            for mode in async sync; do
              checkpoint="$fixture/reports/$mode/report.json"
              if [[ -f "$checkpoint" ]]; then
                jq -c --arg mode "$mode" '{mode:$mode,case:.CurrentCase,checks:(.Passed | length),cleanup:.FixtureCleanupComplete,contract:.FailureContract}' "$checkpoint" || status=1
              fi
            done
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-garnet.* ]] && rm -rf -- "$fixture"
            if [[ -e "$fixture" ]]; then status=1; else echo "Removed the owned Garnet runtime, data and reports."; fi
            exit "$status"
          }
          trap cleanup EXIT
          curl -fsSL https://github.com/microsoft/garnet/releases/download/v2.2.5/linux-x64-based.tar.xz -o "$fixture/garnet.tar.xz"
          (cd "$fixture"; echo 'f397cf0da94697ebd2fa17e7d3bc448fa5d62578f2c9693698a104a88d91c626  garnet.tar.xz' | sha256sum -c)
          tar -xJf "$fixture/garnet.tar.xz" -C "$fixture"
          "$fixture/net10.0/GarnetServer" --version | grep -F '2.2.5'
          mkdir "$fixture/data"
          (cd "$fixture/data"; exec "$fixture/net10.0/GarnetServer" --bind 127.0.0.1 --port 19692 \
            --memory 128m --checkpointdir "$fixture/data/checkpoints") >"$fixture/server.log" 2>&1 &
          server=$!
          query() {
            python3 -c 'import socket,sys
          with socket.create_connection(("127.0.0.1", 19692), 3) as client:
              client.sendall((sys.argv[1] + "\r\n").encode("ascii"))
              with client.makefile("rb") as response:
                  print(response.readline().decode("ascii").strip())' "$1"
          }
          for attempt in {1..30}; do
            kill -0 "$server"
            if [[ "$(query PING 2>/dev/null)" == '+PONG' ]]; then break; fi
            [[ "$attempt" != 30 ]]
            sleep 1
          done
          [[ "$(query DBSIZE)" == ':0' ]]
          export OASIS_GARNET_LIFECYCLE_REPORT_ROOT="$fixture/reports"
          export GARNET_CONN=127.0.0.1:19692,abortConnect=true,connectRetry=0
          export OASIS_GARNET_STORAGE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-GarnetStorage -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.GarnetOASIS.IntegrationTests" --filter "FullyQualifiedName~SharedStorageLifecycle" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Garnet native storage verification failed." }
            }'
          for mode in async sync; do
            checkpoint="$fixture/reports/$mode/report.json"
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$checkpoint" >/dev/null
          done
          [[ "$(query DBSIZE)" == ':0' ]]
          echo "Verified zero native keys after exact fixture cleanup."
