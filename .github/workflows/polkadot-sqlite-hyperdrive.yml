name: Polkadot and SQLite HyperDrive routing

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/polkadot-sqlite-hyperdrive.yml'
      - '.github/workflows/polkadot-native-storage.yml'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS.IntegrationTests/PolkadotSqliteHyperDriveTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    uses: ./.github/workflows/polkadot-native-storage.yml
    with:
      routing: true
    secrets:
      PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
