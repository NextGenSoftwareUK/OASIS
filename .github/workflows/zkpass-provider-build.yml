name: zkPass provider build

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/zkpass-provider-build.yml'
      - 'Providers/Identity/TestProjects/zkPassOASIS.LiveVerification/**'
      - 'Providers/Identity/NextGenSoftware.OASIS.API.Providers.zkPassOASIS/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify the shipping zkPass provider against a public attestation
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-zkPass -Operation {
            $project = 'Providers/Identity/TestProjects/zkPassOASIS.LiveVerification/zkPassOASIS.LiveVerification.csproj'
            dotnet build $project /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw 'zkPass provider build failed.' }
            dotnet run --project $project --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { throw 'zkPass public attestation verification failed.' }
          }
