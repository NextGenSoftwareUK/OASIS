name: Qualify bounded Sandbox contract metadata CQL

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-sandbox-contract.yml'
      - 'Docker/oasis-dependency-versions.env'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core'
      - 'Providers/Maps/NextGenSoftware.OASIS.API.Providers.TheSandboxOASIS/**'
      - 'Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.TheSandboxOASIS.UnitTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Validate exact dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compile and verify controlled contract invariants
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner sandbox-contract-ci -Operation {
            dotnet test Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.TheSandboxOASIS.UnitTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'TestCategory!=SandboxContractNative&TestCategory!=Live' --results-directory TestResults/SandboxContractCurrent --logger 'trx;LogFileName=controlled.trx'
            if ($LASTEXITCODE) { throw 'Controlled Sandbox contract metadata qualification failed' }
            [xml]$report = Get-Content TestResults/SandboxContractCurrent/controlled.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '26' -or $counts.total -ne '26' -or $counts.executed -ne '26') {
              throw 'All twenty-six controlled cases must execute and pass without skips'
            }
          }
      - name: Verify actual current contract CQL reads
        working-directory: OASIS
        shell: pwsh
        env:
          COSMIC_SANDBOX_VERIFY_PUBLIC: '1'
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner sandbox-contract-native-ci -Operation {
            dotnet test Providers/Maps/TestProjects/NextGenSoftware.OASIS.API.Providers.TheSandboxOASIS.UnitTests --no-build --no-restore /m:2 /nr:false /p:UseSharedCompilation=false --filter 'TestCategory=SandboxContractNative' --results-directory TestResults/SandboxContractCurrent --logger 'trx;LogFileName=native.trx'
            if ($LASTEXITCODE) { throw 'Actual Sandbox contract metadata CQL qualification failed' }
            [xml]$report = Get-Content TestResults/SandboxContractCurrent/native.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '1' -or $counts.total -ne '1' -or $counts.executed -ne '1') {
              throw 'The native contract CQL case must execute and pass without skips'
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sandbox-contract-cql
          path: OASIS/TestResults/SandboxContractCurrent/*.trx
          if-no-files-found: error
          retention-days: 30
