name: Qualify bounded Holonym current attestation CQL

on:
  push:
    branches: [work/cosmic-cql-ton-public, work/cosmic-teaching-release-candidate]
    paths:
      - '.github/workflows/qualify-holonym-attestation.yml'
      - 'Docker/oasis-dependency-versions.env'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core'
      - 'Providers/Identity/NextGenSoftware.OASIS.API.Providers.HolonymOASIS/**'
      - 'Providers/Identity/TestProjects/NextGenSoftware.OASIS.API.Providers.HolonymOASIS.UnitTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Validate exact dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compile and verify controlled attestation invariants
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner holonym-attestation-ci -Operation {
            dotnet test Providers/Identity/TestProjects/NextGenSoftware.OASIS.API.Providers.HolonymOASIS.UnitTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'TestCategory!=HolonymAttestationNative&TestCategory!=Live' --results-directory TestResults/HolonymAttestationCurrent --logger 'trx;LogFileName=controlled.trx'
            if ($LASTEXITCODE) { throw 'Controlled Holonym current attestation qualification failed' }
            [xml]$report = Get-Content TestResults/HolonymAttestationCurrent/controlled.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '25' -or $counts.total -ne '25' -or $counts.executed -ne '25') {
              throw 'All twenty-five controlled cases must execute and pass without skips'
            }
          }
      - name: Verify actual current attestation CQL reads
        working-directory: OASIS
        shell: pwsh
        env:
          COSMIC_HOLONYM_VERIFY_PUBLIC: '1'
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner holonym-attestation-native-ci -Operation {
            dotnet test Providers/Identity/TestProjects/NextGenSoftware.OASIS.API.Providers.HolonymOASIS.UnitTests --no-build --no-restore /m:2 /nr:false /p:UseSharedCompilation=false --filter 'TestCategory=HolonymAttestationNative' --results-directory TestResults/HolonymAttestationCurrent --logger 'trx;LogFileName=native.trx'
            if ($LASTEXITCODE) { throw 'Actual Holonym current attestation CQL qualification failed' }
            [xml]$report = Get-Content TestResults/HolonymAttestationCurrent/native.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '1' -or $counts.total -ne '1' -or $counts.executed -ne '1') {
              throw 'The native attestation CQL case must execute and pass without skips'
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: holonym-attestation-cql
          path: OASIS/TestResults/HolonymAttestationCurrent/*.trx
          if-no-files-found: error
          retention-days: 30
