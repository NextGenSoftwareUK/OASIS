name: Qualify native WEB5 OAPP search startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-web5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate exact dependency pins
        run: python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
      - name: Build the shipping WEB5 publish stage
        env:
          GITHUB_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          set -euo pipefail
          tag="oasis-web5-search:$GITHUB_SHA"
          trap 'docker image rm "$tag" >/dev/null 2>&1 || true' EXIT
          docker build --file Docker/Dockerfile.web5 --target build --build-arg GITHUB_PAT --tag "$tag" .
          docker run --rm --entrypoint sh "$tag" -c 'test -s /app/publish/NextGenSoftware.OASIS.STAR.WebAPI.dll'
