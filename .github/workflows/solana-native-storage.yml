name: Solana native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/solana-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.SOLANAOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.SOLANAOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run both storage modes on an isolated Agave ledger
        shell: bash
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-agave.XXXXXXXX")"
          validator_pid=""
          cleanup() {
            if [[ -n "$validator_pid" ]]; then
              kill -INT "$validator_pid" 2>/dev/null || true
              wait "$validator_pid" || true
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-agave.* && -d "$fixture" ]]; then
              rm -rf -- "$fixture"
              test ! -e "$fixture"
              echo "Removed the owned Agave fixture directory."
            fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location \
            https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$fixture/agave.tar.bz2"
          echo "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8  $fixture/agave.tar.bz2" | sha256sum --check
          tar -xjf "$fixture/agave.tar.bz2" -C "$fixture"
          rm -- "$fixture/agave.tar.bz2"
          bin="$fixture/solana-release/bin"
          "$bin/solana-test-validator" --version | grep -F 'solana-test-validator 4.3.0 (src:825efd18;'
          export OASIS_SOLANA_FRESH_KEYPAIR="$fixture/keypair.json"
          "$bin/solana-keygen" new --silent --no-bip39-passphrase --outfile "$OASIS_SOLANA_FRESH_KEYPAIR"
          mint="$("$bin/solana-keygen" pubkey "$OASIS_SOLANA_FRESH_KEYPAIR")"
          export SOLANA_RPC_URL=http://127.0.0.1:18899
          "$bin/solana-test-validator" --ledger "$fixture/ledger" --mint "$mint" \
            --bind-address 127.0.0.1 --rpc-port 18899 --faucet-port 18900 --dynamic-port-range 18901-18927 \
            --rpc-pubsub-worker-threads 1 --rpc-pubsub-notification-threads 1 --quiet >"$fixture/validator.log" 2>&1 &
          validator_pid=$!
          for attempt in {1..90}; do
            if ! kill -0 "$validator_pid" 2>/dev/null; then tail -40 "$fixture/validator.log"; exit 1; fi
            slot="$(curl --silent --max-time 2 -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getSlot","params":[{"commitment":"finalized"}]}' \
              "$SOLANA_RPC_URL" | jq -r '.result // 0')" || slot=0
            if [[ "$slot" =~ ^[0-9]+$ && "$slot" -gt 0 ]]; then break; fi
            if [[ "$attempt" == 90 ]]; then tail -40 "$fixture/validator.log"; exit 1; fi
            sleep 2
          done
          export OASIS_SOLANA_FRESH_GENESIS="$("$bin/solana" genesis-hash --url "$SOLANA_RPC_URL")"
          [[ "$OASIS_SOLANA_FRESH_GENESIS" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]]
          export OASIS_SOLANA_FRESH_CONFORMANCE=1
          export OASIS_SOLANA_STORAGE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$OASIS_SOLANA_STORAGE_ENCRYPTION_KEY"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-SolanaStorage -Operation {
              dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.SOLANAOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.SOLANAOASIS.IntegrationTests.csproj" --filter "TestCategory=SolanaCoreStorageConformance" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native Solana storage verification failed." }
            }'
          for mode in async sync; do
            report="TestResults/SolanaFreshConformance/SOLANAOASIS/$mode/report.json"
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$report" >/dev/null
            echo "$mode: 26 native checks and logical fixture cleanup passed."
          done
