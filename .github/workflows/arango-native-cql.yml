name: ArangoDB native CQL restart and federation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: libraries
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' OASIS/Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.libraries.outputs.revision }}
          path: NextGenSoftware-Libraries
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run native CQL before and after ArangoDB restart
        working-directory: OASIS
        shell: bash
        run: |
          state=/var/tmp/oasis-arangodb-cql
          mongo_state=/var/tmp/oasis-cosmic-mongo
          mkdir -m 700 "$state" "$mongo_state"
          mongo=
          container=
          cleanup() {
            local failed=0
            if [[ -n "$mongo" ]]; then
              docker rm -f -v "$mongo" >/dev/null || failed=1
            fi
            if [[ -n "$container" ]]; then
              docker rm -f -v "$container" >/dev/null || failed=1
            fi
            return "$failed"
          }
          trap cleanup EXIT
          export COSMIC_ARANGODB_ROOT="$state"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          (umask 077; jq -n --arg password "$password" '{username:"root",password:$password}' > "$state/credentials.json")
          export ARANGO_ROOT_PASSWORD="$password"
          container="$(docker create --env ARANGO_ROOT_PASSWORD --publish 127.0.0.1:18529:8529 docker.io/library/arangodb@sha256:ddaeda57726a6ff42186a3fea205a848585c92fd54814b892193925338f9e25c)"
          for phase in first restart; do
            docker start "$container" >/dev/null
            for attempt in {1..30}; do
              test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
              status=0
              response="$(curl --fail --silent --show-error --max-time 2 --user "root:$password" http://127.0.0.1:18529/_api/version)" || status=$?
              case "$status" in
                0) jq -e '.version == "3.12.12"' <<< "$response"; break ;;
                7|28|52|56) test "$attempt" -lt 30; sleep 1 ;;
                *) exit "$status" ;;
              esac
            done
            dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.ArangoDBOASIS.IntegrationTests \
              --filter 'FullyQualifiedName~ArangoDbNativeCqlTests' --results-directory "$state" \
              --logger "trx;LogFileName=$phase.trx" /m:2 /nr:false /p:UseSharedCompilation=false
            python3 - "$state/$phase.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          counters = ET.parse(sys.argv[1]).find(".//{*}Counters").attrib
          if counters["total"] != "1" or counters["passed"] != "1":
              raise SystemExit("Expected one passing native ArangoDB test")
          PY
            test -f "$state/native-baseline.json"
            test ! -e "$state/seed.pending.json"
            if [[ "$phase" == restart ]]; then
              mongo="$(docker create --publish 127.0.0.1:27039:27039 mongo:8.0.15 --port 27039 --replSet cosmicLinuxDemoRs --bind_ip_all)"
              docker start "$mongo" >/dev/null
              for attempt in {1..30}; do
                test "$(docker inspect --format '{{.State.Running}}' "$mongo")" = true
                if docker exec "$mongo" mongosh --quiet --port 27039 --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'; then
                  break
                fi
                test "$attempt" -lt 30
                sleep 1
              done
              jq -n --arg id "$container" '{containerId:$id}' > "$state/environment.json"
              jq -n --arg id "$mongo" '{containerId:$id,port:27039,replica:"cosmicLinuxDemoRs"}' > "$mongo_state/store.json"
              export OASIS_COSMIC_LINUX_MONGO_STATE="$mongo_state"
              export OASIS_MONGO_REPLICA_SET_CONNECTION='mongodb://127.0.0.1:27039/?replicaSet=cosmicLinuxDemoRs&serverSelectionTimeoutMS=3000'
              for test_class in LinuxMongoDemoEnvironmentTests ArangoDBMongoCqlNativeTests ArangoDbNativeCqlTests; do
                dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.ArangoDBOASIS.IntegrationTests \
                  --no-build --filter "FullyQualifiedName~$test_class" --results-directory "$state" \
                  --logger "trx;LogFileName=$test_class.trx" /m:2 /nr:false /p:UseSharedCompilation=false
                python3 - "$state/$test_class.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          counters = ET.parse(sys.argv[1]).find(".//{*}Counters").attrib
          if counters["total"] != "1" or counters["passed"] != "1":
              raise SystemExit("Expected one passing fixture test")
          PY
              done
              test -f "$mongo_state/replica-init.json"
              test ! -e "$mongo_state/replica-init.pending.json"
              test ! -e "$state/mongo.pending.json"
            fi
            docker stop --time 20 "$container" >/dev/null
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          done
