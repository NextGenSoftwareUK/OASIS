name: Qualify HoloOASIS Edge replay on a native conductor

on:
  push:
    tags: ['ci-hyperdrive-holo-edge-replay-*']

permissions:
  contents: read

jobs:
  conductor:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          fetch-depth: 3
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Resolve and validate exact pins
        id: dependency
        working-directory: OASIS
        shell: bash
        run: |
          set -euo pipefail
          python -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check out the pinned prior hApp fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 201691ce590871ff41cae625e68043a23deb0471
          path: OASIS-prior-happ
          sparse-checkout: Providers/Network/NextGenSoftware.OASIS.API.Providers.HoloOASIS/OASIS_hAPP/oasis.happ
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare the prior app and the tested replacement coordinator
        working-directory: OASIS
        shell: bash
        run: |
          set -euo pipefail
          export HOLO_EDGE_FIXTURES="$RUNNER_TEMP/oasis-holo-edge-fixtures"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os
          import re
          import zlib

          package = 'Providers/Network/NextGenSoftware.OASIS.API.Providers.HoloOASIS/OASIS_hAPP/oasis.happ'
          old = (Path('..') / 'OASIS-prior-happ' / package).read_bytes()
          if sha256(old).hexdigest() != 'eb6e48a7448c074c64635189f664c5842a86006f569074a05d42ef27ff0eb988':
              raise SystemExit('Prior hApp hash mismatch')
          h_app = zlib.decompress(Path(package).read_bytes(), 31)
          candidates = []
          for marker in re.finditer(b'\x1f\x8b\x08', h_app):
              try:
                  dna = zlib.decompress(h_app[marker.start():], 31)
              except zlib.error:
                  continue
              for module in re.finditer(b'\xc6....\x00asm\x01\x00\x00\x00', dna, re.DOTALL):
                  start = module.start()
                  size = int.from_bytes(dna[start + 1:start + 5], 'big')
                  wasm = dna[start + 5:start + 5 + size]
                  if sha256(wasm).hexdigest() == '7840644f943207edf829bdf60a4091b14eba4e2642fbe55b13f059e65175ea0d':
                      candidates.append(wasm)
          if len(candidates) != 1:
              raise SystemExit('Expected one source-matched coordinator WASM')
          fixture = Path(os.environ['HOLO_EDGE_FIXTURES'])
          fixture.mkdir()
          (fixture / 'prior.oasis.happ').write_bytes(old)
          (fixture / 'oasis.wasm').write_bytes(candidates[0])
          PY
      - name: Verify the bound bundle and run the native Edge test
        working-directory: OASIS
        shell: pwsh
        run: |
          $package = 'Providers/Network/NextGenSoftware.OASIS.API.Providers.HoloOASIS/OASIS_hAPP'
          $manifest = Get-Content -LiteralPath "$package/build-manifest.json" -Raw | ConvertFrom-Json
          $happ = "$package/oasis.happ"
          if ($manifest.schemaVersion -ne 1 -or $manifest.sourceCommit -cne '921dd0e76690bdbfa8ac094813268d14969eb1ff' -or
              (Get-FileHash -LiteralPath $happ -Algorithm SHA256).Hash -ine $manifest.artifactSha256) {
            throw 'The candidate hApp does not match the replay fix and its checked-in manifest.'
          }
          Write-Output "Candidate $env:GITHUB_SHA, hApp source $($manifest.sourceCommit), hApp SHA-256 $($manifest.artifactSha256)"
          $results = Join-Path $env:RUNNER_TEMP 'oasis-holo-edge-replay'
          New-Item -ItemType Directory -Path $results | Out-Null
          $fixtures = Join-Path $env:RUNNER_TEMP 'oasis-holo-edge-fixtures'
          $env:OASIS_HOLO_EDGE_PRIOR_HAPP = Join-Path $fixtures 'prior.oasis.happ'
          $env:OASIS_HOLO_EDGE_COORDINATOR_WASM = Join-Path $fixtures 'oasis.wasm'
          if (!(Test-Path -LiteralPath $env:OASIS_HOLO_EDGE_PRIOR_HAPP -PathType Leaf) -or
              !(Test-Path -LiteralPath $env:OASIS_HOLO_EDGE_COORDINATOR_WASM -PathType Leaf)) {
            throw 'In-place coordinator update fixtures are missing.'
          }
          $client = '../holochain-client-csharp/NextGenSoftware.Holochain.HoloNET.Client.Tests/NextGenSoftware.Holochain.HoloNET.Client.Tests.csproj'
          $tests = 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.HoloOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.HoloOASIS.IntegrationTests.csproj'
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-HoloEdgeReplay -Operation {
            & Scripts/test_holonet_live_release.ps1 -Project $client -Happ $happ -ResultsDirectory $results -DesktopProject $tests -HoloEdgeReplication
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holo-edge-replay-report
          path: ${{ runner.temp }}/oasis-holo-edge-replay/*.trx
          if-no-files-found: ignore
          retention-days: 2
