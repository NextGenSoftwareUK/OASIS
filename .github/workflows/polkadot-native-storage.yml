name: Polkadot native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - 'Scripts/TestHosts/Build-ReusablePolkadotRecords.sh'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS.IntegrationTests/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      activation_only:
        type: boolean
        default: false
    secrets:
      PRIVATE_SUBMODULE_PAT:
        required: true

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
          revision="$(sed -n 's/^HOLOCHAIN_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "holochain=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        if: inputs.activation_only
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build and validate the shipping records contract
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'false'
        run: |
          tools="$(mktemp -d "$RUNNER_TEMP/oasis-polkadot.XXXXXXXX")"
          cleanup() {
            if [[ "$tools" == "$RUNNER_TEMP"/oasis-polkadot.* && -d "$tools" ]]; then
              rm -rf -- "$tools"
              test ! -e "$tools"
              echo "Removed the owned Binaryen fixture."
            fi
          }
          trap cleanup EXIT
          install_binaryen() {
            local version="$1" checksum="$2"
            local filename="binaryen-version_${version}-x86_64-linux.tar.gz"
            curl --fail --silent --show-error --location --max-time 120 \
              "https://github.com/WebAssembly/binaryen/releases/download/version_$version/$filename" \
              --output "$tools/$filename"
            echo "$checksum  $tools/$filename" | sha256sum --check
            tar -xzf "$tools/$filename" -C "$tools"
            rm -- "$tools/$filename"
          }
          install_binaryen 120 ddb097af51d1bdb17300d986b0de7d97422f1933dedb4c9eda3510e0bf4076cc
          install_binaryen 124 0290c3779fedf592b8da0ded3032ff55c41a2b7bfa2d6bf7b7bac6f0e6e28963
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
          export PATH="$tools/binaryen-version_120/bin:$PATH"
          export OASIS_POLKADOT_WASM_LOWERER="$tools/binaryen-version_124/bin/wasm-opt"
          bash Scripts/TestHosts/Build-ReusablePolkadotRecords.sh records
          sdk=Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS/SdkBridge
          npm ci --prefix "$sdk" --no-audit --no-fund
          node "$sdk/verify-record-contract-artifact.mjs" records

      - name: Deploy the records contract and run native storage conformance
        shell: bash
        env:
          POLKADOT_ACTIVATION_ONLY: ${{ inputs.activation_only || false }}
        run: |
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-polkadot-chain.XXXXXXXX")"
          pid=""
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 && -f "$fixture/node.log" ]]; then tail -60 "$fixture/node.log"; fi
            if [[ -n "$pid" ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              for attempt in {1..20}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.25
              done
              if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid"; fi
              wait "$pid" || true
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-polkadot-chain.* && -d "$fixture" ]]; then
              rm -rf -- "$fixture"
              test ! -e "$fixture"
              echo "Removed the owned Substrate fixture."
            fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/paritytech/substrate-contracts-node/releases/download/v0.42.0/substrate-contracts-node-linux.tar.gz \
            --output "$fixture/node.tar.gz"
          echo "a631b4e83dd05e4beaccbd770be709ac41914183d443116c2e4d244161590265  $fixture/node.tar.gz" | sha256sum --check
          tar -xzf "$fixture/node.tar.gz" -C "$fixture"
          rm -- "$fixture/node.tar.gz"
          binary="$(find "$fixture" -type f -name substrate-contracts-node -print -quit)"
          [[ -n "$binary" ]]
          echo "b5e30ad4bcf37ab0a875f88c690460cf68a0847c03e74045d15bb16513892991  $binary" | sha256sum --check
          chmod u+x "$binary"
          "$binary" build-spec --chain dev --raw --disable-default-bootnode |
            jq -e 'select(.id == "dev" and .chainType == "Development") |
              .properties={tokenDecimals:12,tokenSymbol:"UNIT",ss58Format:42} |
              .relay_chain="rococo-local" | .para_id=1000' >"$fixture/chain-spec.json"
          openssl rand -out "$fixture/node-key" 32
          "$binary" --chain "$fixture/chain-spec.json" --alice --force-authoring --base-path "$fixture/ledger" \
            --node-key-file "$fixture/node-key" \
            --rpc-port 19944 --listen-addr /ip4/127.0.0.1/tcp/19945 --no-prometheus --no-telemetry \
            --no-mdns --out-peers 0 --in-peers 0 --offchain-worker never --state-pruning archive \
            --blocks-pruning archive --database rocksdb --name oasis-ci-polkadot >"$fixture/node.log" 2>&1 &
          pid=$!
          for attempt in {1..45}; do
            kill -0 "$pid" 2>/dev/null
            if response="$(curl --fail --silent --max-time 2 -H 'Content-Type: application/json' \
               --data '{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[0]}' http://127.0.0.1:19944)" &&
               [[ -n "$response" ]] &&
               jq -e '.result == "0xe8cf5d7d636a08721efaa17acc52ed3d895fe2468dccb2520cc8e249ddb6b208"' <<< "$response" >/dev/null; then break; fi
            if [[ "$attempt" == 45 ]]; then exit 1; fi
            sleep 1
          done
          sdk="$PWD/Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS/SdkBridge"
          export OASIS_POLKADOT_LOCAL_NATIVE=1 OASIS_POLKADOT_FRESH_STORAGE=1 OASIS_POLKADOT_STORAGE_CONFORMANCE=1
          export OASIS_POLKADOT_SDK_BRIDGE="$sdk/bridge.mjs"
          export OASIS_POLKADOT_RECORD_EVIDENCE="$PWD/TestResults/PolkadotFreshStorage"
          export OASIS_POLKADOT_LOCAL_BOOTSTRAP_JOURNAL="$PWD/TestResults/PolkadotCurrent/fresh-storage-funding.json"
          mkdir "$OASIS_POLKADOT_RECORD_EVIDENCE"
          (cd "$sdk" && node bootstrap-local-native.mjs && node bootstrap-local-record-owner.mjs)
          if [[ "$POLKADOT_ACTIVATION_ONLY" == true ]]; then
            export OASIS_POLKADOT_CI_FIXTURE="$fixture"
            export OASIS_POLKADOT_STORAGE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
            echo "::add-mask::$OASIS_POLKADOT_STORAGE_ENCRYPTION_KEY"
            pwsh -NoProfile -File Scripts/TestHosts/Invoke-PolkadotBootLoaderActivation.ps1
            exit 0
          fi
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-PolkadotStorage -Operation {
              dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.PolkadotOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstPolkadot" /p:PolkadotDirectProviderOnly=true /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native Polkadot storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' \
              "$OASIS_POLKADOT_RECORD_EVIDENCE/core-storage-$mode.report.json" >/dev/null
            echo "$mode: 26 native checks, finalized original receipts and empty storage verified."
          done
