name: Qualify native session range registration

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests/CqlV1Web4NativeTests.SessionRanges.cs"
      - ".github/workflows/qualify-cql-session-range-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    services:
      neo4j:
        image: neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
        env:
          NEO4J_AUTH: neo4j/oasis-local-test-only
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p oasis-local-test-only 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start one owned loopback Mongo replica
        working-directory: OASIS
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cql-where-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify only native range registration and explicit save
        working-directory: OASIS
        shell: pwsh
        run: |
          $env:OASIS_CQL_MONGO_ENTITY_PROJECTION_ROOT=(Get-Location).Path
          New-Item -ItemType Directory TestResults/Neo4jCurrent | Out-Null
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-session-range-native-ci -Operation {
            dotnet test "OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests" /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CosmicSessionEntryTests|FullyQualifiedName~CosmicSessionRegistrationTests' --results-directory TestResults/SessionRange --logger 'trx;LogFileName=entry.trx'
            if ($LASTEXITCODE) { throw 'Session range contract failed' }
            [xml]$contract=Get-Content TestResults/SessionRange/entry.trx
            if ($contract.TestRun.ResultSummary.Counters.passed -ne '5' -or $contract.TestRun.ResultSummary.Counters.total -ne '5') { throw 'All five shared session checks must pass' }
            dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~SessionRangesSaveAndAttachThroughNativeAuthority' --results-directory TestResults/Neo4jCurrent --logger 'trx;LogFileName=mapping-native.trx'
            if ($LASTEXITCODE) { throw 'Native session range qualification failed' }
            [xml]$report=Get-Content TestResults/Neo4jCurrent/mapping-native.trx
            if ($report.TestRun.ResultSummary.Counters.passed -ne '3' -or $report.TestRun.ResultSummary.Counters.total -ne '3') { throw 'All three range journeys must pass' }
            foreach ($store in 'MongoDBOASIS','SQLLiteDBOASIS','Neo4jOASIS') {
              $e=Get-Content "TestResults/Neo4jCurrent/$store-session-range-native.json" -Raw | ConvertFrom-Json
              if ($e.provider -ne $store -or $e.checks -ne 4 -or $e.ownedCleanupIds -ne 2 -or $e.successfulHolonWrites -ne 6 -or @($e.queryElapsedMilliseconds.PSObject.Properties).Count -ne 4) { throw 'Incomplete native report' }
              foreach ($name in 'nativeProviderVerified','registrationDoesNotWriteVerified','explicitOwnedSaveVerified','attachBaselineAndUpdateVerified','foreignPrivateReadExcludedVerified','explicitUpdateRangeVerified','hardRemoveRangeVerified','exactCleanupVerified') {
                if ($e.$name -ne $true) { throw "Missing native proof $name" }
              }
            }
          }
      - name: Stop owned Mongo
        if: always()
        run: docker rm -f -v cql-where-mongo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-session-range-native
          path: |
            OASIS/TestResults/SessionRange/entry.trx
            OASIS/TestResults/Neo4jCurrent/mapping-native.trx
            OASIS/TestResults/Neo4jCurrent/*-session-range-native.json
          if-no-files-found: ignore
          retention-days: 2
