name: Aztec native storage

on:
  push:
    branches: [work/aztec-native-storage]
    paths:
      - '.github/workflows/aztec-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AztecOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AztecOASIS.IntegrationTests/AztecNativeStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

env:
  # aztecprotocol/aztec:5.3.0 (linux/amd64). The SDK worker pins the same release in its package-lock.
  AZTEC_IMAGE: aztecprotocol/aztec@sha256:fc81f2d449753d89d1c9e47ebafe8b7e662ed498028466338a9da5e39ecd4871
  PROVIDER: Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AztecOASIS
  TESTS: Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AztecOASIS.IntegrationTests

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile the OasisKv contract and check it against the shipped artifact
        run: |
          set -euo pipefail
          docker pull -q "$AZTEC_IMAGE"
          work="$(mktemp -d "$RUNNER_TEMP/oasis-kv.XXXXXXXX")"
          cp -r "$PROVIDER/contracts/oasis_kv/." "$work/"
          docker run --rm -v "$work:/work" -w /work -e NARGO=/usr/src/noir/noir-repo/target/release/nargo "$AZTEC_IMAGE" compile
          compiled="$work/target/oasis_kv-OasisKv.json"
          sudo chown -R "$(id -u):$(id -g)" "$work"
          test -s "$compiled"
          shipped="$PROVIDER/contracts/oasis_kv/artifact/OasisKv.json"
          # Compare what deploys (class bytecode and ABI), not build metadata such as file paths or timestamps.
          normalise() { jq -S '{name, functions: [.functions[] | {name, bytecode, abi, is_unconstrained, custom_attributes}] | sort_by(.name), outputs: .outputs.structs}' "$1"; }
          if [[ -f "$shipped" ]]; then
            diff <(normalise "$shipped") <(normalise "$compiled") >/dev/null || { echo "The shipped OasisKv artifact does not match its source; recompile and commit it." >&2; exit 1; }
          else
            mkdir -p "$(dirname "$shipped")"; cp "$compiled" "$shipped"
            echo "::warning::No shipped OasisKv artifact yet; using the fresh compile (uploaded as a workflow artifact)."
          fi
          mkdir -p "$RUNNER_TEMP/oasis-kv-artifact"; cp "$compiled" "$RUNNER_TEMP/oasis-kv-artifact/OasisKv.json"
      - uses: actions/upload-artifact@v4
        with:
          name: OasisKv-artifact
          path: ${{ runner.temp }}/oasis-kv-artifact/OasisKv.json
          retention-days: 7
      - name: Build the provider tests and provision the pinned SDK worker
        run: |
          set -euo pipefail
          dotnet build "$TESTS" -p:NativeStorageConformance=true -m:2 -nr:false -p:UseSharedCompilation=false
          bridge="$(find "$TESTS/bin" -type d -name AztecSdkBridge | head -1)"
          test -f "$bridge/worker.mjs" && test -f "$bridge/OasisKv.json"
          (cd "$bridge" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "BRIDGE=$PWD/$bridge" >> "$GITHUB_ENV"
      - name: Run the shared core storage suite against a disposable Aztec local network and Kubo
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          network="oasis-aztec-$RANDOM$RANDOM"
          anvil="" aztec="" kubo=""
          cleanup() {
            status=$?
            if [[ -n "$aztec" ]]; then (( status != 0 )) && docker logs --tail 80 "$aztec"; docker rm -fv "$aztec" >/dev/null || status=1; fi
            if [[ -n "$anvil" ]]; then docker rm -fv "$anvil" >/dev/null || status=1; fi
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            docker network rm "$network" >/dev/null 2>&1 || true
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            exit "$status"
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          anvil="$(docker run -d --network "$network" --network-alias l1 --entrypoint anvil "$AZTEC_IMAGE" \
            --silent -p 8545 --host 0.0.0.0 --chain-id 31337)"
          aztec="$(docker run -d --network "$network" -p 127.0.0.1:18080:8080 \
            -e ETHEREUM_HOSTS=http://l1:8545 -e L1_CHAIN_ID=31337 -e LOG_LEVEL=info \
            "$AZTEC_IMAGE" start --local-network)"
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          rpc() { curl -fsS -X POST -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":[]}" http://127.0.0.1:18080; }
          for attempt in $(seq 1 120); do
            if rpc node_getBlockNumber >/dev/null 2>&1 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$(docker inspect -f '{{.State.Running}}' "$aztec")" == true ]] || { echo "The Aztec local network exited during startup" >&2; exit 1; }
            [[ "$attempt" != 120 ]]; sleep 5
          done
          rpc node_getNodeInfo | jq -c '.result | {nodeVersion, l1ChainId}'

          # The network's first pre-funded test account (public, well-known test keys) owns the storage contract.
          account="$(cd "$BRIDGE" && node test-account.mjs)"
          secret="$(jq -r .secret <<<"$account")"; salt="$(jq -r .salt <<<"$account")"; signing="$(jq -r .signingKey <<<"$account")"
          init="$(jq -cn --arg s "$secret" --arg a "$salt" --arg k "$signing" '{id:1,operation:"init",nodeUrl:"http://127.0.0.1:18080",secret:$s,salt:$a,signingKey:$k}')"
          replies="$(printf '%s\n%s\n' "$init" '{"id":2,"operation":"deploy"}' | (cd "$BRIDGE" && LOG_LEVEL=warn node worker.mjs) | sed -n 's/^@@OASIS-AZTEC@@//p')"
          jq -e -s 'length == 2 and all(.ok)' <<<"$replies" >/dev/null || { echo "$replies" | jq -c '{id, ok, error}' >&2; exit 1; }
          contract="$(jq -r -s '.[1].result.address' <<<"$replies")"
          echo "OasisKv deployed at $contract"

          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_AZTEC_NODE_URL="http://127.0.0.1:18080" \
            OASIS_AZTEC_STORAGE_CONTRACT="$contract" OASIS_AZTEC_STORAGE_SECRET="$secret" OASIS_AZTEC_STORAGE_SALT="$salt" \
            OASIS_AZTEC_STORAGE_SIGNING_KEY="$signing" OASIS_AZTEC_KUBO="http://127.0.0.1:15001" \
            OASIS_AZTEC_STORAGE_KEY="$(openssl rand -base64 32)"
          dotnet test "$TESTS" --no-build -p:NativeStorageConformance=true \
            --filter "FullyQualifiedName~AztecNativeStorageConformanceTests" --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Aztec passed both storage modes against a local network."
