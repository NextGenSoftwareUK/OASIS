name: RavenDB native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/raven-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run native storage conformance against RavenDB
        shell: bash
        run: |
          image=docker.io/ravendb/ravendb@sha256:92bd726e9d0031f48c8203c9be660c9f9b361ff11b6b352a17ca4a861e366471
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-raven.XXXXXXXX")"
          container=""
          image_owned=false
          cleanup() {
            status=$?
            cleanup_status=0
            if [[ -n "$container" ]]; then
              if (( status != 0 )); then docker logs --tail 35 "$container" || true; fi
              docker rm -fv "$container" || cleanup_status=1
            fi
            if [[ "$image_owned" == true ]] && docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || cleanup_status=1
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-raven.* ]]; then rm -rf -- "$fixture"; fi
            [[ ! -e "$fixture" ]] || cleanup_status=1
            if (( cleanup_status == 0 )); then echo "Removed the owned RavenDB container, volumes and fixture."; else status=1; fi
            exit "$status"
          }
          trap cleanup EXIT
          if ! docker image inspect "$image" >/dev/null 2>&1; then image_owned=true; fi
          container="$(docker run -d --network host \
            -e RAVEN_Setup_Mode=None -e RAVEN_Security_UnsecuredAccessAllowed=Local \
            -e RAVEN_License_Eula_Accepted=true \
            -e RAVEN_ServerUrl=http://127.0.0.1:18003 -e RAVEN_ServerUrl_Tcp=tcp://127.0.0.1:18888 "$image")"
          for attempt in {1..60}; do
            if curl --fail-with-body --silent --show-error --max-time 3 http://127.0.0.1:18003/build/version >"$fixture/version.json" 2>"$fixture/readiness.log"; then break; fi
            if [[ "$attempt" == 60 ]]; then cat "$fixture/readiness.log"; head -c 1024 "$fixture/version.json"; exit 1; fi
            sleep 2
          done
          cat "$fixture/version.json"
          export OASIS_RAVEN_CI_FIXTURE="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-RavenDBStorage -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS.UnitTests/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS.UnitTests.csproj" --filter "FullyQualifiedName~RavenDbSaveOwnershipTests" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "RavenDB write ownership verification failed." }
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.RavenDBOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstRaven" /p:RavenDirectStorageOnly=true /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native RavenDB storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/oasis_storage_$mode.json" >/dev/null
          done
          echo "Verified both RavenDB storage modes and exact native cleanup."
