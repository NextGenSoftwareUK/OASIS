name: Zcash native storage

on:
  push:
    branches: [work/zcash-native-storage, work/hyperdrive-triad]
    paths:
      - '.github/workflows/zcash-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.ZcashOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.ZcashOASIS.IntegrationTests/ZcashNativeStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run the shared core storage suite against a disposable zcashd regtest node and Kubo
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          datadir="$(mktemp -d "$RUNNER_TEMP/zcashd-data.XXXXXXXX")"
          zcashd="" kubo="" miner=""
          cleanup() {
            status=$?
            if [[ -n "$miner" ]]; then kill "$miner" 2>/dev/null || true; wait "$miner" 2>/dev/null || true; fi
            if [[ -n "$zcashd" ]]; then (( status != 0 )) && docker logs --tail 60 "$zcashd"; docker rm -fv "$zcashd" >/dev/null || status=1; fi
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            # The container writes the data directory as its own user; remove it through the image.
            [[ "$datadir" == "$RUNNER_TEMP"/zcashd-data.* ]] && { docker run --rm -v "$datadir:/data" --entrypoint rm electriccoinco/zcashd:latest -rf /data/regtest >/dev/null 2>&1 || true; rm -rf -- "$datadir" || true; }
            exit "$status"
          }
          trap cleanup EXIT
          user=oasis; password="$(openssl rand -hex 16)"
          # zcashd only starts with a configuration file in its data directory (/srv/zcashd/.zcash for the image user).
          cat > "$datadir/zcash.conf" <<CONF
          regtest=1
          server=1
          listen=0
          txindex=1
          insightexplorer=1
          experimentalfeatures=1
          i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1
          nuparams=5ba81b19:1
          nuparams=76b809bb:1
          nuparams=2bb40e60:1
          nuparams=f5b9230b:1
          nuparams=e9ff75a6:1
          nuparams=c2d6d0b4:1
          rpcuser=$user
          rpcpassword=$password
          rpcbind=0.0.0.0
          rpcallowip=0.0.0.0/0
          rpcport=18232
          CONF
          sed -i 's/^          //' "$datadir/zcash.conf"
          chmod 0777 "$datadir"; chmod 0666 "$datadir/zcash.conf"
          zcashd="$(docker run -d -p 127.0.0.1:18232:18232 -v "$datadir:/srv/zcashd/.zcash" --entrypoint zcashd \
            electriccoinco/zcashd:latest -printtoconsole)"
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          cli() { docker exec "$zcashd" zcash-cli -regtest -rpcport=18232 -rpcuser="$user" -rpcpassword="$password" "$@"; }
          for attempt in $(seq 1 120); do
            if cli getblockchaininfo >/dev/null 2>&1 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            # Fail fast with the node log if zcashd exited instead of waiting out the whole budget.
            [[ "$(docker inspect -f '{{.State.Running}}' "$zcashd")" == true ]] || { echo "zcashd exited during startup" >&2; exit 1; }
            [[ "$attempt" != 120 ]]; sleep 3
          done
          cli getinfo | jq -c '{version, blocks}'
          cli generate 101 >/dev/null
          # The oldest mature coinbase output names the wallet-held transparent storage address.
          address="$(cli listunspent 1 9999999 | jq -r 'sort_by(-.confirmations) | .[0].address')"
          [[ -n "$address" && "$address" != null ]]
          echo "Storage address: $address"
          # Mine a block every two seconds so storage writes are confirmed.
          ( while true; do cli generate 1 >/dev/null 2>&1 || true; sleep 2; done ) & miner=$!
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_ZCASH_RPC="http://127.0.0.1:18232/" \
            OASIS_ZCASH_RPC_USER="$user" OASIS_ZCASH_RPC_PASSWORD="$password" OASIS_ZCASH_STORAGE_ADDRESS="$address" \
            OASIS_ZCASH_KUBO="http://127.0.0.1:15001" OASIS_ZCASH_STORAGE_KEY="$(openssl rand -base64 32)"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.ZcashOASIS.IntegrationTests" \
            -p:NativeStorageConformance=true --filter "FullyQualifiedName~ZcashNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Zcash passed both storage modes against a regtest node."
