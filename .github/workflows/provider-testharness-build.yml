name: Provider TestHarness build

# Every provider TestHarness must keep compiling against the current provider and Core APIs.
# Before this gate the harnesses were never built in CI and 80+ of them rotted.

on:
  push:
    branches: [Development, master]
    paths:
      - 'Providers/**'
      - 'OASIS Architecture/**'
      - 'Scripts/CI/AllProviderTestHarnesses.proj'
      - '.github/workflows/provider-testharness-build.yml'
  pull_request:
    branches: [Development, master]
    paths:
      - 'Providers/**'
      - 'OASIS Architecture/**'
      - 'Scripts/CI/AllProviderTestHarnesses.proj'
      - '.github/workflows/provider-testharness-build.yml'
  workflow_dispatch:

concurrency:
  group: provider-testharness-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded dependency revisions
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Fetch the pinned holochain client the BootLoader build references
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp fetch --no-tags origin "$HOLOCHAIN_COMMIT"
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build every provider TestHarness
        run: |
          dotnet msbuild Scripts/CI/AllProviderTestHarnesses.proj -restore -m:2 -nr:false -p:UseSharedCompilation=false \
            -nologo -v:m -clp:"Summary;ErrorsOnly"
