name: Railway pushed artifact guard
on:
  push:
    branches: [Development, master, work/cosmic-cql-ton-public]
    paths:
      - .githooks/pre-push
      - Scripts/test_railway_pre_push.py
      - Scripts/validate_railway_dependency_manifest.py
      - .github/workflows/test-railway-pre-push.yml
  pull_request:
    paths:
      - .githooks/pre-push
      - Scripts/test_railway_pre_push.py
      - Scripts/validate_railway_dependency_manifest.py
      - .github/workflows/test-railway-pre-push.yml
permissions:
  contents: read
jobs:
  artifact-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Verify pushed snapshots independently of checkout state
        run: python -B Scripts/test_railway_pre_push.py --source-ref HEAD
