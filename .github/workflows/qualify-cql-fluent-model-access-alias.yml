name: Qualify fluent model access-alias guard
run-name: Verify the fluent model alias authority boundary and WEB4 build

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - "OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests/CqlFluentModelAccessAliasTests.cs"
      - ".github/workflows/qualify-cql-fluent-model-access-alias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify model alias authority boundary and compilation
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-fluent-model-access-alias-ci -Operation {
            dotnet test "OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests" /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CqlFluentModelAccessAliasTests' --results-directory TestResults/SetContract --logger 'trx;LogFileName=entry.trx'
            if ($LASTEXITCODE) { throw 'Model alias authority contract failed' }
            [xml]$report = Get-Content TestResults/SetContract/entry.trx
            if ($report.TestRun.ResultSummary.Counters.passed -ne '1' -or $report.TestRun.ResultSummary.Counters.total -ne '1') { throw 'The alias authority control must pass' }
            dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB4 composition failed to compile' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-fluent-model-access-alias
          path: OASIS/TestResults/SetContract/entry.trx
          if-no-files-found: ignore
          retention-days: 2
