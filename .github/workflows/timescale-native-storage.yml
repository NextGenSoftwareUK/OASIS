name: TimescaleDB native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/timescale-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.TimescaleDBOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.TimescaleDBOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run native storage conformance against TimescaleDB
        shell: bash
        run: |
          image=docker.io/timescale/timescaledb@sha256:9192a05d435e360c861cfdb0f4b9f5ae11d33609713163465e46a64fcc577d49
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-timescale.XXXXXXXX")"
          container=""
          image_owned=false
          cleanup() {
            status=$?
            if [[ -n "$container" ]]; then
              if (( status != 0 )); then docker logs --tail 35 "$container" || true; fi
              docker rm -fv "$container" || status=1
            fi
            if [[ "$image_owned" == true ]] && docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || status=1
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-timescale.* ]]; then rm -rf -- "$fixture"; fi
            [[ ! -e "$fixture" ]] || status=1
            if (( status == 0 )); then echo "Removed the owned TimescaleDB container, volumes and fixture."; fi
            exit "$status"
          }
          trap cleanup EXIT
          if ! docker image inspect "$image" >/dev/null 2>&1; then image_owned=true; fi
          export OASIS_TIMESCALE_CI_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$OASIS_TIMESCALE_CI_PASSWORD"
          container="$(docker run -d -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD="$OASIS_TIMESCALE_CI_PASSWORD" "$image")"
          sql=(docker exec -e PGPASSWORD="$OASIS_TIMESCALE_CI_PASSWORD" "$container" psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1)
          for attempt in {1..45}; do
            if timeout 3 "${sql[@]}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 45 ]]
            sleep 2
          done
          for mode in async sync; do
            database="oasis_storage_$mode"
            "${sql[@]}" -d postgres -c "CREATE DATABASE $database"
            "${sql[@]}" -d "$database" -c 'CREATE EXTENSION IF NOT EXISTS timescaledb'
            version="$("${sql[@]}" -d "$database" -Atc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'")"
            [[ -n "$version" ]]
            echo "TimescaleDB $version on $database"
          done
          export OASIS_TIMESCALE_CI_FIXTURE="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-TimescaleStorage -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.TimescaleDBOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.TimescaleDBOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstTimescale" /p:TimescaleDirectStorageOnly=true /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native TimescaleDB storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/oasis_storage_$mode.json" >/dev/null
          done
          echo "Verified both TimescaleDB storage modes and exact native cleanup."
