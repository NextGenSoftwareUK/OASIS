name: Publish — ONODE Manager Binaries

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0); planned by Global OASIS Release'
        required: true
        type: string
  # Manual build-only run: builds and uploads all platform artifacts, never publishes a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version for the test build (stable SemVer, e.g. 0.0.1)'
        required: true
        type: string
        default: '0.0.1'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT:         ONODE/ONODEManager/NextGenSoftware.OASIS.ONODE.Manager/NextGenSoftware.OASIS.ONODE.Manager.csproj
  SERVICE_PROJECT: ONODE/ONODEManager/NextGenSoftware.OASIS.ONODE.Service/NextGenSoftware.OASIS.ONODE.Service.csproj

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - id: version
        name: Resolve canonical package version and release tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::ONODE Manager version must be stable SemVer (for example 1.0.0).'
            exit 1
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=onode-manager-v$version" >> "$GITHUB_OUTPUT"

  # ── Unit tests ────────────────────────────────────────────────────────────
  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OASIS
        uses: actions/checkout@v7
        with:
          path: OASIS

      - name: Resolve pinned ONODE Manager source
        id: onode-manager-source
        shell: bash
        run: echo "sha=$(git -C OASIS rev-parse HEAD:ONODE/ONODEManager)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned ONODE Manager
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/ONODEManager
          ref: ${{ steps.onode-manager-source.outputs.sha }}
          path: OASIS/ONODE/ONODEManager
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Checkout holochain-client-csharp
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          path: holochain-client-csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: dotnet test OASIS/ONODE/ONODEManager/NextGenSoftware.OASIS.ONODE.Tests/NextGenSoftware.OASIS.ONODE.Tests.csproj --logger "trx"

  # ── Windows (MSIX via Velopack) ────────────────────────────────────────────
  build-windows:
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - name: Checkout OASIS
        uses: actions/checkout@v7
        with:
          path: OASIS

      - name: Resolve pinned ONODE Manager source
        id: onode-manager-source
        shell: bash
        run: echo "sha=$(git -C OASIS rev-parse HEAD:ONODE/ONODEManager)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned ONODE Manager
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/ONODEManager
          ref: ${{ steps.onode-manager-source.outputs.sha }}
          path: OASIS/ONODE/ONODEManager
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Checkout holochain-client-csharp
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          path: holochain-client-csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore & Publish Manager (win-x64)
        run: >
          dotnet publish OASIS/${{ env.PROJECT }}
          -c Release -r win-x64 --self-contained
          -o publish/win-x64
          /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Restore & Publish Service (win-x64)
        run: >
          dotnet publish OASIS/${{ env.SERVICE_PROJECT }}
          -c Release -r win-x64 --self-contained
          -o publish/win-x64
          /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      # Signing runs only when WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD secrets exist.
      - name: Pack with Velopack
        shell: bash
        env:
          PACK_VERSION: ${{ needs.prepare.outputs.package_version }}
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--packId ONODEManager --packVersion "$PACK_VERSION"
                --packDir publish/win-x64 --mainExe NextGenSoftware.OASIS.ONODE.Manager.exe
                --outputDir release/win-x64)
          if [[ -n "$CERT_PFX_BASE64" ]]; then
            cert="$RUNNER_TEMP/codesign.pfx"
            trap 'rm -f "$cert"' EXIT
            echo "$CERT_PFX_BASE64" | base64 -d > "$cert"
            args+=(--signParams "/f \"$(cygpath -w "$cert")\" /p \"$CERT_PASSWORD\" /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          else
            echo "::warning::WINDOWS_CERT_PFX_BASE64 not set; Windows build is unsigned."
          fi
          vpk pack "${args[@]}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/win-x64/

  # ── macOS (DMG via Velopack) ───────────────────────────────────────────────
  build-macos:
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - name: Checkout OASIS
        uses: actions/checkout@v7
        with:
          path: OASIS

      - name: Resolve pinned ONODE Manager source
        id: onode-manager-source
        shell: bash
        run: echo "sha=$(git -C OASIS rev-parse HEAD:ONODE/ONODEManager)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned ONODE Manager
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/ONODEManager
          ref: ${{ steps.onode-manager-source.outputs.sha }}
          path: OASIS/ONODE/ONODEManager
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Checkout holochain-client-csharp
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          path: holochain-client-csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore & Publish Manager (osx-x64)
        run: >
          dotnet publish OASIS/${{ env.PROJECT }}
          -c Release -r osx-x64 --self-contained
          -o publish/osx-x64
          /p:PublishSingleFile=true

      - name: Restore & Publish Service (osx-x64)
        run: >
          dotnet publish OASIS/${{ env.SERVICE_PROJECT }}
          -c Release -r osx-x64 --self-contained
          -o publish/osx-x64
          /p:PublishSingleFile=true

      # Signing + notarization run only when the MACOS_* and APPLE_* secrets exist.
      - name: Pack with Velopack (DMG)
        shell: bash
        env:
          PACK_VERSION: ${{ needs.prepare.outputs.package_version }}
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--packId ONODEManager --packVersion "$PACK_VERSION"
                --packDir publish/osx-x64 --mainExe NextGenSoftware.OASIS.ONODE.Manager
                --outputDir release/osx-x64)
          if [[ -n "$CERT_P12_BASE64" ]]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            kc_pass="$(openssl rand -base64 24)"
            cert="$RUNNER_TEMP/codesign.p12"
            trap 'rm -f "$cert"; security delete-keychain "$keychain" 2>/dev/null || true' EXIT
            echo "$CERT_P12_BASE64" | base64 -d > "$cert"
            security create-keychain -p "$kc_pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$kc_pass" "$keychain"
            security import "$cert" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            args+=(--signAppIdentity "$APP_IDENTITY" --keychain "$keychain")
            [[ -n "$INSTALL_IDENTITY" ]] && args+=(--signInstallIdentity "$INSTALL_IDENTITY")
            if [[ -n "$APPLE_ID" ]]; then
              xcrun notarytool store-credentials onode-notary --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
              args+=(--notaryProfile onode-notary)
            else
              echo "::warning::APPLE_ID not set; macOS build is signed but not notarized."
            fi
          else
            echo "::warning::MACOS_CERT_P12_BASE64 not set; macOS build is unsigned."
          fi
          vpk pack "${args[@]}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/osx-x64/

  # ── Linux (AppImage via Velopack) ─────────────────────────────────────────
  build-linux:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OASIS
        uses: actions/checkout@v7
        with:
          path: OASIS

      - name: Resolve pinned ONODE Manager source
        id: onode-manager-source
        shell: bash
        run: echo "sha=$(git -C OASIS rev-parse HEAD:ONODE/ONODEManager)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned ONODE Manager
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/ONODEManager
          ref: ${{ steps.onode-manager-source.outputs.sha }}
          path: OASIS/ONODE/ONODEManager
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - name: Checkout NextGenSoftware-Libraries
        uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          path: NextGenSoftware-Libraries

      - name: Checkout holochain-client-csharp
        uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          path: holochain-client-csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore & Publish Manager (linux-x64)
        run: >
          dotnet publish OASIS/${{ env.PROJECT }}
          -c Release -r linux-x64 --self-contained
          -o publish/linux-x64
          /p:PublishSingleFile=true

      - name: Restore & Publish Service (linux-x64)
        run: >
          dotnet publish OASIS/${{ env.SERVICE_PROJECT }}
          -c Release -r linux-x64 --self-contained
          -o publish/linux-x64
          /p:PublishSingleFile=true

      - name: Pack with Velopack (AppImage)
        run: >
          vpk pack
          --packId "ONODEManager"
          --packVersion "${{ needs.prepare.outputs.package_version }}"
          --packDir  publish/linux-x64
          --mainExe  NextGenSoftware.OASIS.ONODE.Manager
          --outputDir release/linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/linux-x64/

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "ONODE Manager v${{ needs.prepare.outputs.package_version }}"
          body: |
            ## ONODE Manager Release

            Cross-platform desktop tray app for managing OASIS Web4–Web10 node services.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows | `ONODEManagerSetup.exe` (Velopack installer) |
            | macOS | `ONODEManager.dmg` |
            | Linux | `ONODEManager.AppImage` |

            ### Install
            - **Windows**: run `ONODEManagerSetup.exe`
            - **macOS**: open `ONODEManager.dmg` and drag to Applications
            - **Linux**: `chmod +x ONODEManager.AppImage && ./ONODEManager.AppImage`

            ### Requirements
            ONODEService must be running (`onode service install && onode service start`).
          files: |
            artifacts/release-windows/**
            artifacts/release-macos/**
            artifacts/release-linux/**
          draft: false
          prerelease: false
