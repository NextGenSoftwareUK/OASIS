name: Submodule Sync

# Keeps each branch's submodule pointers on the branch tips the rule requires:
#   master      -> each submodule's main
#   Development -> each submodule's Development
#
# Without this the pointers only move when someone remembers to bump them, so they go
# stale silently. That is how dev.api.web6 ended up running older code than production
# while both branches' pointers were still technically valid.
#
# Opens a PR rather than pushing: a pointer bump on master is a release, and should be
# reviewed like one. check_submodule_branches.py runs on the PR as usual.
#
# Uses only actions/checkout and the gh CLI preinstalled on GitHub-hosted runners, so no
# third-party action gets write access to this repository.

on:
  schedule:
    # 07:00 UTC every Monday - before the working week, after any weekend merges.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync'
        required: true
        type: choice
        options:
          - both
          - master
          - Development
        default: both

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [master, Development]

    steps:
      - name: Decide whether this branch was requested
        id: gate
        run: |
          requested='${{ github.event.inputs.branch || 'both' }}'
          if [ "$requested" = "both" ] || [ "$requested" = '${{ matrix.branch }}' ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.branch }} - run requested '$requested'."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive
          fetch-depth: 0
          # A PR created with GITHUB_TOKEN does not trigger workflow runs, which would
          # leave the branch check unverified on exactly the PRs that need it. Set a
          # repo-scoped PAT as SUBMODULE_SYNC_TOKEN to get CI on these PRs.
          token: ${{ secrets.SUBMODULE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Move each pointer to the branch tip declared in .gitmodules
        if: steps.gate.outputs.skip == 'false'
        id: bump
        run: |
          set -euo pipefail

          # --remote follows the branch = value in .gitmodules, which is why that file
          # differs per branch: main on master, Development on Development.
          git submodule update --remote --recursive

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All submodule pointers are already at their branch tips."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pointers that moved:"
            git diff --submodule=short | grep '^Submodule' || true
          fi

      - name: Verify the result still satisfies the branch rule
        if: steps.gate.outputs.skip == 'false' && steps.bump.outputs.changed == 'true'
        run: python3 Scripts/check_submodule_branches.py

      - name: Open or update the pull request
        if: steps.gate.outputs.skip == 'false' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          SYNC_BRANCH="submodule-sync/${TARGET}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git commit -am "chore(submodules): bump ${TARGET} pointers to their branch tips"
          git push --force origin "$SYNC_BRANCH"

          # Build the body in a file - avoids heredoc indentation problems inside YAML.
          {
            printf 'Moves each submodule pointer to the tip of the branch `.gitmodules`'
            printf ' declares for it: `main` on master, `Development` on Development.\n\n'
            printf '**Review before merging.** On `master` this is a release: whatever'
            printf ' landed on a submodule'"'"'s `main` since the last sync ships with it.\n\n'
            printf 'Pointers that moved:\n\n```\n'
            git diff --submodule=short "origin/${TARGET}...HEAD" | grep '^Submodule' || true
            printf '```\n\n'
            printf 'Opened by `.github/workflows/submodule-sync.yml`.\n'
          } > /tmp/pr-body.md

          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open - the force push updated it."
            gh pr edit "$EXISTING" --body-file /tmp/pr-body.md
          else
            gh pr create --base "$TARGET" --head "$SYNC_BRANCH" \
              --title "chore(submodules): sync ${TARGET} pointers" \
              --body-file /tmp/pr-body.md
          fi
