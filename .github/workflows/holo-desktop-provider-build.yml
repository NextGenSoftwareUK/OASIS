name: Holo Desktop native verification

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/holo-desktop-provider-build.yml'
      - 'Scripts/test_holonet_live_release.ps1'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.HoloOASIS.Desktop/**'
      - 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.HoloOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  storage:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
          revision="$(sed -n 's/^HOLOCHAIN_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "holochain=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependencies.outputs.holochain }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Retrieve verified hApp from the pinned producer run
        uses: actions/download-artifact@v7
        with:
          name: verified-holooasis-happ
          run-id: 42662935082
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/oasis-holo-desktop-happ
      - name: Run Desktop storage against the pinned conductor
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'oasis-holo-desktop-happ'
          $happ = Join-Path $artifact 'oasis.happ'
          $manifest = Get-Content -LiteralPath (Join-Path $artifact 'build-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -notmatch '^[a-f0-9]{40}$' -or
              (Get-FileHash -LiteralPath $happ -Algorithm SHA256).Hash -ine $manifest.artifactSha256) {
            throw 'The verified producer bundle failed provenance checks.'
          }
          Copy-Item -LiteralPath $happ -Destination 'Providers/Network/NextGenSoftware.OASIS.API.Providers.HoloOASIS/OASIS_hAPP/oasis.happ' -Force
          $client = '../holochain-client-csharp/NextGenSoftware.Holochain.HoloNET.Client.Tests/NextGenSoftware.Holochain.HoloNET.Client.Tests.csproj'
          $project = 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.HoloOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.HoloOASIS.IntegrationTests.csproj'
          try {
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-HoloDesktop -Operation {
              ./Scripts/test_holonet_live_release.ps1 -Project $client -Happ $happ -ResultsDirectory $artifact -DesktopProject $project
            }
          }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Holo Desktop fixture::$message"
            $report = Join-Path $artifact 'holo-desktop-native.trx'
            if (Test-Path -LiteralPath $report) {
              [xml]$xml = Get-Content -LiteralPath $report -Raw
              foreach ($failure in $xml.SelectNodes('//*[local-name()="UnitTestResult" and @outcome="Failed"]')) {
                $detail = $failure.SelectSingleNode('.//*[local-name()="Message"]').InnerText
                if ($detail) {
                  $detail = $detail.Substring(0, [Math]::Min($detail.Length, 1200))
                  $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Output "::error title=Holo Desktop storage assertion::$detail"
                }
              }
            }
            throw
          }
