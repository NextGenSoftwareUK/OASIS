name: Qualify GOMapRoute WEB4 read integration

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - '.github/workflows/qualify-gomap-web4.yml'
      - 'Providers/Maps/NextGenSoftware.OASIS.API.Providers.GOMapOASIS/**'
      - 'Scripts/TestHosts/gomap_web4_mongo.py'
      - 'Docker/oasis-dependency-versions.env'
      - 'OASIS Architecture/NextGenSoftware.OASIS.API.Core'
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/CqlGOMapRouteHostedConfigurationTests.cs'
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/CqlGOMapRouteHttpTests.cs'
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/ReviewedPublicMongoHttpFixture.cs'
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/Services/Cql/CqlReviewedNetworkReadSourceRegistration.cs'
      - 'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/Services/Cql/CqlV1Compiler.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Validate exact dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify controlled WEB4 read integration
        working-directory: OASIS
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner gomap-web4-ci -Operation {
            dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CqlGOMapRouteHostedConfigurationTests' --results-directory TestResults/GOMapWeb4Current --logger 'trx;LogFileName=boundary.trx'
            if ($LASTEXITCODE) { throw 'GOMapRoute WEB4 boundary qualification failed' }
            [xml]$report = Get-Content TestResults/GOMapWeb4Current/boundary.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '8' -or $counts.total -ne '8' -or $counts.executed -ne '8') {
              throw 'All eight boundary cases must execute and pass without skips'
            }
          }
      - name: Start owned isolated MongoDB replica
        working-directory: OASIS
        run: python3 -B Scripts/TestHosts/gomap_web4_mongo.py --operation start
      - name: Verify actual public routes and MongoDB through loopback WEB4 HTTP
        working-directory: OASIS
        shell: pwsh
        env:
          COSMIC_REVIEWED_PUBLIC_MONGO_NATIVE: owned-local-27029
          COSMIC_GOMAP_ROUTE_NATIVE_HTTP: owned-loopback
        run: |
            dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests --no-build --no-restore /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~GOMapRouteNativeHttp' --results-directory TestResults/GOMapWeb4Current --logger 'trx;LogFileName=web4.trx'
            if ($LASTEXITCODE) { throw 'GOMap public route/MongoDB WEB4 qualification failed' }
            [xml]$report = Get-Content TestResults/GOMapWeb4Current/web4.trx
            $counts = $report.TestRun.ResultSummary.Counters
            if ($counts.passed -ne '1' -or $counts.total -ne '1' -or $counts.executed -ne '1') {
              throw 'The real public route/MongoDB HTTP case must execute and pass without skips'
            }
      - name: Retain compact qualification reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gomap-web4-cql
          path: |
            OASIS/TestResults/GOMapWeb4Current/*.trx
            OASIS/LocalState/COSMIC/ReviewedPublicMongoHttpQualification/GOMapOASIS/mongo-http-native-summary.json
            OASIS/LocalState/COSMIC/ReviewedPublicMongoHttpQualification/GOMapOASIS/fixture.cleaned.json
            OASIS/TestResults/GOMapWeb4Current/mongo-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove owned MongoDB container and anonymous volumes
        if: always()
        working-directory: OASIS
        run: python3 -B Scripts/TestHosts/gomap_web4_mongo.py --operation stop
      - name: Retain final owned cleanup proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gomap-web4-cleanup
          path: OASIS/TestResults/GOMapWeb4Current/mongo-cleanup.json
          if-no-files-found: error
          retention-days: 30
