name: Mixed cache authority root fix targeted qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  guid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Start isolated replica set with fault injection
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name usage-mongo -p 27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all --setParameter enableTestCommands=1
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec usage-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Qualify only new GUID cases on three native stores
        shell: pwsh
        run: |
          $env:OASIS_CQL_NEO_ENTITY_PROJECTION_ROOT = (Get-Location).Path
          $env:OASIS_CQL_MONGO_ENTITY_PROJECTION_ROOT = (Get-Location).Path
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact source mismatch.' }
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          if ($LASTEXITCODE) { throw 'Pinned dependency mismatch.' }
          New-Item -ItemType Directory -Force TestResults/Neo4jCurrent | Out-Null
          docker run -d --name cql-guid-neo -p 127.0.0.1:17687:7687 -e NEO4J_AUTH=neo4j/oasis-local-test-only neo4j:5.26.12
          if ($LASTEXITCODE) { throw 'Owned Neo fixture did not start.' }
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              docker exec cql-guid-neo cypher-shell -u neo4j -p oasis-local-test-only 'RETURN 1' 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
            if (!$ready) { throw 'Owned Neo fixture not ready.' }
            & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-guid-http-ci -Operation {
              dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~MixedNativePredicateExcludesStaleCachedValueAcrossFilterBoundary|FullyQualifiedName~GroupedGuidDistinctMixedHttpUsesRealNativeProvider|FullyQualifiedName~GuidRowsMixedHttpUsesRealNativeProviderAndGlobalPaging' --logger 'trx;LogFileName=mixed-authority-native.trx' --results-directory TestResults/Neo4jCurrent
              if ($LASTEXITCODE) { throw 'New mixed GUID HTTP cases failed.' }
              [xml]$trx = Get-Content TestResults/Neo4jCurrent/mixed-authority-native.trx
              $counts = $trx.TestRun.ResultSummary.Counters
              if ([int]$counts.total -ne 9 -or [int]$counts.passed -ne 9 -or [int]$counts.notExecuted -ne 0) {
                throw 'Exactly three new mixed GUID HTTP cases must pass.'
              }
              dotnet test 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests' /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedCountIncludes198IdentitiesBeforePaging|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedCountRejectsInvalidIntentBeforeDispatch|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedCountFreezesItsOperationMappingAndFiltersBeforeProviderCallbacks|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedDoubleRetainsWireDomainAndPagesAfterLiveWinner|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedSelectsOnlyLogicalIdentityWithoutNativeFields|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedNumericReductionUsesTheComputedLiveWinner|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedOrdersLiveWinnerBeforeOneGlobalPage|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedUsesSharedUnicodeScalarOrderingAfterNumericTie|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedKeepsNullFirstAndProvenanceAligned|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedRejectsInvalidOrderBeforeDispatch|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedRejectsShortenedNativeRead|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedRejectsDuplicateStoredIdentityExplicitly|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedSharedOwnerRejectsInvalidWholeInput|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedBreaksEqualSelectedKeysByLogicalId|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpSelectedCountsUseReconciledNullableValues|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpTextExtremaUseTheLiveWinnerAndSkipNulls|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedKeepsNativeCellsAndDeduplicatesLogicalIdentity|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedRejectsDuplicateVirtualIdentityOrFullStoredBranch|FullyQualifiedName~CqlV1Web4Tests.ComputedAliasProjectionHttpMixedRequiresItsFourAttemptAdmissionBeforeNativeMapping|FullyQualifiedName~CqlV1Web4Tests.MixedSnapshotAuthorityRejectsIncompleteIdentityProofBeforeReturningRows' --logger 'trx;LogFileName=mixed-authority-unit.trx' --results-directory TestResults/Neo4jCurrent
              if ($LASTEXITCODE) { throw 'Affected mixed HTTP unit/provenance protocol cases failed.' }
              [xml]$unit = Get-Content TestResults/Neo4jCurrent/mixed-authority-unit.trx
              $unitCounts = $unit.TestRun.ResultSummary.Counters
              if ([int]$unitCounts.total -lt 4 -or [int]$unitCounts.passed -ne [int]$unitCounts.total -or [int]$unitCounts.notExecuted -ne 0) {
                throw 'Require all selected mixed HTTP protocol cases with no skipped controls.'
              }
              dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~ShippedFreeProfilePassesStartupAndRealAuthorityMeterValidation' --logger 'trx;LogFileName=mixed-authority-admission.trx' --results-directory TestResults/Neo4jCurrent
              if ($LASTEXITCODE) { throw 'Shipped free-plan CQL attempt admission failed.' }
              [xml]$admission = Get-Content TestResults/Neo4jCurrent/mixed-authority-admission.trx
              $admissionCounts = $admission.TestRun.ResultSummary.Counters
              if ([int]$admissionCounts.total -ne 10 -or [int]$admissionCounts.passed -ne 10 -or [int]$admissionCounts.notExecuted -ne 0) {
                throw 'Exactly ten shipped route admission rows must pass.'
              }
              foreach ($provider in 'MongoDBOASIS','SQLLiteDBOASIS','Neo4jOASIS') {
                $report = Get-Content "TestResults/Neo4jCurrent/$provider-predicate-crossing-http-native.json" -Raw | ConvertFrom-Json
                if ($report.provider -ne $provider -or $report.checks -ne 3 -or $report.successfulHolonWrites -ne 4 -or
                    $report.ownedCleanupIds -ne 4 -or $report.rawNativeRecords -ne 2 -or
                    $report.successfulHttpQueries -ne 2 -or $report.foreignOwnerRequests -ne 1 -or
                    !$report.nativeProviderVerified -or !$report.realHttpVerified -or !$report.stalePredicateExcluded -or
                    !$report.livePredicateIncluded -or !$report.foreignOwnerRefused -or
                    !$report.nativeSourceUnchangedVerified -or !$report.storedCacheUnchangedVerified -or
                    !$report.usageSettledVerified -or !$report.exactCleanupVerified -or
                    @($report.queryElapsedMilliseconds.PSObject.Properties).Count -ne 3) {
                  throw "Require exact stale predicate, live winner, owner, usage and cleanup evidence for $provider."
                }
              }
            }
          } finally {
            docker rm -f -v cql-guid-neo
            if ($LASTEXITCODE) { throw 'Owned Neo cleanup failed.' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mixed-authority-native
          path: |
            TestResults/Neo4jCurrent/mixed-authority-native.trx
            TestResults/Neo4jCurrent/mixed-authority-unit.trx
            TestResults/Neo4jCurrent/mixed-authority-admission.trx
            TestResults/Neo4jCurrent/*-predicate-crossing-http-native.json
            TestResults/Neo4jCurrent/*-grouped-guid-http-native.json
            TestResults/Neo4jCurrent/*-guid-rows-http-native.json
      - name: Remove owned CI MongoDB
        if: always()
        run: docker rm --force --volumes usage-mongo
