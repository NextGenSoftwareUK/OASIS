name: GUID grouped SQL text controls
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_SOURCE: 11bf926eb64652eaf4a949ee97a3b740f0869e91
    steps:
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/Web4Site
          ref: 11bf926eb64652eaf4a949ee97a3b740f0869e91
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact source and only six new GUID text cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEBSITE_SOURCE"
          mkdir -p TestResults/GuidText
          node --test --test-reporter=junit cql-guid-grouped.test.cjs > TestResults/GuidText/guid-text.xml
          python3 -B - <<'PY'
          import json,os,xml.etree.ElementTree as E
          tree=E.parse('TestResults/GuidText/guid-text.xml')
          cases=tree.findall('.//testcase')
          assert len(cases)==6
          assert not tree.findall('.//failure') and not tree.findall('.//error') and not tree.findall('.//skipped')
          for provider in ['MongoDBOASIS','SQLLiteDBOASIS','Neo4jOASIS']:
              assert sum(provider in case.attrib['name'] for case in cases)==2
          assert sum(case.attrib['name'].startswith('GUID grouped text retains canonical and metadata domains') for case in cases)==3
          assert sum(case.attrib['name'].startswith('GUID grouped text preserves saved mapping') for case in cases)==3
          with open('TestResults/GuidText/qualification.json','w') as f:
              json.dump({'websiteSource':os.environ['WEBSITE_SOURCE'],'cases':6,'apiCalls':0,'dependencyInstalls':0},f)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guid-text
          path: TestResults/GuidText
