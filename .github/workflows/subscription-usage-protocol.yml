name: CQL grouped distinct client qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
      website_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/Web4Site
          ref: ${{ inputs.website_ref }}
          persist-credentials: false
      - name: Verify exact website source
        shell: bash
        env:
          WEBSITE_REF: ${{ inputs.website_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEBSITE_REF"
          test "$WEBSITE_REF" = "49e7a8506aabd4bb57d9cabdf53942d3e99f581f"
          node --version
      - name: Verify only new grouped distinct parser contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          node --test --test-reporter=junit cql-grouped-distinct.test.cjs > TestResults/grouped-distinct-client.xml
          python3 -B - <<'PY'
          import xml.etree.ElementTree as E,json
          root=E.parse('TestResults/grouped-distinct-client.xml').getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==12,len(cases)
          assert not list(root.iter('failure')) and not list(root.iter('error')) and not list(root.iter('skipped'))
          assert len({case.attrib['name'] for case in cases})==12
          report={'website':'49e7a8506aabd4bb57d9cabdf53942d3e99f581f','newCases':12,'passed':12,'failed':0,'skipped':0,'nativeAcceptance':False}
          with open('TestResults/grouped-distinct-client-acceptance.json','w') as out:json.dump(report,out)
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grouped-distinct-client-results
          path: TestResults/grouped-distinct-client*
