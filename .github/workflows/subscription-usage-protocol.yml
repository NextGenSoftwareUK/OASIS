name: CQL grouped distinct demo qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
      website_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/Web4Site
          ref: ${{ inputs.website_ref }}
          persist-credentials: false
      - name: Verify exact website source
        shell: bash
        env:
          WEBSITE_REF: ${{ inputs.website_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEBSITE_REF"
          test "$WEBSITE_REF" = "4767c8371a6d7a7724938c7c2d7d902fb8219874"
          node --version
      - name: Verify only two new displayed-demo controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          node --test --test-name-pattern="^loads the grouped distinct demo" --test-reporter=junit cql-playground.test.cjs > TestResults/grouped-distinct-client.xml
          python3 -B - <<'PY'
          import xml.etree.ElementTree as E,json
          root=E.parse('TestResults/grouped-distinct-client.xml').getroot()
          cases=list(root.iter('testcase'))
          selected=[c for c in cases if c.attrib.get('name','').startswith('loads the grouped distinct demo')]
          assert len(selected)==2,len(selected)
          assert not list(root.iter('failure')) and not list(root.iter('error'))
          assert all(c.find('skipped') is None for c in selected)
          assert all(c.find('skipped') is not None for c in cases if c not in selected)
          assert {c.attrib['name'] for c in selected}=={
            'loads the grouped distinct demo for review without querying WEB4',
            'loads the grouped distinct demo with the documented mixed mapping syntax'}
          report={'website':'4767c8371a6d7a7724938c7c2d7d902fb8219874','newCases':2,'passed':2,'failed':0,'selectedSkipped':0,
            'excludedCases':len(cases)-2,'hostedAcceptance':False,'nativeAcceptance':False}
          with open('TestResults/grouped-distinct-client-acceptance.json','w') as out:json.dump(report,out)
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grouped-distinct-client-results
          path: TestResults/grouped-distinct-client*
