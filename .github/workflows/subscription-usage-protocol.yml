name: Subscription usage protocol
on:
  pull_request:
    branches: [Development, master]
  push:
    branches: [Development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=ledger-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Start isolated replica set with fault injection
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name usage-mongo -p 27017:27017 mongo:8.0.15 --replSet ledger-test --bind_ip_all --setParameter enableTestCommands=1
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec usage-mongo mongosh --quiet --eval 'rs.initiate({_id:"ledger-test",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate sole authority and pinned source graph
        run: |
          python3 Scripts/validate_web4_subscription_authority.py
          python3 Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          pwsh -File Scripts/validate_web6_web4_metering_cutover.ps1
      - name: WEB4 transactions, ownership, migration and failure injection
        run: dotnet test ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj -m:1 --logger trx --results-directory TestResults/authority
      - name: WEB4 application unit tests
        run: dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests.csproj -m:1 --logger trx --results-directory TestResults/web4
      - name: Shared SDK, durable outbox and HTTP lifecycle
        run: dotnet test "OASIS Architecture/NextGenSoftware.OASIS.API.Core/Tests/SubscriptionUsage/SubscriptionUsage.Tests.csproj" -m:1 --logger trx --results-directory TestResults/sdk
      - name: Independent provider and Stripe reconciliation
        run: dotnet test ONODE/SubscriptionReconciliation.Tests/SubscriptionReconciliation.Tests.csproj -m:1 --logger trx --results-directory TestResults/reconciliation
      - name: WEB6 provider measurement and bounds
        run: dotnet run --project WEB6/NextGenSoftware.OASIS.Web6.UsageProtocol.Tests/NextGenSoftware.OASIS.Web6.UsageProtocol.Tests.csproj
      - name: WEB6 provider recovery and failure injection
        run: dotnet run --project WEB6/NextGenSoftware.OASIS.Web6.UsageRecovery.Tests/NextGenSoftware.OASIS.Web6.UsageRecovery.Tests.csproj
      - name: WEB5 and WEB7-WEB10 transport policy integration
        run: dotnet test Tests/SubscriptionServiceAdapters/SubscriptionServiceAdapters.csproj -m:1 --logger trx --results-directory TestResults/services
      - name: Live runner transport security
        run: python3 -m unittest discover -s Scripts -p test_subscription_usage_live_runner.py
      - name: Signer builds
        run: dotnet build Scripts/SubscriptionLedger.Migration/SubscriptionLedger.Migration.csproj -c Release
      - name: Private operator authentication and audited requeue
        run: dotnet test Scripts/SubscriptionLedger.OutboxAdmin.Tests/SubscriptionLedger.OutboxAdmin.Tests.csproj -m:1 --logger trx --results-directory TestResults/operator
      - name: Private operator publish
        run: dotnet publish Scripts/SubscriptionLedger.OutboxAdmin/SubscriptionLedger.OutboxAdmin.csproj -c Release -m:1
      - name: Publish the exact WEB4-WEB10 source graph
        shell: bash
        run: |
          set -euo pipefail
          dna='OASIS Architecture/NextGenSoftware.OASIS.API.DNA/OASIS_DNA.json'
          if [ ! -f "$dna" ]; then cp 'OASIS Architecture/NextGenSoftware.OASIS.API.DNA/Default/OASIS_DNA.json' "$dna"; fi
          star_dna='STAR ODK/NextGenSoftware.OASIS.STAR.STARDNA/DNA/OASIS_DNA.json'
          if [ ! -f "$star_dna" ]; then mkdir -p "$(dirname "$star_dna")"; cp "$dna" "$star_dna"; fi
          projects=(
            'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj'
            'STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI/NextGenSoftware.OASIS.STAR.WebAPI.csproj'
            'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj'
            'WEB7/NextGenSoftware.OASIS.Web7.WebAPI/NextGenSoftware.OASIS.Web7.WebAPI.csproj'
            'WEB8/NextGenSoftware.OASIS.Web8.WebAPI/NextGenSoftware.OASIS.Web8.WebAPI.csproj'
            'WEB9/NextGenSoftware.OASIS.Web9.WebAPI/NextGenSoftware.OASIS.Web9.WebAPI.csproj'
            'WEB10/NextGenSoftware.OASIS.Web10.WebAPI/NextGenSoftware.OASIS.Web10.WebAPI.csproj'
          )
          for project in "${projects[@]}"; do
            dotnet publish "$project" -c Release -m:1 /p:UseAppHost=false
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-protocol-test-results
          path: TestResults
      - name: Stop temporary database
        if: always()
        run: docker rm --force usage-mongo
