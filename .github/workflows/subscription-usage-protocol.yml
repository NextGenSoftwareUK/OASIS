name: Only remaining free-profile admission startup controls
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Qualify only remaining mixed HTTP and free-profile admission controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults/MixedAuthorityUnit | Out-Null
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner mixed-authority-unit-ci -Operation {
            if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact source mismatch.' }
            python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
            if ($LASTEXITCODE) { throw 'Pinned source graph mismatch.' }
            dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~ShippedFreeProfilePassesStartupAndRealAuthorityMeterValidation' --logger 'trx;LogFileName=mixed-authority-admission.trx' --results-directory TestResults/MixedAuthorityUnit
            if ($LASTEXITCODE) { throw 'Shipped free-plan CQL attempt admission failed.' }
            [xml]$admission = Get-Content TestResults/MixedAuthorityUnit/mixed-authority-admission.trx
            $counts = $admission.TestRun.ResultSummary.Counters
            if ([int]$counts.total -ne 10 -or [int]$counts.passed -ne 10 -or [int]$counts.notExecuted -ne 0) {
              throw 'Exactly ten shipped route admission controls must pass.'
            }
            @{
              source = $env:GITHUB_SHA
              retainedNativeRun = 44665067465
              retainedNativeCases = 9
              retainedMixedUnitRun = 44668404772
              retainedMixedUnitCases = 69
              admissionRows = 10
              databaseContainersStarted = 0
              sharedAtlasOperations = 0
            } | ConvertTo-Json | Set-Content TestResults/MixedAuthorityUnit/qualification.json
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mixed-authority-admission
          path: TestResults/MixedAuthorityUnit
