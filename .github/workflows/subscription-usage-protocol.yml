name: Access log acknowledgement lifecycle regression
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Start isolated replica set with fault injection
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name usage-mongo -p 27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all --setParameter enableTestCommands=1
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec usage-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Qualify only new lifecycle controls and the failed native case
        shell: pwsh
        run: |
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner access-log-shutdown-ci -Operation {
            python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
            if ($LASTEXITCODE) { throw 'Pinned source graph mismatch.' }
            dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests.csproj /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~AccessLogTests.StopBeforeWorkerStartDrainsAcceptedEventsExactlyOnce|FullyQualifiedName~AccessLogTests.StopWithoutAcceptedEventsNeverTouchesStore|FullyQualifiedName~AccessLogTests.CancelledShutdownLeavesAcceptedQueueForExplicitDrain|FullyQualifiedName~AccessLogShutdownAcknowledgementTests.PeriodicWriteAcknowledgementUsesShutdownBudgetInsteadOfTimerCancellation' --logger 'trx;LogFileName=shutdown-unit.trx' --results-directory TestResults/AccessLogShutdown
            if ($LASTEXITCODE) { throw 'Access-log lifecycle controls failed.' }
            [xml]$unit = Get-Content TestResults/AccessLogShutdown/shutdown-unit.trx
            $counts = $unit.TestRun.ResultSummary.Counters
            if ([int]$counts.total -ne 5 -or [int]$counts.passed -ne 5 -or [int]$counts.notExecuted -ne 0) {
              throw 'Exactly five changed/new lifecycle controls must pass.'
            }
            dotnet test ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~AccessLogDrainNativeTests&DisplayName~shutdownDrain: False' --logger 'trx;LogFileName=shutdown-native.trx' --results-directory TestResults/AccessLogShutdown
            if ($LASTEXITCODE) { throw 'Previously failed native shutdown case failed.' }
            [xml]$native = Get-Content TestResults/AccessLogShutdown/shutdown-native.trx
            $counts = $native.TestRun.ResultSummary.Counters
            $results = @($native.TestRun.Results.UnitTestResult)
            if ([int]$counts.total -ne 2 -or [int]$counts.passed -ne 2 -or [int]$counts.notExecuted -ne 0 -or
                $results.Count -ne 2 -or
                @($results | Where-Object { $_.testName -like '*appOptIn: True, shutdownDrain: False*' }).Count -ne 1 -or
                @($results | Where-Object { $_.testName -like '*appOptIn: False, shutdownDrain: False*' }).Count -ne 1) {
              throw 'Exactly the failed app case and affected global periodic case must pass.'
            }
            @{
              newUnitControls = 2
              affectedExistingUnitControls = 3
              previouslyFailedNativeCases = 1
              affectedPreviouslyPassedNativeCases = 1
              previouslyPassedUnchangedProtocolCasesRetained = 152
              source = $env:GITHUB_SHA
              sharedAtlasOperations = 0
            } | ConvertTo-Json | Set-Content TestResults/AccessLogShutdown/qualification.json
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: access-log-shutdown
          path: TestResults/AccessLogShutdown
      - name: Remove owned CI MongoDB
        if: always()
        run: docker rm --force --volumes usage-mongo
