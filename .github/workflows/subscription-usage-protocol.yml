name: Neo grouped shared normalization and native profile
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify exact source and pinned sibling dependencies
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Execute only the new real Neo performance diagnostic
        shell: pwsh
        run: |
          $env:OASIS_CQL_NEO_ENTITY_PROJECTION_ROOT = (Get-Location).Path
          $env:OASIS_CQL_MONGO_ENTITY_PROJECTION_ROOT = (Get-Location).Path
          New-Item -ItemType Directory -Force TestResults/Neo4jCurrent | Out-Null
          docker run -d --name cql-neo-single-profile -p 127.0.0.1:17687:7687 -e NEO4J_AUTH=neo4j/oasis-local-test-only neo4j:5.26.12
          if ($LASTEXITCODE) { throw 'Owned Neo profile fixture did not start.' }
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              docker exec cql-neo-single-profile cypher-shell -u neo4j -p oasis-local-test-only 'RETURN 1' 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
            if (!$ready) { throw 'Owned Neo profile fixture not ready.' }
            & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-neo-single-profile-ci -Operation {
              dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~NeoSingleGroupedDistinctColdWarmAndServerProfile' --logger 'trx;LogFileName=neo-single-profile.trx' --results-directory TestResults/Neo4jCurrent
              if ($LASTEXITCODE) { throw 'New native Neo profile diagnostic failed.' }
              [xml]$trx = Get-Content TestResults/Neo4jCurrent/neo-single-profile.trx
              $counts = $trx.TestRun.ResultSummary.Counters
              $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
              if ([int]$counts.total -ne 1 -or [int]$counts.passed -ne 1 -or [int]$counts.notExecuted -ne 0 -or
                  $definitions.Count -ne 1 -or $definitions[0].TestMethod.name -ne 'NeoSingleGroupedDistinctColdWarmAndServerProfile') {
                throw 'Exactly one new diagnostic case must pass.'
              }
              $report = Get-Content TestResults/Neo4jCurrent/Neo4jOASIS-grouped-distinct-single-profile.json -Raw | ConvertFrom-Json
              if ($report.provider -ne 'Neo4jOASIS' -or $report.checks -ne 3 -or $report.successfulHolonWrites -ne 5 -or
                  !$report.nativeProviderVerified -or !$report.identicalIntentVerified -or !$report.coldWarmResultsVerified -or
                  !$report.serverProfileVerified -or !$report.exactCleanupVerified -or $report.profileUpdates -ne $false -or
                  $report.queryUtf8Bytes -le 0 -or $report.parameterCount -le 0 -or $report.querySha256 -notmatch '^[a-f0-9]{64}$' -or
                  $report.compileTimingPhase -ne 'after-three-provider-queries' -or $report.compileMilliseconds -lt 0 -or
                  $report.serverAvailableMilliseconds -lt 0 -or $report.serverConsumedMilliseconds -lt 0 -or
                  @($report.queryElapsedMilliseconds.PSObject.Properties).Count -ne 3 -or
                  @($report.queryElapsedMilliseconds.PSObject.Properties | Where-Object { $_.Value -lt 0 }).Count -or
                  @($report.operators).Count -lt 1 -or @($report.operators).Count -gt 4096) {
                throw 'Require actual cold/warm/profile/zero-update/source-cleanup evidence.'
              }
              if ($report.queryUtf8Bytes -ge 16000) { throw 'Typed input normalization did not remove the repeated query expansion.' }
              # A separate process preserves the profile case's first-use client lifecycle.
              dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests --no-build --no-restore /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~NeoGroupedSharedInputsPreserveIndependentReducersAndPaths' --logger 'trx;LogFileName=neo-shared-inputs.trx' --results-directory TestResults/Neo4jCurrent
              if ($LASTEXITCODE) { throw 'New native independent-reducer/path control failed.' }
              [xml]$shared = Get-Content TestResults/Neo4jCurrent/neo-shared-inputs.trx
              $counts = $shared.TestRun.ResultSummary.Counters
              $definitions = @($shared.TestRun.TestDefinitions.UnitTest)
              if ([int]$counts.total -ne 1 -or [int]$counts.passed -ne 1 -or [int]$counts.notExecuted -ne 0 -or
                  $definitions.Count -ne 1 -or $definitions[0].TestMethod.name -ne 'NeoGroupedSharedInputsPreserveIndependentReducersAndPaths') {
                throw 'Exactly one new independent-reducer/path control must pass.'
              }
              $sharedReport = Get-Content TestResults/Neo4jCurrent/Neo4jOASIS-grouped-shared-inputs.json -Raw | ConvertFrom-Json
              if ($sharedReport.provider -ne 'Neo4jOASIS' -or $sharedReport.checks -ne 2 -or $sharedReport.successfulHolonWrites -ne 4 -or
                  !$sharedReport.nativeProviderVerified -or !$sharedReport.independentReducersVerified -or
                  !$sharedReport.canonicalMetadataSeparatedVerified -or !$sharedReport.ordinalMetadataPathsVerified -or
                  !$sharedReport.nullableRequiredSeparatedVerified -or !$sharedReport.offPageInvalidRefused -or !$sharedReport.exactCleanupVerified) {
                throw 'New native semantic/path/nullability/cleanup evidence is incomplete.'
              }
            }
          } finally {
            docker rm -f -v cql-neo-single-profile
            if ($LASTEXITCODE) { throw 'Owned Neo profile container cleanup failed.' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neo-single-profile
          path: |
            TestResults/Neo4jCurrent/neo-single-profile.trx
            TestResults/Neo4jCurrent/Neo4jOASIS-grouped-distinct-single-profile.json
            TestResults/Neo4jCurrent/neo-shared-inputs.trx
            TestResults/Neo4jCurrent/Neo4jOASIS-grouped-shared-inputs.json
