name: CQL grouped distinct Ask review qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
      website_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/Web4Site
          ref: ${{ inputs.website_ref }}
          persist-credentials: false
      - name: Verify exact website source
        shell: bash
        env:
          WEBSITE_REF: ${{ inputs.website_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WEBSITE_REF"
          test "$WEBSITE_REF" = "485cb86edafb82531449a50f02e8e26f3a18ef8f"
          node --version
      - name: Verify only new grouped distinct Ask review controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          node --test --test-name-pattern='^grouped distinct WEB6' --test-reporter=junit cql-ask.test.cjs > TestResults/grouped-distinct-ask.xml
          python3 -B - <<'PY'
          import xml.etree.ElementTree as E,json
          root=E.parse('TestResults/grouped-distinct-ask.xml').getroot()
          allcases=list(root.iter('testcase'))
          cases=[case for case in allcases if case.attrib['name'].startswith('grouped distinct WEB6 ')]
          expected={'grouped distinct WEB6 draft retains both counts and requires review before explicit execution',
            'grouped distinct WEB6 rejects unproved normalized domains before editor or execution'}
          assert {case.attrib['name'] for case in cases}==expected
          assert len(cases)==2
          assert all(case.find('failure') is None and case.find('error') is None and case.find('skipped') is None for case in cases)
          others=[case for case in allcases if case not in cases]
          assert all(case.find('skipped') is not None for case in others)
          report={'website':'485cb86edafb82531449a50f02e8e26f3a18ef8f','newCases':2,'passed':2,'failed':0,'selectedSkipped':0,
            'unrelatedSkipped':len(others),'modelMockOnly':True,'nativeAcceptance':False}
          with open('TestResults/grouped-distinct-ask-acceptance.json','w') as out:json.dump(report,out)
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grouped-distinct-ask-results
          path: TestResults/grouped-distinct-ask*
