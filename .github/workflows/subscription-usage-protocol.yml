name: Subscription usage protocol
on:
  pull_request:
    branches: [Development, master]
  push:
    branches: [Development]
  workflow_dispatch:
    inputs:
      mongo_sqlite_point_reads:
        description: Run only the selected native MongoDB or SQLite storage check
        type: boolean
        default: false
      mongo_point_read_case:
        description: Focused test selected with the native storage runner
        type: choice
        options: [round_robin, parent_read_authority, legacy_soft_delete, legacy_child_writes, replicated_file_upload, admin_analytics, admin_analytics_payload, admin_pagination]
        default: round_robin
      mongo_sqlite_latency:
        description: Measure real MongoDB, SQLite and request-scoped HyperDrive latency only
        type: boolean
        default: false
      mongo_sqlite_karma:
        description: Verify native read-only karma on MongoDB and SQLite
        type: boolean
        default: false
      sqlite_map_visits:
        description: Verify map visit persistence and avatar scoping against native SQLite
        type: boolean
        default: false
      sqlite_metadata_only:
        description: Verify the native SQLite metadata selector and its materialization cost
        type: boolean
        default: false
      sqlite_performance_case:
        description: Focused case selected when sqlite_metadata_only is enabled
        type: choice
        options: [metadata, wallet_summary, message_summary, gift_summary, gift_lifecycle, summary_http, message_summary_http, gift_summary_http, shallow_contract, nft_request, checkout_scope, checkout_return, catalog_price_cache, subscription_usage_snapshot, avatar_nft_storage]
        default: metadata
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
      OASIS_OWNED_RECOVERY_REPLICA_URI: mongodb://127.0.0.1:27029/?directConnection=true&serverSelectionTimeoutMS=2000
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Start isolated replica set with fault injection
        if: ${{ !inputs.sqlite_metadata_only }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name usage-mongo -p 27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all --setParameter enableTestCommands=1
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec usage-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 60); do
            if docker exec usage-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify selected native MongoDB or SQLite storage case
        if: inputs.mongo_sqlite_point_reads || inputs.mongo_sqlite_latency || inputs.mongo_sqlite_karma
        env:
          MONGO_POINT_READ_CASE: ${{ inputs.mongo_point_read_case }}
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-MongoSqlitePointReads -Operation {
            $project = 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.HyperDrive.IntegrationTests'
            $filter = if ('${{ inputs.mongo_sqlite_karma }}' -eq 'true') {
              'FullyQualifiedName~ColdKarmaReadDoesNotPersistSettings'
            } elseif ('${{ inputs.mongo_sqlite_latency }}' -eq 'true') {
              'FullyQualifiedName~ProfileNativeMongoSqlitePointReadLatency'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'legacy_child_writes') {
              'FullyQualifiedName~TypedLegacyWritesRetainEmbeddedChildren|FullyQualifiedName~FileMetadataUpdateRetainsEmbeddedChildren'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'legacy_soft_delete') {
              'FullyQualifiedName~LegacySoftDeleteRetainsEmbeddedChildren'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'replicated_file_upload') {
              'FullyQualifiedName~UploadedFileCanBeReadFromNativeMongoAndSqlite'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'parent_read_authority') {
              'FullyQualifiedName~ParentReadsUseTheWholeAuthoritativeCollectionWhenReplicaHasOneChild'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'admin_pagination') {
              $project = 'ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj'
              'FullyQualifiedName~AdministrativePagesRetainEveryEqualTimestampRecord'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'admin_analytics') {
              $project = 'ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj'
              'FullyQualifiedName~AdminAnalyticsAggregatesNativeBillingAndUsageGroups'
            } elseif ($env:MONGO_POINT_READ_CASE -eq 'admin_analytics_payload') {
              $project = 'ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj'
              'FullyQualifiedName~AdminAnalyticsReturnsGroupsInsteadOfNativeLedgerRows'
            } else {
              'FullyQualifiedName~ScopedRoundRobinPointReadsUseBothNativeStores'
            }
            dotnet test $project --filter $filter --logger 'console;verbosity=detailed' /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw 'Native MongoDB and SQLite routing verification failed.' }
          }
      - name: Verify durable map visits against native SQLite
        if: inputs.sqlite_map_visits
        env:
          OASIS_NATIVE_MAP_VISITS: owned-ci
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-NativeMapVisits -Operation {
            dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests --filter 'FullyQualifiedName~NativeMapVisitSurvivesNewManagersAndKeepsAvatarHistoryPrivate' --logger 'console;verbosity=detailed' /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw 'Native map visit verification failed.' }
          }
      - name: Verify selected dashboard performance case
        if: inputs.sqlite_metadata_only
        env:
          SQLITE_PERFORMANCE_CASE: ${{ inputs.sqlite_performance_case }}
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-SqliteMetadata -Operation {
            if ($env:SQLITE_PERFORMANCE_CASE -in "summary_http", "message_summary_http", "gift_summary_http", "shallow_contract", "nft_request", "checkout_scope", "checkout_return", "catalog_price_cache", "subscription_usage_snapshot", "avatar_nft_storage") {
              $project = "ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests"
              $test = switch ($env:SQLITE_PERFORMANCE_CASE) { "message_summary_http" { "DashboardMessageSummaryRejectsAnonymousHttpRequests" } "gift_summary_http" { "DashboardGiftSummaryRejectsAnonymousHttpRequests" } "shallow_contract" { "Web4ShallowReadContractTests" } "nft_request" { "RejectsUnboundOrAmbiguousNftTransfers" } "checkout_scope" { "SignedCheckoutFromAnotherLedgerDoesNotTouchBilling" } "checkout_return" { "CheckoutSuccessUrlPreservesTheReturnQueryAndFragment" } "catalog_price_cache" { "StripeCatalogCoalescesPriceReadsAndRefreshesOnExpiryOrConfigurationChange" } "subscription_usage_snapshot" { "SubscriptionControllerTests.GetUsage_" } "avatar_nft_storage" { "NativeAvatarNftReadsMatchAcrossSyncAndAsync" } default { "DashboardSummaryRoutesRejectAnonymousHttpRequests" } }
            } else {
              $project = "OASIS Architecture/NextGenSoftware.OASIS.API.Core.HyperDrive.IntegrationTests"
              $test = switch ($env:SQLITE_PERFORMANCE_CASE) { "wallet_summary" { "ReadsWalletSummaryFromNativeSqlite" } "message_summary" { "CountsAllMessagesAndOnlyUnreadIncomingMessages" } "gift_summary" { "CountsDurableInboxAndUnopenedGifts" } "gift_lifecycle" { "SendsReceivesAndOpensGiftsAgainstNativeSqlite" } default { "NativeSqliteFiltersMetadataBeforeHolonMapping" } }
            }
            dotnet test $project --filter "FullyQualifiedName~$test" --logger 'console;verbosity=detailed' /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw 'Dashboard performance verification failed.' }
          }
      - name: Validate sole authority and pinned source graph
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: |
          python3 Scripts/validate_web4_subscription_authority.py
          python3 Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          python3 Scripts/validate_subscription_rollout_gate.py
          pwsh -File Scripts/validate_web6_web4_metering_cutover.ps1
      - name: Build WEB4 for compiled-controller protocol tests
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj -c Debug -m:1
      - name: WEB4 transactions, ownership, migration and failure injection
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test ONODE/Tests/SubscriptionLedger.ProtocolTests/SubscriptionLedger.ProtocolTests.csproj -m:1 --logger trx --results-directory TestResults/authority
      - name: WEB4 application unit tests
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests/NextGenSoftware.OASIS.API.ONODE.WebAPI.UnitTests.csproj -m:1 --filter "Category!=LocalMongoSoak" --logger trx --results-directory TestResults/web4
      - name: Shared SDK, durable outbox and HTTP lifecycle
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test "OASIS Architecture/NextGenSoftware.OASIS.API.Core/Tests/SubscriptionUsage/SubscriptionUsage.Tests.csproj" -m:1 --logger trx --results-directory TestResults/sdk
      - name: Independent provider and Stripe reconciliation
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test ONODE/SubscriptionReconciliation.Tests/SubscriptionReconciliation.Tests.csproj -m:1 --logger trx --results-directory TestResults/reconciliation
      - name: WEB6 provider measurement and bounds
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet run --project WEB6/NextGenSoftware.OASIS.Web6.UsageProtocol.Tests/NextGenSoftware.OASIS.Web6.UsageProtocol.Tests.csproj
      - name: WEB6 provider recovery and failure injection
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet run --project WEB6/NextGenSoftware.OASIS.Web6.UsageRecovery.Tests/NextGenSoftware.OASIS.Web6.UsageRecovery.Tests.csproj
      - name: WEB5 and WEB7-WEB10 transport policy integration
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test Tests/SubscriptionServiceAdapters/SubscriptionServiceAdapters.csproj -m:1 --logger trx --results-directory TestResults/services
      - name: Live runner transport security
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: python3 -m unittest discover -s Scripts -p test_subscription_usage_live_runner.py
      - name: Signer builds
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet build Scripts/SubscriptionLedger.Migration/SubscriptionLedger.Migration.csproj -c Release
      - name: Private operator authentication and audited requeue
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet test Scripts/SubscriptionLedger.OutboxAdmin.Tests/SubscriptionLedger.OutboxAdmin.Tests.csproj -m:1 --logger trx --results-directory TestResults/operator
      - name: Private operator publish
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        run: dotnet publish Scripts/SubscriptionLedger.OutboxAdmin/SubscriptionLedger.OutboxAdmin.csproj -c Release -m:1
      - name: Publish the exact WEB4-WEB10 source graph
        if: ${{ !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        shell: bash
        run: |
          set -euo pipefail
          dna='OASIS Architecture/NextGenSoftware.OASIS.API.DNA/OASIS_DNA.json'
          if [ ! -f "$dna" ]; then cp 'OASIS Architecture/NextGenSoftware.OASIS.API.DNA/Default/OASIS_DNA.json' "$dna"; fi
          star_dna='STAR ODK/NextGenSoftware.OASIS.STAR.STARDNA/DNA/OASIS_DNA.json'
          if [ ! -f "$star_dna" ]; then mkdir -p "$(dirname "$star_dna")"; cp "$dna" "$star_dna"; fi
          projects=(
            'ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI/NextGenSoftware.OASIS.API.ONODE.WebAPI.csproj'
            'STAR ODK/NextGenSoftware.OASIS.STAR.WebAPI/NextGenSoftware.OASIS.STAR.WebAPI.csproj'
            'WEB6/NextGenSoftware.OASIS.Web6.WebAPI/NextGenSoftware.OASIS.Web6.WebAPI.csproj'
            'WEB7/NextGenSoftware.OASIS.Web7.WebAPI/NextGenSoftware.OASIS.Web7.WebAPI.csproj'
            'WEB8/NextGenSoftware.OASIS.Web8.WebAPI/NextGenSoftware.OASIS.Web8.WebAPI.csproj'
            'WEB9/NextGenSoftware.OASIS.Web9.WebAPI/NextGenSoftware.OASIS.Web9.WebAPI.csproj'
            'WEB10/NextGenSoftware.OASIS.Web10.WebAPI/NextGenSoftware.OASIS.Web10.WebAPI.csproj'
          )
          for project in "${projects[@]}"; do
            dotnet publish "$project" -c Release -m:1 /p:UseAppHost=false
          done
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !inputs.mongo_sqlite_point_reads && !inputs.mongo_sqlite_latency && !inputs.mongo_sqlite_karma && !inputs.sqlite_map_visits && !inputs.sqlite_metadata_only }}
        with:
          name: subscription-protocol-test-results
          path: TestResults
      - name: Stop temporary database
        if: always()
        run: docker rm --force --volumes usage-mongo
