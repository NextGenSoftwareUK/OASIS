name: GUID grouped JSON wire controls
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Checkout exact sibling dependencies
        shell: bash
        run: |
          set -euo pipefail
          . Docker/oasis-dependency-versions.env
          git clone --no-checkout "$LIBRARIES_REPO" ../NextGenSoftware-Libraries
          git -C ../NextGenSoftware-Libraries checkout --detach "$LIBRARIES_COMMIT"
          git clone --no-checkout "$HOLOCHAIN_REPO" ../holochain-client-csharp
          git -C ../holochain-client-csharp checkout --detach "$HOLOCHAIN_COMMIT"
      - name: Build real WEB4 dependency and execute only four new GUID wire cases
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact source mismatch.' }
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          if ($LASTEXITCODE) { throw 'Pinned dependency mismatch.' }
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner guid-grouped-wire-ci -Operation {
            dotnet test 'OASIS Architecture/NextGenSoftware.OASIS.API.Core.UnitTests' /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~CqlGroupedGuidV1CompilerTests' --logger 'trx;LogFileName=guid-wire.trx' --results-directory TestResults/GuidWire
            if ($LASTEXITCODE) { throw 'New GUID JSON/compiler cases failed.' }
            [xml]$trx = Get-Content TestResults/GuidWire/guid-wire.trx
            $counts = $trx.TestRun.ResultSummary.Counters
            if ([int]$counts.total -ne 4 -or [int]$counts.passed -ne 4 -or [int]$counts.notExecuted -ne 0) {
              throw 'Exactly four new GUID wire cases must pass.'
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guid-wire
          path: TestResults/GuidWire/guid-wire.trx
