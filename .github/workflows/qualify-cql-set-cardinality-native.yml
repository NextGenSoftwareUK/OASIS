name: Qualify native set counts without row publication caps

on:
  push:
    branches: [work/gpt-q50]
    paths:
      - "Providers/Storage/NextGenSoftware.OASIS.API.Providers.MongoOASIS/MongoCqlTranslator.Set.cs"
      - "Providers/Storage/NextGenSoftware.OASIS.API.Providers.MongoOASIS/MongoCqlTranslator.EntityComposition.cs"
      - "Providers/Storage/NextGenSoftware.OASIS.API.Providers.MongoOASIS/MongoCqlTranslator.SetCount.cs"
      - "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests/CqlV1Web4NativeTests.SetPublicationCounts.cs"
      - "Scripts/TestHosts/qualify_cosmic_set_publication_native.py"
      - ".github/workflows/qualify-cql-set-cardinality-native.yml"
      - "Docker/oasis-dependency-versions.env"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    services:
      neo4j:
        image: neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
        env:
          NEO4J_AUTH: neo4j/oasis-local-test-only
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p oasis-local-test-only 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start one owned loopback Mongo replica
        working-directory: OASIS
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cql-where-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify portable build lease
        working-directory: OASIS
        shell: bash
        run: python3 -B Scripts/TestHosts/test_provider_build_lease_python.py
      - name: Verify native set count semantics and build WEB4
        working-directory: OASIS
        shell: bash
        run: python3 -B Scripts/TestHosts/invoke_provider_build_lease.py --owner gpt-cosmic-q50 -- python3 -B Scripts/TestHosts/qualify_cosmic_set_publication_native.py
      - name: Stop owned Mongo
        if: always()
        run: docker rm -f -v cql-where-mongo
      - name: Verify owned Mongo stopped
        if: always()
        shell: bash
        run: |
          if docker inspect cql-where-mongo >/dev/null 2>&1; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-set-publication-count-native
          path: |
            OASIS/TestResults/Neo4jCurrent/set-publication-count-native.trx
            OASIS/TestResults/Neo4jCurrent/*-set-publication-count-native.json
            OASIS/TestResults/Neo4jCurrent/source.json
          if-no-files-found: ignore
          retention-days: 2
