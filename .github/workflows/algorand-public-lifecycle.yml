name: Algorand public lifecycle

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/algorand-public-lifecycle.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS.IntegrationTests/AlgorandPublicLifecycleTests.cs'
  workflow_dispatch:
    inputs:
      signed_localnet:
        description: Verify a signed payment on disposable authenticated LocalNet
        type: boolean
        default: false
      localnet_case:
        description: Focused signed LocalNet verification
        type: choice
        options: [batch, indexed_search]
        default: batch
      public_case:
        description: Focused public Indexer verification
        type: choice
        options: [asset_note_metadata, compact_account, participant_metadata, transaction_metadata, account_history, transaction_timestamp]
        default: account_history

permissions:
  contents: read

jobs:
  public-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify shipping Indexer queries against Algorand mainnet
        if: ${{ !inputs.signed_localnet }}
        env:
          ALGORAND_PUBLIC_CASE: ${{ inputs.public_case || 'transaction_timestamp' }}
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-AlgorandPublicLifecycle -Operation {
            $test = switch ($env:ALGORAND_PUBLIC_CASE) {
              'transaction_timestamp' { 'PublicIndexerPreservesNativeTransactionTimestamp' }
              'asset_note_metadata' { 'PublicIndexerMatchesAssetIdAndExactNoteMetadata' }
              'transaction_metadata' { 'PublicIndexerQueriesTransactionMetadataUsingNativeFilters' }
              'participant_metadata' { 'PublicIndexerMatchesExactTransactionParticipants' }
              'compact_account' { 'PublicAlgodLifecycleAndAccountRead' }
              default { 'PublicIndexerPaginatesAccountHistoryAndRejectsInvalidAddress' }
            }
            dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS.IntegrationTests" --filter "FullyQualifiedName~$test" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { throw "Algorand public lifecycle verification failed." }
          }
      - uses: actions/setup-python@v5
        if: inputs.signed_localnet
        with:
          python-version: '3.12'
      - name: Verify signed payment with authenticated Algorand LocalNet
        if: inputs.signed_localnet
        env:
          ALGORAND_LOCALNET_CASE: ${{ inputs.localnet_case }}
        shell: bash
        run: |
          set -euo pipefail
          owned=$(mktemp -d "${RUNNER_TEMP}/oasis-algorand.XXXXXX")
          cleanup() {
            status=$?
            trap - EXIT
            compose="$owned/localnet/sandbox/docker-compose.yml"
            project_label="com.docker.compose.project=algokit_sandbox"
            if [[ -f "$compose" ]]; then
              docker compose -f "$compose" down --volumes --remove-orphans || status=1
            fi
            containers=$(docker ps -aq --filter "label=$project_label") || status=1
            networks=$(docker network ls -q --filter "label=$project_label") || status=1
            volumes=$(docker volume ls -q --filter "label=$project_label") || status=1
            if [[ -n "$containers$networks$volumes" ]]; then
              echo "Owned Algorand LocalNet resources remain after teardown." >&2
              status=1
            fi
            rm -rf -- "$owned" || status=1
            if [[ "$status" == 0 ]]; then
              echo "Verified removal of the LocalNet containers, network, volumes and fixture directory."
            fi
            exit "$status"
          }
          trap cleanup EXIT
          python -m venv "$owned/venv"
          "$owned/venv/bin/pip" install --no-cache-dir algokit==2.10.2 py-algorand-sdk==2.12.0
          mkdir "$owned/localnet"
          "$owned/venv/bin/algokit" localnet start --config-dir "$owned/localnet"
          fixture_env="$owned/fixture.env"
          GITHUB_ENV="$fixture_env" "$owned/venv/bin/python" Scripts/TestHosts/Prepare-AlgorandLocalNetFixture.py
          set -a
          source "$fixture_env"
          set +a
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-AlgorandSignedLocalNet -Operation {
              $test = if ($env:ALGORAND_LOCALNET_CASE -eq "indexed_search") { "FindsSignedPaymentNoteOnNativeIndexer" } else { "PreservesPartialBatchReceiptsOnAuthenticatedLocalNet" }
              dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AlgorandOASIS.IntegrationTests" --filter "FullyQualifiedName~$test" /m:2 /nr:false /p:UseSharedCompilation=false
              if ($LASTEXITCODE -ne 0) { throw "Native Algorand signed payment failed." }
            }'
