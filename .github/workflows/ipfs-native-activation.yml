name: IPFS native persistence

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/ipfs-native-activation.yml'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.IPFSOASIS/**'
      - 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.IPFSOASIS.IntegrationTests/**'
  workflow_dispatch:
    inputs:
      scenario:
        description: Native persistence scenario
        type: choice
        options: [independent, concurrent, restart]
        default: independent

permissions:
  contents: read

jobs:
  kubo:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Resolve the recorded Libraries revision
        id: dependencies
        shell: pwsh
        run: |
          $entries = @(Get-Content Docker/oasis-dependency-versions.env | Where-Object { $_ -match '^LIBRARIES_COMMIT=' })
          if ($entries.Count -ne 1 -or $entries[0] -notmatch '^LIBRARIES_COMMIT=([a-f0-9]{40})$') {
            throw 'Expected one valid Libraries dependency revision.'
          }
          "libraries=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify persistence through the shipping provider on offline Kubo
        shell: pwsh
        env:
          IPFS_TEST_SCENARIO: ${{ inputs.scenario || 'independent' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixture = Join-Path $env:RUNNER_TEMP 'oasis-ipfs-activation'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $archive = Join-Path $fixture 'kubo.zip'
          Invoke-WebRequest -Uri 'https://github.com/ipfs/kubo/releases/download/v0.43.1/kubo_v0.43.1_windows-amd64.zip' -OutFile $archive -TimeoutSec 90
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'C25871516DEC4D97CE1D160A26C1E3FDAD294CB0EEA065C0C0343BCFCA86C524') {
            throw 'The Kubo release archive does not match its pinned digest.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $fixture
          $binary = Join-Path $fixture 'kubo/ipfs.exe'
          $env:IPFS_PATH = Join-Path $fixture 'repo'
          $env:IPFSOASIS_TEST_API = 'http://127.0.0.1:18567'
          $env:IPFSOASIS_RESTART_DNA = Join-Path $fixture 'restart-dna.json'
          $env:IPFSOASIS_CONCURRENT_DNA = Join-Path $fixture 'concurrent-dna.json'
          $env:OASIS_IPFS_STORAGE_ENCRYPTION_KEY = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $rpc = @{ NoProxy = $true; UserAgent = 'OASIS-IPFS-NativeTests/1.0'; Method = 'Post' }
          & $binary init --profile=test --empty-repo
          & $binary config Addresses.API /ip4/127.0.0.1/tcp/18567
          & $binary config Addresses.Gateway /ip4/127.0.0.1/tcp/18568
          function Wait-KuboReady($daemon, $errorLog) {
            $version = $null
            for ($attempt = 0; $attempt -lt 30 -and !$version; $attempt++) {
              if ($daemon.HasExited) {
                Get-Content -LiteralPath $errorLog
                throw 'The owned Kubo daemon exited before readiness.'
              }
              try {
                $version = Invoke-RestMethod @rpc -Uri "$env:IPFSOASIS_TEST_API/api/v0/version" -TimeoutSec 2
              } catch [System.Net.Http.HttpRequestException], [System.Threading.Tasks.TaskCanceledException] {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($version.Version -ne '0.43.1') { throw 'The pinned daemon did not become ready.' }
            Write-Host "Native Kubo version $($version.Version), process $($daemon.Id)"
          }
          function Stop-KuboDaemon($daemon) {
            if (!$daemon.HasExited) {
              try {
                Invoke-RestMethod @rpc -Uri "$env:IPFSOASIS_TEST_API/api/v0/shutdown" -TimeoutSec 5 | Out-Null
                if (!$daemon.WaitForExit(10000)) { throw 'The Kubo daemon did not stop.' }
              } finally {
                if (!$daemon.HasExited) { Stop-Process -Id $daemon.Id }
              }
            }
          }
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner 'CI-IpfsPersistence' -Operation {
            $project = 'Providers/Network/TestProjects/NextGenSoftware.OASIS.API.Providers.IPFSOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.IPFSOASIS.IntegrationTests.csproj'
            if ($env:IPFS_TEST_SCENARIO -eq 'restart') {
              $testFilter = 'FullyQualifiedName~PersistsCurrentAndHistoricalHolonAcrossDaemonRestart'
              $phases = @('write', 'read')
            } elseif ($env:IPFS_TEST_SCENARIO -eq 'concurrent') {
              $testFilter = 'FullyQualifiedName~ConcurrentAcknowledgedSavesRemainVisibleFromPersistedCatalogue'
              $phases = @('concurrent')
            } else {
              $testFilter = 'FullyQualifiedName~IndependentWritersPreserveEveryAcknowledgedRecord'
              $phases = @('independent')
            }
            foreach ($phase in $phases) {
              $env:IPFSOASIS_RESTART_PHASE = $phase
              $errorLog = Join-Path $fixture "$phase.err"
              $daemon = Start-Process -FilePath $binary -ArgumentList @('daemon', '--offline') -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $fixture "$phase.log") -RedirectStandardError $errorLog
              try {
                Wait-KuboReady $daemon $errorLog
                $buildOptions = @('/m:2', '/nr:false', '/p:UseSharedCompilation=false')
                if ($phase -eq 'read') { $buildOptions = @('--no-build', '--no-restore') }
                Write-Host "IPFS persistence test phase: $phase"
                dotnet test $project --filter $testFilter --logger 'console;verbosity=normal' @buildOptions
                if ($LASTEXITCODE -ne 0) { throw "The IPFS persistence $phase phase failed." }
              } finally {
                Stop-KuboDaemon $daemon
                Write-Host "Stopped native Kubo process $($daemon.Id)"
              }
            }
          }
