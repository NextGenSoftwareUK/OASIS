name: AvalancheGo native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/avalanche-native-storage.yml'
      - 'Scripts/TestHosts/deploy-avalanche-ci-storage.cjs'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AvalancheOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AvalancheOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run native storage conformance against AvalancheGo
        shell: bash
        run: |
          image=docker.io/avaplatform/avalanchego@sha256:348fb2ab10bbf8b1b12ba34c57ae2982785e66a60b5d52b6c86b783104b8355e
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-avalanche.XXXXXXXX")"
          contract_root=Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.Web3CoreOASIS
          [[ ! -e "$contract_root/node_modules" ]]
          container=""
          image_owned=false
          cleanup() {
            status=$?
            cleanup_status=0
            if [[ -n "$container" ]]; then
              if (( status != 0 )); then docker logs --tail 35 "$container" || true; fi
              docker rm -fv "$container" || cleanup_status=1
            fi
            if [[ "$image_owned" == true ]] && docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || cleanup_status=1
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-avalanche.* ]]; then rm -rf -- "$fixture"; fi
            if [[ "$contract_root" == Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.Web3CoreOASIS ]]; then rm -rf -- "$contract_root/node_modules"; fi
            [[ ! -e "$fixture" && ! -e "$contract_root/node_modules" ]] || cleanup_status=1
            if (( cleanup_status == 0 )); then echo "Removed the owned AvalancheGo container, volumes and fixture."; else status=1; fi
            exit "$status"
          }
          trap cleanup EXIT
          if ! docker image inspect "$image" >/dev/null 2>&1; then image_owned=true; fi
          container="$(docker create -p 127.0.0.1:19650:9650 "$image" ./avalanchego \
            --network-id=local --http-host=0.0.0.0 --http-allowed-hosts=127.0.0.1,localhost \
            --bootstrap-ips= --bootstrap-ids= --sybil-protection-enabled=false \
            --snow-sample-size=1 --snow-preference-quorum-size=1 --snow-confidence-quorum-size=1)"
          docker start "$container" >/dev/null
          rpc=http://127.0.0.1:19650
          for attempt in {1..60}; do
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            if curl -fsS --max-time 3 -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"info.isBootstrapped","params":{"chain":"C"}}' "$rpc/ext/info" \
              | jq -e '.result.isBootstrapped == true' >/dev/null; then break; fi
            [[ "$attempt" != 60 ]]
            sleep 2
          done
          curl -fsS --max-time 5 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$rpc/ext/bc/C/rpc" \
            | jq -e '.result == "0xa868"'
          export OASIS_AVALANCHE_CI_FIXTURE="$fixture"
          export npm_config_cache="$fixture/npm-cache"
          npm ci --prefix "$contract_root" --no-audit --no-fund
          node Scripts/TestHosts/deploy-avalanche-ci-storage.cjs
          pwsh -NoProfile -Command '
            $settings = Get-Content -Raw (Join-Path $env:OASIS_AVALANCHE_CI_FIXTURE settings.json) | ConvertFrom-Json -AsHashtable
            foreach ($entry in $settings.GetEnumerator()) { [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value) }
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-AvalancheStorage -Operation {
              dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.AvalancheOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.AvalancheOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~AvalancheNativeStorageConformanceTests" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native Avalanche storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
