name: Qualify fluent model conventions on three native providers

on:
  push:
    branches: [work/cosmic-cql-ton-public]
    paths:
      - "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests/CqlV1Web4NativeTests.FluentConventions.cs"
      - ".github/workflows/qualify-cql-fluent-conventions-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27029/?replicaSet=oasisRecoveryRs&serverSelectionTimeoutMS=3000
    services:
      neo4j:
        image: neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
        env:
          NEO4J_AUTH: neo4j/oasis-local-test-only
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p oasis-local-test-only 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: OASIS
          submodules: true
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - name: Read reviewed dependency pins
        id: dependency
        working-directory: OASIS
        run: |
          python3 -B Scripts/validate_railway_dependency_manifest.py --require-gitlinks
          grep -E '^(LIBRARIES_COMMIT|HOLOCHAIN_COMMIT)=[0-9a-f]{40}$' Docker/oasis-dependency-versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependency.outputs.LIBRARIES_COMMIT }}
          path: NextGenSoftware-Libraries
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: holochain-open-dev/holochain-client-csharp
          ref: ${{ steps.dependency.outputs.HOLOCHAIN_COMMIT }}
          path: holochain-client-csharp
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start one owned loopback Mongo replica
        working-directory: OASIS
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cql-where-mongo -p 127.0.0.1:27029:27029 mongo:8.0.15 --port 27029 --replSet oasisRecoveryRs --bind_ip_all
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'rs.initiate({_id:"oasisRecoveryRs",members:[{_id:0,host:"127.0.0.1:27029"}]})'
          for attempt in $(seq 1 45); do
            if docker exec cql-where-mongo mongosh --port 27029 --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify fluent conventions on three native providers
        working-directory: OASIS
        shell: pwsh
        run: |
          $env:OASIS_CQL_MONGO_ENTITY_PROJECTION_ROOT=(Get-Location).Path
          New-Item -ItemType Directory TestResults/Neo4jCurrent | Out-Null
          & Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner cql-fluent-conventions-native-ci -Operation {
            dotnet test Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.Neo4jOASIS.IntegrationTests /m:2 /nr:false /p:UseSharedCompilation=false --filter 'FullyQualifiedName~NativeFluentConventionsShareWriteReadAndQueryNames' --results-directory TestResults/Neo4jCurrent --logger 'trx;LogFileName=mapping-native.trx'
            if ($LASTEXITCODE) { throw 'Native fluent model qualification failed' }
            [xml]$report=Get-Content TestResults/Neo4jCurrent/mapping-native.trx
            if ($report.TestRun.ResultSummary.Counters.passed -ne '3' -or $report.TestRun.ResultSummary.Counters.total -ne '3') { throw 'All three native selected-column HTTP journeys must pass' }
            foreach ($store in 'MongoDBOASIS','SQLLiteDBOASIS','Neo4jOASIS') {
              $e=Get-Content "TestResults/Neo4jCurrent/$store-fluent-conventions-native.json" -Raw | ConvertFrom-Json
              if ($e.provider -ne $store -or $e.checks -ne 5 -or $e.ownedCleanupIds -ne 1 -or $e.successfulHolonWrites -ne 2 -or @($e.queryElapsedMilliseconds.PSObject.Properties).Count -ne 4) { throw 'Incomplete native report' }
              if($e.nativeProviderVerified -ne $true -or $e.exactCleanupVerified -ne $true){throw 'Native fixture/cleanup acknowledgement missing'}
              foreach ($name in 'conventionStoredAndQueried','explicitAliasPrecedence','inheritedAnnotationPrecedence','immutableConventionSnapshot','collisionBeforeGetters') {
                if ($e.evidence.$name -ne $true) { throw "Missing native proof $name" }
              }
            }
            dotnet build ONODE/NextGenSoftware.OASIS.API.ONODE.WebAPI /m:2 /nr:false /p:UseSharedCompilation=false
            if ($LASTEXITCODE) { throw 'Actual WEB4 fluent model composition failed' }
          }
          $source=(git rev-parse HEAD).Trim()
          if($source -ne $env:GITHUB_SHA){throw 'Qualification source mismatch'}
          $core=(git -C "OASIS Architecture/NextGenSoftware.OASIS.API.Core" rev-parse HEAD).Trim()
          @{source=$source;core=$core;nativePassed=3;fluentConventionsVerified=$true;actualWeb4Compiled=$true;ownedFixturesAbsent=$true;sharedDatabaseCalls=0;deployed=$false} | ConvertTo-Json | Set-Content TestResults/Neo4jCurrent/source.json -Encoding utf8
      - name: Stop owned Mongo
        if: always()
        run: docker rm -f -v cql-where-mongo
      - name: Verify owned Mongo stopped
        if: always()
        shell: bash
        run: |
          if docker inspect cql-where-mongo >/dev/null 2>&1; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cql-fluent-conventions-native
          path: |
            OASIS/TestResults/Neo4jCurrent/mapping-native.trx
            OASIS/TestResults/Neo4jCurrent/*-fluent-conventions-native.json
            OASIS/TestResults/Neo4jCurrent/source.json
          if-no-files-found: ignore
          retention-days: 2
