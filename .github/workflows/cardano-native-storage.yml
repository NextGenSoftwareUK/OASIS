name: Cardano native storage

on:
  push:
    branches: [work/hyperdrive-triad]
    paths:
      - '.github/workflows/cardano-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.CardanoOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.CardanoOASIS.IntegrationTests/CardanoNativeStorageConformanceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run the shared core storage suite against a disposable Yaci DevKit devnet and Kubo
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-native.XXXXXXXX")"
          devkit="$(mktemp -d "$RUNNER_TEMP/yaci.XXXXXXXX")"
          kubo="" node_pid=""
          cleanup() {
            status=$?
            if [[ -n "$node_pid" ]]; then kill "$node_pid" 2>/dev/null || true; fi
            (cd "$devkit" && npx --yes @bloxbean/yaci-devkit@0.12.0 down >/dev/null 2>&1) || true
            if (( status != 0 )) && [[ -f "$devkit/devkit.log" ]]; then tail -n 60 "$devkit/devkit.log"; fi
            if [[ -n "$kubo" ]]; then docker rm -fv "$kubo" >/dev/null || status=1; fi
            [[ "$fixture" == "$RUNNER_TEMP"/oasis-native.* ]] && rm -rf -- "$fixture"
            [[ "$devkit" == "$RUNNER_TEMP"/yaci.* ]] && rm -rf -- "$devkit"
            exit "$status"
          }
          trap cleanup EXIT
          kubo="$(docker run -d -p 127.0.0.1:15001:5001 ipfs/kubo@sha256:97ece99cfccea95613ab3634f761d0200e9e8b1f49294b5428e19b5b9056759d daemon --offline)"
          (cd "$devkit" && npx --yes @bloxbean/yaci-devkit@0.12.0 up --enable-yaci-store > "$devkit/devkit.log" 2>&1) &
          node_pid=$!
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/api/v1/blocks/latest >/dev/null 2>&1 && curl -fsS -X POST http://127.0.0.1:15001/api/v0/version >/dev/null 2>&1; then break; fi
            [[ "$attempt" != 180 ]]; sleep 2
          done
          echo "Admin API topup paths:"
          curl -fsS http://127.0.0.1:10000/v3/api-docs | jq -r '.paths | keys[]' | grep -i -E "topup|fund" || true
          export OASIS_NATIVE_STORAGE_FIXTURE="$fixture" OASIS_CARDANO_API="http://127.0.0.1:8080/api/v1" OASIS_CARDANO_KUBO="http://127.0.0.1:15001" \
            OASIS_CARDANO_TOPUP_URL="http://127.0.0.1:10000/local-cluster/api/addresses/topup"
          dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.CardanoOASIS.IntegrationTests" \
            -p:NativeStorageConformance=true --filter "FullyQualifiedName~CardanoNativeStorageConformanceTests" \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal" || {
            api=http://127.0.0.1:8080/api/v1
            echo "== blocks/latest"; curl -sS "$api/blocks/latest" | head -c 1500; echo
            echo "== epochs/latest/parameters"; curl -sS "$api/epochs/latest/parameters" | head -c 1500; echo
            while read -r address; do
              echo "== utxos $address"; curl -sS "$api/addresses/$address/utxos" | head -c 1500; echo
              echo "== transactions $address"; curl -sS "$api/addresses/$address/transactions?order=asc&count=100&page=1" | head -c 1500; echo
            done < "$fixture/addresses"
            exit 1
          }
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/$mode.json" >/dev/null
          done
          echo "Cardano passed both storage modes against a local devnet."
