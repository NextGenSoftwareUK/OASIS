name: Memcached native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/memcached-native-storage.yml'
      - 'Providers/Storage/NextGenSoftware.OASIS.API.Providers.MemcachedOASIS/**'
      - 'Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.MemcachedOASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run native storage conformance against Memcached
        shell: bash
        run: |
          runtime=/var/tmp/oasis-runtimes/memcached-1.6.40
          archive=/var/tmp/oasis-runtimes/.downloads/memcached_1.6.40-1ubuntu0.3_amd64.deb
          [[ ! -e "$runtime" && ! -e "$archive" ]]
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-memcached.XXXXXXXX")"
          pids=()
          cleanup() {
            status=$?
            for pid in "${pids[@]}"; do
              kill -TERM "$pid" 2>/dev/null || true
              wait "$pid" || true
            done
            if (( status != 0 )); then
              for log in "$fixture"/*.log; do if [[ -f "$log" ]]; then tail -20 "$log"; fi; done
            fi
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-memcached.* ]]; then rm -rf -- "$fixture" "$runtime"; rm -f -- "$archive"; fi
            if [[ ! -e "$fixture" && ! -e "$runtime" && ! -e "$archive" ]]; then
              echo "Removed the owned Memcached daemons, runtime and fixtures."
            else
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          mkdir -p "$(dirname "$runtime")"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libevent-2.1-7t64 liblua5.4-0
          sudo apt-get clean
          if ! python3 Scripts/TestHosts/prepare-cosmic-memcached-linux.py; then
            if [[ -x "$runtime/usr/bin/memcached" ]]; then ldd "$runtime/usr/bin/memcached"; fi
            exit 1
          fi
          for port in 11231 11232; do
            "$runtime/usr/bin/memcached" -l 127.0.0.1 -p "$port" -U 0 -m 16 >"$fixture/$port.log" 2>&1 &
            pids+=("$!")
            for attempt in {1..20}; do
              kill -0 "${pids[-1]}"
              if (exec 3<>"/dev/tcp/127.0.0.1/$port"; printf 'version\r\n' >&3; read -r -t 2 version <&3; [[ "$version" == 'VERSION 1.6.40'* ]]) 2>/dev/null; then break; fi
              [[ "$attempt" != 20 ]]
              sleep 1
            done
          done
          export OASIS_MEMCACHED_CI_FIXTURE="$fixture"
          pwsh -NoProfile -Command '
            ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-MemcachedStorage -Operation {
              dotnet test "Providers/Storage/TestProjects/NextGenSoftware.OASIS.API.Providers.MemcachedOASIS.IntegrationTests/NextGenSoftware.OASIS.API.Providers.MemcachedOASIS.IntegrationTests.csproj" --filter "FullyQualifiedName~CoreStorageSuiteAgainstMemcached" /p:MemcachedDirectStorageOnly=true /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) { throw "Native Memcached storage verification failed." }
            }'
          for mode in async sync; do
            jq -e '.Succeeded and .FixtureCleanupComplete and (.Passed | length == 26)' "$fixture/oasis_storage_$mode.json" >/dev/null
          done
          echo "Verified both Memcached storage modes and exact native cleanup."
