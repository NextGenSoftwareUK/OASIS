name: NEAR native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - 'Scripts/TestHosts/near-local/contract/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.NEAROASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.NEAROASIS.IntegrationTests/NearSharedLifecycleTests.cs'
  workflow_dispatch:
  workflow_call:
    inputs:
      routing:
        type: boolean
        default: false
    secrets:
      PRIVATE_SUBMODULE_PAT:
        required: true

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
    steps:
      - name: Resolve the Development baseline
        if: inputs.routing
        id: baseline
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/Development" --jq .object.sha)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Qualifying priority NEAR routing on Development $revision"

      - uses: actions/checkout@v7
        if: inputs.routing
        with:
          path: provider-source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          ref: ${{ steps.baseline.outputs.revision || github.sha }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Apply the reviewed priority NEAR routing scope
        if: inputs.routing
        shell: bash
        run: |
          base=df02d6f43bfe282017cb236366c15940391a864c
          git -C ../provider-source fetch --no-tags --depth=1 origin "$base"
          near='Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.NEAROASIS.IntegrationTests'
          for path in "$near/NextGenSoftware.OASIS.API.Providers.NEAROASIS.IntegrationTests.csproj" \
            "$near/NearSqliteHyperDriveTests.cs" \
            'Scripts/TestHosts/near-local/run-fresh-managed-lifecycle.mjs' \
            'Providers/Shared/TestSupport/NativePriorityRouting.cs'; do
            current="$(git ls-tree HEAD -- "$path")"
            reviewed="$(git -C ../provider-source ls-tree "$base" -- "$path")"
            incoming="$(git -C ../provider-source ls-tree HEAD -- "$path")"
            [[ -n "$incoming" && ( "$current" == "$reviewed" || "$current" == "$incoming" ) ]]
            install -m 644 "../provider-source/$path" "$path"
            git add -- "$path"
          done
          echo "Qualified input tree: $(git write-tree)"

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build the locked NEAR contract
        working-directory: OASIS/Scripts/TestHosts/near-local
        run: |
          npm ci --no-audit --no-fund
          npm run build:contract

      - name: Verify the shipping managed adapter on NEAR Sandbox
        working-directory: OASIS/Scripts/TestHosts/near-local
        env:
          OASIS_NEAR_FRESH_MANAGED_LIFECYCLE: '1'
          OASIS_NEAR_FRESH_ROUTING: ${{ inputs.routing && '1' || '0' }}
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-near.XXXXXXXX")"
          cleanup() {
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-near.* && -d "$fixture" ]]; then
              rm -rf -- "$fixture"
              test ! -e "$fixture"
              echo "Removed the owned NEAR sandbox and test reports."
            fi
          }
          trap cleanup EXIT
          TMPDIR="$fixture" OASIS_NEAR_FRESH_REPORT_ROOT="$fixture/reports" node run-fresh-managed-lifecycle.mjs
