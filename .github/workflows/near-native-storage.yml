name: NEAR native storage

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - 'Scripts/TestHosts/near-local/run-fresh-managed-lifecycle.mjs'
      - 'Scripts/TestHosts/near-local/contract/**'
      - '.github/workflows/near-native-storage.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.NEAROASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.NEAROASIS.IntegrationTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false

      - name: Read the recorded Libraries revision
        id: dependencies
        shell: bash
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build the locked NEAR contract
        working-directory: OASIS/Scripts/TestHosts/near-local
        run: |
          npm ci --no-audit --no-fund
          npm run build:contract

      - name: Verify the shipping managed adapter on NEAR Sandbox
        working-directory: OASIS/Scripts/TestHosts/near-local
        env:
          OASIS_NEAR_FRESH_MANAGED_LIFECYCLE: '1'
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/oasis-near.XXXXXXXX")"
          cleanup() {
            if [[ "$fixture" == "$RUNNER_TEMP"/oasis-near.* && -d "$fixture" ]]; then
              rm -rf -- "$fixture"
              test ! -e "$fixture"
              echo "Removed the owned NEAR sandbox and test reports."
            fi
          }
          trap cleanup EXIT
          TMPDIR="$fixture" OASIS_NEAR_FRESH_REPORT_ROOT="$fixture/reports" node run-fresh-managed-lifecycle.mjs
