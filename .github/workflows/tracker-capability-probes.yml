name: Cross-chain tracker capability probes

on:
  push:
    branches: [work/tracker-capability-probes]
    paths:
      - '.github/workflows/tracker-capability-probes.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.AxelarOASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.HyperlaneOASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.LayerZeroV2OASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.deBridgeOASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.ChainflipOASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.ChainlinkFunctionsOASIS/**'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.EigenLayerOASIS/**'
      - 'Providers/AI/NextGenSoftware.OASIS.API.Providers.RitualOASIS/**'
      - 'Providers/AI/NextGenSoftware.OASIS.API.Providers.BittensorOASIS/**'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.BlockscoutOASIS/**'
      - 'Providers/Network/NextGenSoftware.OASIS.API.Providers.ENSOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.Providers.CrossChainTrackers.CapabilityTests/**'
  schedule:
    - cron: '17 5 * * 1' # weekly: public APIs drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: OASIS
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run capability-v1 against the public Axelar, Hyperlane, LayerZero, deBridge, Chainflip and Chainlink Functions and EigenLayer (contract eth_call)
        run: |
          set -euo pipefail
          reports="$(mktemp -d "$RUNNER_TEMP/oasis-capability.XXXXXXXX")"
          OASIS_TRACKER_PUBLIC_LIVE=1 OASIS_CAPABILITY_REPORTS="$reports" dotnet test \
            Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.Providers.CrossChainTrackers.CapabilityTests \
            -m:2 -nr:false -p:UseSharedCompilation=false --logger "console;verbosity=normal"
          for provider in AxelarOASIS HyperlaneOASIS LayerZeroV2OASIS deBridgeOASIS ChainflipOASIS ChainlinkFunctionsOASIS EigenLayerOASIS RitualOASIS BittensorOASIS BlockscoutOASIS ENSOASIS; do
            jq -e '.Succeeded and .SuiteVersion == "capability-v1" and (.Passed | length == 5) and .Observation.ReadOnly and .Observation.RoundTrips > 0' \
              "$reports/$provider.json" >/dev/null
            jq -c '{Provider, Observation}' "$reports/$provider.json"
          done
