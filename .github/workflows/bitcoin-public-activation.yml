name: Bitcoin public activation

on:
  push:
    branches: [work/hyperdrive-provider-completion]
    paths:
      - '.github/workflows/bitcoin-public-activation.yml'
      - 'Providers/Blockchain/NextGenSoftware.OASIS.API.Providers.BitcoinOASIS/**'
      - 'Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.BitcoinOASIS.IntegrationTests/BitcoinOASISIntegrationTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OASIS
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          path: OASIS
          submodules: recursive
          persist-credentials: false
      - name: Read the recorded Libraries revision
        id: dependencies
        run: |
          revision="$(sed -n 's/^LIBRARIES_COMMIT=//p' Docker/oasis-dependency-versions.env)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "libraries=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NextGenSoftwareUK/NextGenSoftware-Libraries
          ref: ${{ steps.dependencies.outputs.libraries }}
          path: NextGenSoftware-Libraries
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify provider lifecycle and transaction reads through public Esplora
        shell: pwsh
        run: |
          ./Scripts/TestHosts/Invoke-WithProviderBuildLease.ps1 -Owner CI-BitcoinPublicActivation -Operation {
            dotnet test "Providers/Blockchain/TestProjects/NextGenSoftware.OASIS.API.Providers.BitcoinOASIS.IntegrationTests" --filter "FullyQualifiedName~EsploraActivationSurvivesDeactivation|FullyQualifiedName~EsploraOrdinaryTransactionDoesNotProduceAHolon|FullyQualifiedName~EsploraReportsFundedAddressBalance" /m:2 /nr:false /p:UseSharedCompilation=false --logger "console;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { throw "Bitcoin public activation verification failed." }
          }
