<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Owned Karma browser verification</title><link rel="stylesheet" href="/assets/css/style.css"></head><body>
<button id="fixture-open-ledger" onclick="window.openKarmaLedgerModal()">Karma Ledger</button>
<button id="fixture-open-activity" onclick="window.openActivityFeedModal()">Activity</button>
<div class="modal js-modal"></div>
<script src="/assets/js/oasis-web4-sdk.js"></script>
<script>
window.user=JSON.parse(localStorage.getItem('avatar'));
window.oasisClient=new window.OASISClient({baseUrl:location.origin,persistSession:false});
window.oasisClient.setToken(sessionStorage.getItem('ownedKarmaBearer'),{avatarId:window.user.id});
sessionStorage.removeItem('ownedKarmaBearer');window.jwtReadyPromise=Promise.resolve();
</script>
<script src="/assets/js/karma-ledger-modal.js"></script><script src="/assets/js/activity-feed-modal.js"></script>
<script>
Promise.all(['karma-ledger','activity-feed'].map(async function(route){
var response=await fetch('/assets/components/modals/'+route+'.html');if(!response.ok)throw new Error('Actual Karma fragment missing.');
var host=document.createElement('div');host.innerHTML=await response.text();document.querySelector('.js-modal').appendChild(host);
})).then(function(){window.__karmaReady=true;});
</script></body></html>
