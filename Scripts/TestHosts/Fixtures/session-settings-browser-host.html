<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Owned Settings session verification</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/modals-new.css">
  <link rel="stylesheet" href="/assets/css/oasis-advanced-modals.css">
  <link rel="stylesheet" href="/assets/css/oasis-portal-extra.css">
  <link rel="stylesheet" href="/assets/css/oasis-portal-extra2.css">
</head>
<body>
  <div class="nav__item--account"><img class="avatar" alt="Avatar"></div>
  <p id="fixture-session-state"></p>
  <button id="fixture-open-settings" type="button" disabled onclick="window.openSettingsModal('security')">Open Security settings</button>
  <div class="modal js-modal"></div>
  <script src="/assets/js/jquery.js"></script>
  <script src="/assets/js/oasis-web4-sdk.js"></script>
  <script>
    var API_BASE=location.origin;
    window.API_BASE=API_BASE;window.apiUrl=API_BASE;
    window.oasisClient=new window.OASISClient({baseUrl:API_BASE,persistSession:false});
    var owner=JSON.parse(localStorage.getItem('avatar')||'null');
    if(owner&&owner.jwtToken)window.oasisClient.setToken(owner.jwtToken,{avatarId:owner.id});
    document.getElementById('fixture-session-state').textContent=owner&&owner.jwtToken?'Signed in':'Signed out';
  </script>
  <script src="/assets/js/scripts.js"></script>
  <script src="/assets/js/settings-modal.js"></script>
  <script>
    fetch('/assets/components/modals/settings.html').then(function(response){
      if(!response.ok)throw new Error('Actual Settings fragment could not be loaded.');
      return response.text();
    }).then(function(html){
      document.querySelector('.js-modal').innerHTML=html;
      window.dispatchEvent(new CustomEvent('portal-modal-ready',{detail:{route:'settings'}}));
      document.getElementById('fixture-open-settings').disabled=!(owner&&owner.jwtToken);
    });
  </script>
</body>
</html>
