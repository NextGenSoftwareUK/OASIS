<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Owned catalogue browser</title>
<link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/dashboard.css"><link rel="stylesheet" href="/assets/css/modals-new.css"><link rel="stylesheet" href="/assets/css/oasis-advanced-modals.css">
<link rel="stylesheet" href="/assets/css/oasis-portal-extra.css"><link rel="stylesheet" href="/assets/css/oasis-portal-extra2.css">
</head><body><button id="fixture-games" onclick="window.openGamesModal()">Games</button>
<button id="fixture-oapps" onclick="window.openOAPPsModal()">OAPPs</button>
<button id="fixture-inventory" onclick="window.openInventoryModal()">Inventory</button><div class="modal js-modal"></div>
<script src="/assets/js/oasis-web4-sdk.js"></script><script src="/assets/js/oasis-web5-sdk.js"></script><script>
window.user=JSON.parse(localStorage.getItem('avatar'));var bearer=sessionStorage.getItem('ownedCatalogueBearer');
window.oasisClient=new window.OASISClient({baseUrl:location.origin,persistSession:false});
window.starClient=new window.STARClient({baseUrl:location.origin,persistSession:false});
window.oasisClient.setToken(bearer,{avatarId:window.user.id});window.starClient.setToken(bearer,{avatarId:window.user.id});
sessionStorage.removeItem('ownedCatalogueBearer');bearer=null;window.jwtReadyPromise=Promise.resolve();
</script><script src="/assets/js/games-modal.js"></script><script src="/assets/js/oapps-modal.js"></script>
<script src="/assets/js/inventory-modal.js"></script><script>
Promise.all(['games','oapps','inventory'].map(async function(route){var response=await fetch('/assets/components/modals/'+route+'.html');
if(!response.ok)throw new Error('Actual fragment unavailable: '+route);var host=document.createElement('div');host.innerHTML=await response.text();
document.querySelector('.js-modal').appendChild(host);window.dispatchEvent(new CustomEvent('portal-modal-ready',{detail:{route:route}}));
})).then(function(){window.__storefrontReady=true;});</script></body></html>
